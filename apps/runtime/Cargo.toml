[package]
name = "armadra-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "armadra_runtime"
path = "src/lib.rs"

[[bin]]
name = "armadra-runtime"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["ws", "macros"] }
base64 = "0.22.1"
bytes = "1.10.1"
chrono = { version = "0.4.42", features = ["serde"] }
futures-util = "0.3.31"
hmac = "0.12.1"
mime_guess = "2.0.5"
portable-pty = "0.9.0"
rand = "0.9.5"
regex = "1.11.2"
# Usage pill only (plan §19): two GETs every five minutes. rustls so the
# binary does not depend on the host OpenSSL.
reqwest = { version = "0.13.4", default-features = false, features = [
    "json",
    "rustls",
    "http2",
    "charset",
    "system-proxy",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "migrate"] }
subtle = "2.6.1"
thiserror = "2.0.17"
tokio = { version = "1.53.1", features = ["full"] }
toml_edit = "0.25.13"
tower-http = { version = "0.7.0", features = ["cors", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
uuid = { version = "1.24.0", features = ["v4", "v7", "serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.176"

[dev-dependencies]
tempfile = "3.23.0"
tokio-tungstenite = "0.29.0"
tower = { version = "0.5.2", features = ["util"] }
