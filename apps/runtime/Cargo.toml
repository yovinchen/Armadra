[package]
name = "armadra-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "armadra_runtime"
path = "src/lib.rs"

[[bin]]
name = "armadra-runtime"
path = "src/main.rs"

[dependencies]
# The Worker reaches the live Runtime over the same private local endpoint the
# hook client uses: same file, same app bearer, same hand-rolled HTTP/1.1 client.
armadra-hook = { path = "../../crates/hook" }
armadra-protocol = { path = "../../crates/protocol" }
anyhow = "1.0.100"
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["ws", "macros", "multipart"] }
base64 = "0.22.1"
bytes = "1.10.1"
chrono = { version = "0.4.42", features = ["serde"] }
futures-util = "0.3.31"
hmac = "0.12.1"
mime_guess = "2.0.5"
# Editor external-change watching (E01/M4): FSEvents / inotify /
# ReadDirectoryChanges behind one API. Pinned so a platform backend never
# changes under us without a lockfile review.
notify = "8.2.0"
portable-pty = "0.9.0"
rand = "0.9.5"
regex = "1.11.2"
# Usage pill only (plan §19): two GETs every five minutes. rustls so the
# binary does not depend on the host OpenSSL. `form` is for the GitHub device
# flow (roadmap §4.2), whose grant is specified as form-encoded.
reqwest = { version = "0.13.4", default-features = false, features = [
    "json",
    "form",
    "rustls",
    "http2",
    "charset",
    "system-proxy",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "migrate"] }
subtle = "2.6.1"
# Host / session resource sampling (T02). Pinned: the per-platform metric
# backends change between minor releases, and the panel promises "unknown"
# rather than a number that quietly changed meaning.
sysinfo = "=0.39.6"
thiserror = "2.0.17"
tokio = { version = "1.53.1", features = ["full"] }
# CDP transport for the controlled browser (B01). Loopback `ws://` only — the
# DevTools endpoint is never TLS — so no TLS feature is enabled here.
tokio-tungstenite = "0.29.0"
toml_edit = "0.25.13"
tower-http = { version = "0.7.0", features = ["cors", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
uuid = { version = "1.24.0", features = ["v4", "v7", "serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.176"

[target.'cfg(windows)'.dependencies]
# T01: the Windows terminal backend talks to `armadra-session-host`. The
# protocol, session table and replay rules live in that crate and are unit
# tested there on every platform; only this dependency is Windows-only,
# because only Windows has a session host to talk to.
armadra-session-host = { path = "../../crates/session-host" }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Power", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[dev-dependencies]
tempfile = "3.23.0"
tower = { version = "0.5.2", features = ["util"] }
