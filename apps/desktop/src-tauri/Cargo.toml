[package]
name = "armadra-desktop"
default-run = "Armadra"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# The shell's own logic is a library so `tests/` can drive it without opening a
# window (docs/design/updates-and-service-install.md §5.2); the binary is only
# the Tauri builder around it.
[lib]
name = "armadra_desktop"
path = "src/lib.rs"

[[bin]]
name = "Armadra"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
armadra-protocol = { path = "../../../crates/protocol" }
# minisign 的公钥与签名都是 base64 包着的定长结构；壳只读密钥标识用来判断
# 「这条清单是不是本机公钥签的」，真正的验签仍然由 Tauri updater 做。
base64 = "0.22.1"
bytes = "1.10.1"
http = "1.5.0"
http-body-util = "0.1.5"
# The `armadra://` protocol handler replays WebView requests on the Runtime's
# Unix socket / named pipe. reqwest cannot dial either, so the client half of
# hyper is used directly over the stream we opened ourselves.
hyper = { version = "1.11.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["tokio"] }
reqwest = { version = "0.13.1", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
# `tauri::generate_context!` 会把 tauri.conf.json 的 `plugins` 段展开成
# `serde_json::from_str`，所以即使代码里不直接用也必须在依赖里。
serde_json = "1.0.145"
# 更新包的摘要复核（S03 §2.2「摘要谁验」）：Tauri 验签，壳按 Host 给的 sha256
# 再算一次，两者都过才安装。
sha2 = "0.10.9"
# `tray-icon` 提供托盘（§17 Tauri）；`image-png` 让托盘直接吃 bundle 里的 PNG 图标。
tauri = { version = "2.10.2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-dialog = "2.7.3"
# 系统级全局热键（快捷键页的 `global` 作用域）。默认一个都不注册：一个全局
# 热键在别的应用里也会触发，装上它必须是用户明确做的事。
tauri-plugin-global-shortcut = "2.3.0"
tauri-plugin-notification = "2.4.0"
tauri-plugin-opener = "2.5.5"
# 自动更新契约（S03 / 路线图 §3.12）。插件只做「查一下」，安装仍是人的动作；
# 没有 pubkey 时 `updates.rs` 直接报「未配置」，不会去问一个无法验证的来源。
tauri-plugin-updater = "2.10.1"
tokio = { version = "1.53.1", features = ["time", "process", "io-util", "macros", "rt", "sync", "net"] }
# 更新清单地址必须和发布资产同源同一次发布（S03 §2.2），所以要真的解析 URL，
# 而不是拿字符串前缀去比。
url = "2.5.8"

# 侧栏毛玻璃（§24.2「源列表侧栏」/「一致的窗口 chrome」）。只有 macOS 用得上，
# 所以按目标平台挂依赖：Linux/Windows 上既不下载也不编译它。
[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.6.0"

[dev-dependencies]
tempfile = "3.23.0"

[features]
# Compiles the page diagnostic bridge into a release binary for one-off
# investigations of the packaged webview; never enabled by the bundle scripts.
diagnostic-bridge = []
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
