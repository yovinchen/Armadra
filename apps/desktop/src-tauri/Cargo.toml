[package]
name = "armadra-desktop"
default-run = "Armadra"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "Armadra"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
armadra-protocol = { path = "../../../crates/protocol" }
bytes = "1.10.1"
http = "1.5.0"
http-body-util = "0.1.5"
# The `armadra://` protocol handler replays WebView requests on the Runtime's
# Unix socket / named pipe. reqwest cannot dial either, so the client half of
# hyper is used directly over the stream we opened ourselves.
hyper = { version = "1.11.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["tokio"] }
reqwest = { version = "0.13.1", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
# `tauri::generate_context!` 会把 tauri.conf.json 的 `plugins` 段展开成
# `serde_json::from_str`，所以即使代码里不直接用也必须在依赖里。
serde_json = "1.0.145"
# `tray-icon` 提供托盘（§17 Tauri）；`image-png` 让托盘直接吃 bundle 里的 PNG 图标。
tauri = { version = "2.10.2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-notification = "2.4.0"
tauri-plugin-opener = "2.5.5"
tokio = { version = "1.53.1", features = ["time", "process", "io-util", "macros", "rt", "sync", "net"] }

# 侧栏毛玻璃（§24.2「源列表侧栏」/「一致的窗口 chrome」）。只有 macOS 用得上，
# 所以按目标平台挂依赖：Linux/Windows 上既不下载也不编译它。
[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.6.0"

[dev-dependencies]
tempfile = "3.23.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
