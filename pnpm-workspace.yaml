packages:
  - apps/web
  - apps/desktop
  - packages/*

allowBuilds:
  esbuild: true
  # Electron's postinstall is what downloads the runtime binary; without it
  # `electron-vite dev` has nothing to launch.
  electron: true
  # electron-builder's Squirrel.Windows dependency; unused (we ship NSIS, not
  # Squirrel), so its postinstall script does not need to run.
  electron-winstaller: false
  # Deliberately false. node-pty's own install script compiles against the
  # *Node* ABI, and what this repository needs is a patched source compiled
  # against *Electron's* — so `apps/desktop/scripts/ensure-electron.mjs` runs
  # `patch-node-pty.mjs` and then `electron-rebuild` instead. Letting pnpm
  # build it here would produce an artefact that is both unpatched and, in the
  # shell, unloadable.
  node-pty: false

minimumReleaseAgeExclude:
  - "@xyflow/react@12.11.3"
  - "@xyflow/system@0.0.80"
  - react-resizable-panels@4.12.4
  - electron@42.11.6

storeDir: .pnpm-store
