[package]
name = "armadra-session-host"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Windows session host: owns ConPTY sessions so terminals outlive the Worker and the UI"

[lib]
name = "armadra_session_host"
path = "src/lib.rs"

[[bin]]
name = "armadra-session-host"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"

# The protocol, the session table and the replay buffer are platform
# independent on purpose: they carry the rules that have to be tested, and a
# macOS or Linux developer must be able to run those tests. Only the pieces
# that genuinely need Win32 — ConPTY, Job Objects, named pipes, SIDs — are
# behind `cfg(windows)`, which is also why those dependencies are.
[target.'cfg(windows)'.dependencies]
portable-pty = "0.9.0"
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "time",
] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.23.0"
