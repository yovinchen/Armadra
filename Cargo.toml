[workspace]
resolver = "2"
members = ["apps/runtime", "apps/desktop/src-tauri", "crates/armadra-hook"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Armadra contributors"]

# The hook client ships as a Tauri sidecar and runs on the hot path of every
# agent hook event, so it is tuned for size rather than throughput. These keys
# are scoped to the package so the runtime keeps the default release profile;
# `lto` and `panic` cannot be set per package, and with a two-crate dependency
# graph and `codegen-units = 1` they buy very little here.
[profile.release.package.armadra-hook]
opt-level = "z"
codegen-units = 1
strip = true
