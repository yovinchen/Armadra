# 作业矩阵见 docs/design/repository-structure.md §4。
# 路径过滤用一次 git diff 算出，不引入第三方 action：repo 作业永远跑，
# 其余作业只在自己关心的路径有改动时跑。
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: "11.18.0"
  NODE_VERSION: "22"
  GO_VERSION: "1.24"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      rust: ${{ steps.filter.outputs.rust }}
      host: ${{ steps.filter.outputs.host }}
      protocol: ${{ steps.filter.outputs.protocol }}
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            git fetch --no-tags --depth=200 origin "${{ github.base_ref }}"
            changed="$(git diff --name-only "$(git merge-base "$base" HEAD)" HEAD)"
          else
            changed="$(git diff --name-only "${{ github.event.before }}" HEAD 2>/dev/null || git ls-files)"
          fi
          printf '%s\n' "$changed"
          emit() {
            if printf '%s\n' "$changed" | grep -qE "$2"; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
            fi
          }
          emit web '^(apps/web/|packages/|pnpm-lock\.yaml|package\.json|tsconfig\.base\.json)'
          emit rust '^(apps/runtime/|apps/desktop/|crates/|Cargo\.(toml|lock))'
          emit host '^(apps/host/|proto/)'
          emit protocol '^(proto/|crates/protocol/|packages/protocol|apps/host/gen/|tools/protocol\.mjs)'
          emit desktop '^(apps/desktop/|apps/web/|crates/|apps/runtime/)'

  repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/host/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @armadra/shared build
      - run: pnpm repo:test
      # 发布脚本与工作流校验：release.yml 只在推标签时跑，这里是它唯一会被
      # 提前发现问题的地方。
      - run: pnpm release:test
      - run: pnpm check

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @armadra/shared build
      - run: pnpm -r --if-present test
      - run: pnpm -r --if-present typecheck
      - run: pnpm --filter @armadra/web build

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: 安装 Tauri 的 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 准备 sidecar 占位（Tauri 的 externalBin 校验要求文件存在）
        run: pnpm --filter @armadra/desktop prepare:sidecar
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  host:
    needs: changes
    if: needs.changes.outputs.host == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/host/go.sum
      - run: go -C apps/host vet ./...
      - run: go -C apps/host test -race ./...
      - name: 交叉编译 Windows 与 Linux
        run: |
          GOOS=windows GOARCH=amd64 go -C apps/host build ./...
          GOOS=linux GOARCH=amd64 go -C apps/host build ./...

  protocol:
    needs: changes
    if: needs.changes.outputs.protocol == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/host/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: 生成物与提交内容一致
        run: pnpm protocol:check
      - name: 三端契约测试
        run: pnpm protocol:test

  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/host/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @armadra/desktop test
      - run: pnpm --filter @armadra/desktop prepare:sidecar
      - run: pnpm --filter @armadra/shared build
      - run: pnpm --filter @armadra/desktop exec tauri build --debug
