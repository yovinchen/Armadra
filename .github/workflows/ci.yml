# 作业矩阵见 docs/guides/ci-release.md。
#
# 一个矩阵作业跑三种 runner：同一串检查在 Linux、macOS 与 Windows 上各跑一遍，
# 因为这个仓库的平台差异不在前端而在 Runtime——tmux 与 Unix socket 在 Windows
# 上换成 ConPTY 与命名管道，只有真的在三个系统上编译过才知道换得对不对。
# 平台相关的用例用 `cfg(unix)` / `cfg(target_os = ...)` 在源码里门控，CI 不做
# 任何按名字过滤的测试排除：一条在 Windows 上不该跑的用例，应该在 Windows 上
# 压根不存在。
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PNPM_VERSION: "11.18.0"
  NODE_VERSION: "22"
  GO_VERSION: "1.24"
  CARGO_TERM_COLOR: always
  # 一次 `cargo test --workspace` 要链接四十多个测试二进制；带完整调试信息时
  # 它们在 ubuntu runner 的 14 GB 磁盘上放不下，链接器会以 Bus error 收场
  # （2026-09-13 的第一次真实 dry-run）。测试不需要行号以外的调试信息。
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  CARGO_INCREMENTAL: "0"
  # Runtime 的 Git 操作（merge / cherry-pick / amend）用仓库或全局配置里的身份
  # 提交；runner 两者都没有，Git 会在动树之前拒绝，测试就把它记成
  # unknownOutcome。开发机上是全局配置在兜底，这里由环境变量兜。
  GIT_AUTHOR_NAME: Armadra CI
  GIT_AUTHOR_EMAIL: ci@armadra.invalid
  GIT_COMMITTER_NAME: Armadra CI
  GIT_COMMITTER_EMAIL: ci@armadra.invalid
  RUST_BACKTRACE: "1"

jobs:
  check:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            label: linux-x86_64
            # cgo 是 -race 的前提，Linux 与 macOS runner 都自带 C 编译器。
            go_race: "-race"
          - runner: macos-14
            label: macos-aarch64
            go_race: "-race"
          - runner: windows-latest
            label: windows-x86_64
            # windows/amd64 的 race detector 需要外部 gcc，镜像里没有可依赖的
            # 一个；这里跑不带 race 的同一批用例，竞态由另外两个平台覆盖。
            go_race: ""
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/host/go.sum
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.label }}
          workspaces: . -> target

      # Tauri 2 在 Linux 上链接 WebKitGTK；没有这些头文件 armadra-desktop 连
      # cargo check 都过不去（glib-sys 的 build script 先用 pkg-config 找它们）。
      - name: 安装 Tauri 的 Linux 系统依赖
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - run: pnpm install --frozen-lockfile

      # pnpm check = libs:build + prettier + cargo fmt + typecheck +
      # protocol:check + repo:check + ci:workflows + release:check。
      # 三个平台都跑：换行、路径分隔符与生成物字节比对都是平台差异的常见出口。
      - run: pnpm check

      # shell: bash 不是装饰：Windows 默认的 pwsh 只看多行 run 里最后一条命令的
      # 退出码，前面失败了照样算通过。
      - name: 仓库与发布脚本自检
        shell: bash
        run: |
          set -euo pipefail
          pnpm repo:test
          pnpm release:test

      # Web、shared、protocol、host-client 与桌面脚本的测试与类型检查。
      - run: pnpm -r --if-present test
      - run: pnpm -r --if-present typecheck
      - run: pnpm --filter @armadra/web build

      - name: 三端协议契约
        run: pnpm protocol:test

      - name: Rust lint
        run: cargo clippy --workspace --exclude armadra-desktop --all-targets -- -D warnings

      - name: Rust 测试
        run: cargo test --workspace --exclude armadra-desktop

      - name: Go vet 与测试
        shell: bash
        run: |
          set -euo pipefail
          go -C apps/host vet ./...
          go -C apps/host test ${{ matrix.go_race }} -count=1 ./...

      # 桌面壳只做 cargo check：打包是发布流水线的事，这里要的是「三个平台的
      # Rust 代码都编译得过」。externalBin 必须存在，但不必是真的二进制。
      - name: 桌面壳 cargo check
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @armadra/desktop prepare:sidecar-placeholders
          cargo check -p armadra-desktop --all-targets

      # Host 要能为另外两个平台交叉编译：sidecar 打包时就是这么做的。
      - name: Go 交叉编译另外两个平台
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          GOOS=windows GOARCH=amd64 go -C apps/host build ./...
          GOOS=darwin GOARCH=arm64 go -C apps/host build ./...
          GOOS=linux GOARCH=arm64 go -C apps/host build ./...
