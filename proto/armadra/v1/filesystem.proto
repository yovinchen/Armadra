syntax = "proto3";

package armadra.v1;

option go_package = "armadra.local/host/gen/armadra/v1";

import "armadra/v1/canvas.proto";
import "armadra/v1/common.proto";

// The filesystem domain's registration record (Go Host 业务所有权迁移 §2.5).
//
// What moves to the Host in this domain is deliberately narrow: **where a
// workspace's files are and who may touch them**. The files themselves do not
// move and cannot: reading, writing, watching, searching and every Git command
// run on the execution host, and they keep running there whichever side owns
// this record. A Host that "owned the filesystem" in the sense of holding bytes
// would be a second copy of the project, which is the one thing a workspace
// root must never be.
//
// So a `WorkspaceRoot` answers three questions and no others:
//
//  1. **Which machine.** `execution_host_id` empty means this machine; anything
//     else names a `settings.ssh.hosts[].id` whose Worker holds the files.
//  2. **Which directory.** `canonical_path` is frozen at registration by the
//     Worker that owns it, so a symlink swapped in later cannot silently move
//     a workspace, and `proof_sha256` is the remote Worker's own registration
//     proof for a root this Host has no way to canonicalize itself.
//  3. **What is allowed.** `permissions` is the read/write/execute decision the
//     Runtime used to make from `workspaces.permissions_json`. Once the Host
//     owns this domain it is the Host's decision, and the Runtime's proxy
//     narrowing reads it from here rather than from its own row.
//
// `permissions` and `receipt` reuse the canvas messages rather than introducing
// parallel spellings, for the same reason `ownership.proto` reuses
// `CanvasOwnershipOwner`: they are the same values on the wire, and a second
// spelling of "read, write, execute" would be one more thing to keep in
// agreement.

// One workspace's registered root. `revision` is the CAS token: a change states
// the revision it read, and 0 means "this workspace has never been registered".
// A tombstone keeps its revision, so re-registering a workspace that was
// unregistered has to name the tombstone rather than start from zero.
message WorkspaceRoot {
  string workspace_id = 1;
  // Empty means this machine. A non-empty value is a `settings.ssh.hosts[].id`
  // and the path below is a path on *that* host, never on this one.
  string execution_host_id = 2;
  // Frozen at registration by whichever Worker owns the files. It is never
  // re-canonicalized afterwards: a root that resolved differently later is a
  // difference to report, not a value to update.
  string canonical_path = 10;
  // The remote Worker's registration proof (H02). Empty for a local root,
  // where this Host canonicalized the path itself.
  bytes proof_sha256 = 11;
  // Read, write and execute for this workspace. Execute is what lets a client
  // make the machine run something; a device with write but not execute can
  // edit a file and cannot start a terminal.
  CanvasWorkspacePermissions permissions = 12;
  int64 registered_at_unix_ms = 40;
  int64 updated_at_unix_ms = 41;
  uint64 revision = 50;
  // An unregistered workspace keeps a revisioned tombstone. Resurrection has
  // to name it, which is what stops a delayed request from re-registering a
  // root under a revision that described a different directory.
  bool deleted = 51;
}

// armadra.v1.FilesystemService/RegisterRoot — freeze a workspace's root.
//
// Registration is not idempotent by accident: `operation_id` makes a retry
// replay the original receipt, and `expected_revision` makes a second, different
// registration of the same workspace a CONFLICT rather than a silent move of
// somebody's project directory.
message RegisterWorkspaceRootRequest {
  CommandMeta meta = 1;
  string operation_id = 2;
  // The revision the caller read. 0 means "never registered".
  uint64 expected_revision = 3;
  WorkspaceRoot root = 10;
}
message RegisterWorkspaceRootResponse {
  WorkspaceRoot root = 1;
  CanvasOperationReceipt receipt = 2;
}

// armadra.v1.FilesystemService/UpdateRoot — change what is allowed, never where
// the files are. The canonical path is absent from this request on purpose: a
// root that moved is a new registration, not an edit, because everything the
// workspace holds is addressed relative to the path that was frozen.
message UpdateWorkspaceRootRequest {
  CommandMeta meta = 1;
  string operation_id = 2;
  uint64 expected_revision = 3;
  string workspace_id = 10;
  CanvasWorkspacePermissions permissions = 11;
}
message UpdateWorkspaceRootResponse {
  WorkspaceRoot root = 1;
  CanvasOperationReceipt receipt = 2;
}

// armadra.v1.FilesystemService/UnregisterRoot — drop the registration. Nothing
// under the directory is read, moved or deleted: this removes the entry that
// says the workspace has a root, exactly like removing a workspace from the
// list does not remove the project.
message UnregisterWorkspaceRootRequest {
  CommandMeta meta = 1;
  string operation_id = 2;
  uint64 expected_revision = 3;
  string workspace_id = 10;
}
message UnregisterWorkspaceRootResponse {
  string workspace_id = 1;
  CanvasOperationReceipt receipt = 2;
}

// armadra.v1.FilesystemService/GetRoot
message GetWorkspaceRootRequest {
  CommandMeta meta = 1;
  string workspace_id = 10;
}
message GetWorkspaceRootResponse { WorkspaceRoot root = 1; }

// armadra.v1.FilesystemService/ListRoots — every root the caller's grants
// cover, paged by workspace id so the order is stable across calls.
message ListWorkspaceRootsRequest {
  CommandMeta meta = 1;
  string after_workspace_id = 10;
  uint32 limit = 11;
}
message ListWorkspaceRootsResponse {
  repeated WorkspaceRoot roots = 10;
  string next_workspace_id = 11;
  bool has_more = 12;
}

// The Host -> Worker half of the domain (`WorkerRequest.action` 26).
//
// The Host never asks the Worker to store a root: the record is the Host's once
// the domain has moved. What it asks for is the Worker's own reading of its
// database, which is the only way to compare two sides that both claim to know
// where a workspace lives. It is used twice — to verify a switch, and to check
// after a handback that the rows the Runtime now holds are the ones the reverse
// export package described.
message ListWorkerRootsRequest {}

message WorkerWorkspaceRoots {
  repeated WorkspaceRoot roots = 10;
}

message FilesystemWorkerRequest {
  oneof action { ListWorkerRootsRequest list_roots = 100; }
}

message FilesystemWorkerResponse {
  oneof result { WorkerWorkspaceRoots roots = 100; }
}
