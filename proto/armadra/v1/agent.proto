syntax = "proto3";
package armadra.v1;
option go_package = "armadra.local/host/gen/armadra/v1";

import "armadra/v1/canvas.proto";
import "armadra/v1/common.proto";

// Writing a prompt into an Agent terminal that already exists. This is the one
// executor surface that touches a live PTY, so every message here carries the
// evidence needed to tell "nothing was written" apart from "we cannot tell".
//
// The Worker never owns the terminal: it proxies to the Runtime that does, over
// that Runtime's private same-user control endpoint. The durable delivery
// journal therefore lives with the Runtime, next to the write it describes.

// A frozen Agent launch definition. It names configuration only: an agent id,
// a directory and CLI arguments. Credentials, tokens and environment values
// never appear here, and only the "default" account is supported.
//
// It deliberately cannot name an executable. The program is always resolved by
// the Runtime from `agent_id` against its own registry and the operator's own
// launch override, so a stored plan can never turn into "run this binary".
message AgentLaunchSpec {
  // Registry id of the CLI adapter, e.g. "claude" or "custom:<id>".
  string agent_id = 1;
  // Absolute directory on the execution host.
  string working_directory = 2;
  // The frozen argv that follows the resolved program: the permission-mode
  // flags, the model flag and any custom-adapter arguments, exactly as they
  // were assembled and reviewed when the plan was defined. The fields below
  // describe that argv for display and for the identity check; they are never
  // re-expanded into flags, so the two can never drift into a different
  // command than the one that was approved.
  repeated string args = 3;
  // Adapter-defined permission mode; empty means the adapter's own default.
  string permission_mode = 4;
  string model_id = 5;
  // Only "default" is supported. Other accounts explicitly fail UNSUPPORTED.
  string account_id = 6;
}

// Why a target cannot be written to right now. Only ABSENT is a condition a
// frozen cold start may repair, and only when the plan enabled one.
enum AgentTargetState {
  AGENT_TARGET_STATE_UNSPECIFIED = 0;
  // Foreground pane runs the expected Agent, the last turn finished and no
  // input has been queued since. This is the only writable state.
  AGENT_TARGET_STATE_READY = 1;
  // The session exists but is working, blocked, or has pending input.
  AGENT_TARGET_STATE_BUSY = 2;
  // No live session for this node. A cold start may create one.
  AGENT_TARGET_STATE_ABSENT = 3;
  // The node, agent identity or capability no longer matches the plan. Waiting
  // cannot repair this; it is reported so the plan can be flagged, not retried.
  AGENT_TARGET_STATE_UNSUPPORTED = 4;
  // The Runtime could not be reached or answered unintelligibly.
  AGENT_TARGET_STATE_UNKNOWN = 5;
}

// What happened to one prompt delivery. Phases are ordered evidence, not a
// judgement of the work: SUBMITTED means bytes reached the input buffer, never
// that the Agent finished anything.
enum AgentPromptPhase {
  AGENT_PROMPT_PHASE_UNSPECIFIED = 0;
  // Affirmative proof that nothing was written: a preflight refusal, before
  // the terminal backend was called. Safe to retry with the same operation id.
  AGENT_PROMPT_PHASE_NOT_WRITTEN = 1;
  // The framed paste and its submit key were accepted by the input gate.
  AGENT_PROMPT_PHASE_SUBMITTED = 2;
  // The Agent finished a turn that no other input could have produced.
  AGENT_PROMPT_PHASE_COMPLETED = 3;
  // The session ended or was replaced before any turn completed.
  AGENT_PROMPT_PHASE_ABANDONED = 4;
  // Written, but the outcome cannot be attributed: the write itself failed
  // mid-flight, or someone else typed into the same session afterwards. Never
  // retried automatically; a person or a structured event has to resolve it.
  AGENT_PROMPT_PHASE_UNKNOWN = 5;
}

message AgentTargetRequest {
  string workspace_id = 1;
  string node_id = 2;
  // The session the plan was frozen against. It is recorded for the answer,
  // never required to still exist: a cold start replaces it with a new one.
  string session_id = 3;
  uint64 generation = 4;
  // Identity gate: the node's current Agent must still be this one.
  AgentLaunchSpec expected = 5;
  // Present only when the plan authorized launching a frozen definition for an
  // absent session. Launching happens here, while the run is claimed and its
  // authorization has just been re-checked, and never at the write itself: a
  // freshly started Agent is reported BUSY until it finishes booting, so the
  // one operation that touches the PTY only ever runs against a ready target.
  AgentLaunchSpec cold_start = 6;
}

message AgentTargetStatus {
  AgentTargetState state = 1;
  // The session and generation currently bound to the node, when there is one.
  string session_id = 2;
  uint64 generation = 3;
  // Stable machine token, never raw terminal output or a path.
  string reason_code = 4;
}

message AgentPromptRequest {
  // Stable across retries. The Runtime journals it before touching the PTY, so
  // a repeat can never paste the same prompt twice.
  string operation_id = 1;
  bytes request_sha256 = 2;
  string workspace_id = 3;
  string node_id = 4;
  string session_id = 5;
  uint64 generation = 6;
  // The frozen prompt text. Delivered as one framed paste plus a submit key.
  bytes prompt = 7;
  // Cold start belongs to AgentTargetRequest, not here. A delivery never
  // starts a process: an absent session is refused as NOT_WRITTEN.
  reserved 8;
  // Identity gate: the node's current Agent must still be this one.
  AgentLaunchSpec expected = 9;
}

message AgentPromptLookupRequest { string operation_id = 1; }

message AgentPromptReceipt {
  string operation_id = 1;
  bytes request_sha256 = 2;
  AgentPromptPhase phase = 3;
  // Monotonic per operation. A later receipt never lowers the recorded phase.
  uint64 sequence = 4;
  int64 observed_at_unix_ms = 5;
  string reason_code = 6;
  // The session actually written to, which a cold start may have created.
  string session_id = 7;
  uint64 generation = 8;
  // True only when this operation itself launched the session from the frozen
  // definition. Recorded so a run history can say why a new process exists.
  bool cold_started = 9;
  // Set by NOT_WRITTEN alone. It is proof of no effect, not an absence of one.
  bool no_effect_proven = 10;
}

message AgentRequest {
  oneof action {
    AgentTargetRequest target = 10;
    AgentPromptRequest prompt = 11;
    AgentPromptLookupRequest lookup = 12;
  }
}

message AgentResponse {
  oneof result {
    AgentTargetStatus target = 10;
    AgentPromptReceipt receipt = 11;
  }
}

/* ===================================================================== */
/* The agent domain (Go Host 业务所有权迁移 §2.7, §3.1 v9).               */
/* ===================================================================== */

// Everything above this line is the prompt-delivery surface the automation
// batch shipped: one write into a PTY, and the evidence needed to tell "nothing
// was written" apart from "we cannot tell". Its field numbers are released and
// do not move.
//
// Everything below is the *record* half of the same domain — what a Host owns
// once the agent domain has switched: the reduced status of each agent node,
// the approvals a CLI is blocked on, the messages nodes leave each other, the
// receipts of what was delivered, the handoff state machine, and the context
// links the canvas' own edges imply.
//
// The split runs along one line, and it is the same line every other domain in
// this migration is cut on: **the Host owns the record, the execution host owns
// the evidence.** A Hook endpoint, a node token, a pending-approval file, a
// transcript and a terminal all stay on the machine the CLI runs on, because
// they *are* that machine — a Host that claimed them would be claiming files it
// cannot see and processes it cannot hold. What the Host can own is what those
// things mean: that this node is waiting, that this approval has been answered,
// that this message has not been acknowledged, that this handoff was delivered
// once and not twice.
//
// Two consequences run through every message below.
//
// The first is that a payload a CLI produced travels as bytes with its own
// digest rather than as fields. An approval request is a provider's own JSON
// and a handoff bundle is a snapshot of a conversation; typing them here would
// freeze one CLI's vocabulary into a cross-process contract and would make a
// new provider a wire change. The digest is what makes that safe: a body that
// was truncated or rewritten is refused rather than stored as a shorter one.
//
// The second is that `decision` on an answered approval is a string. It is the
// CLI's own word — `allow`, `deny`, `allow_always`, whatever that provider
// spells — and mapping it onto an enum would mean this Host deciding what a
// provider meant. It is recorded and handed back verbatim.

// The reduced state of one agent node, as `hook/reduce.rs` computes it.
//
// It is a reduction of observed events, not a claim about a process. WAITING
// means a CLI asked a question; BLOCKED means it cannot proceed until one is
// answered; DONE means a turn finished. None of them say a program is alive —
// that is the session domain's `SessionStatus`, and conflating the two would
// let a node be drawn as busy after its terminal had gone.
enum AgentState {
  AGENT_STATE_UNSPECIFIED = 0;
  AGENT_STATE_IDLE = 1;
  AGENT_STATE_WORKING = 2;
  AGENT_STATE_WAITING = 3;
  AGENT_STATE_BLOCKED = 4;
  AGENT_STATE_DONE = 5;
}

// One agent node's status as the Host records it.
//
// `transcript_ref` is deliberately not a path. The transcript is a file on the
// execution host, in whatever layout that CLI uses; the Host stores an opaque
// reference and hands it back to the Worker when somebody asks to read it. A
// path here would be a path this Host cannot open, on a machine it may not be.
message AgentStatus {
  string node_id = 1;
  string workspace_id = 2;
  // The session the status was last observed against, and the generation of
  // that session's run. Together they make a stale report visible: a turn
  // reported for a generation that has been replaced describes a pane nobody
  // is looking at any more.
  string session_id = 3;
  uint64 generation = 4;
  string agent_id = 5;
  uint32 unread = 10;
  bool verified = 11;
  bool restored = 12;
  optional bool errored = 13;
  optional bool interrupted = 14;
  // Opaque to the Host: the Worker's own way of naming this node's transcript.
  bytes transcript_ref = 15;
  AgentState state = 30;
  // The CLI's own phase word (`startup`, `turn`, `compact`, …). It is a string
  // for the reason `decision` is: it is one provider's vocabulary, and mapping
  // it would be this Host deciding what that provider meant.
  string session_phase = 31;
  string reason_code = 39;
  int64 last_event_at_unix_ms = 40;
  int64 updated_at_unix_ms = 41;
  uint64 revision = 50;
  bool deleted = 51;
}

// What kind of turn a Hook reported. The list is closed; an unrecognised value
// is refused rather than folded into a default, because a default here would
// silently change what a node's state was reduced from.
enum HookEventKind {
  HOOK_EVENT_KIND_UNSPECIFIED = 0;
  HOOK_EVENT_KIND_SESSION_START = 1;
  HOOK_EVENT_KIND_USER_PROMPT = 2;
  HOOK_EVENT_KIND_TURN_END = 3;
  HOOK_EVENT_KIND_NOTIFICATION = 4;
  HOOK_EVENT_KIND_APPROVAL = 5;
  HOOK_EVENT_KIND_SESSION_END = 6;
}

// One normalized Hook event, as the Worker reports it.
//
// **Normalized** is the load-bearing word. The raw body a CLI writes never
// reaches the Host: the Worker parses it, reduces it, and reports what it
// meant. What travels as `payload` is the Worker's own normalized form with its
// digest, so a Host can store and republish an event whose provider it has
// never heard of without having to understand that provider's format.
message HookEvent {
  string event_id = 1;
  string node_id = 2;
  string session_id = 3;
  uint64 generation = 4;
  string workspace_id = 5;
  // `claude`, `codex`, `gemini`, … The Host records it and routes on it; it
  // does not interpret it.
  string provider = 10;
  bytes payload = 11;
  bytes payload_sha256 = 12;
  uint32 schema_version = 13;
  HookEventKind kind = 30;
  int64 observed_at_unix_ms = 40;
}

enum ApprovalState {
  APPROVAL_STATE_UNSPECIFIED = 0;
  APPROVAL_STATE_PENDING = 1;
  APPROVAL_STATE_ANSWERED = 2;
  // Nobody answered inside the window the CLI was willing to wait. It is not a
  // denial: the CLI stopped asking, and recording it as denied would tell a
  // user a decision was taken that nobody took.
  APPROVAL_STATE_EXPIRED = 3;
}

// One permission question a CLI is blocked on.
//
// The blocking read lives on the execution host and so does the file that
// releases it. This record exists so the question can be *seen* from a phone,
// answered there, and answered exactly once: `decision` plus `answered_by` plus
// the revision are what stop two devices answering the same question two
// different ways.
message Approval {
  string approval_id = 1;
  string node_id = 2;
  string workspace_id = 3;
  string session_id = 4;
  uint64 generation = 5;
  // The provider's own request, as JSON bytes. It is not expanded into fields,
  // for the reason stated at the top of this section.
  bytes request = 10;
  bytes request_sha256 = 11;
  // The CLI's own word for the answer. Never mapped onto an enum.
  string decision = 12;
  // The principal that answered, so an audit can say who allowed something.
  string answered_by = 13;
  ApprovalState state = 30;
  string reason_code = 39;
  int64 created_at_unix_ms = 40;
  int64 answered_at_unix_ms = 41;
  uint64 revision = 50;
}

// One message left in a node's mailbox by another node.
//
// `sequence` is the mailbox's own order and has nothing to do with the event
// stream's. It is what an inbox pages by, and it is why a message delivered
// twice under one `message_key` is one row: the unique key is (source, target,
// message_key), so a retrying sender cannot fill an inbox with copies of one
// thought.
message MailboxMessage {
  string message_id = 1;
  string workspace_id = 2;
  string source_node_id = 3;
  string target_node_id = 4;
  string message_key = 5;
  string body = 10;
  uint64 sequence = 11;
  int64 created_at_unix_ms = 40;
  int64 expires_at_unix_ms = 41;
  // Zero means nobody has read it. A timestamp rather than a flag, so an inbox
  // can say how long a message sat unread.
  int64 acknowledged_at_unix_ms = 42;
  uint64 revision = 50;
  bool deleted = 51;
}

// What became of one attempt to put something in front of an agent.
//
// The three outcomes are the three the prompt receipt uses and mean the same
// things: SUBMITTED is proof bytes were accepted, NOT_WRITTEN is proof they
// were not, and UNKNOWN is the honest answer when neither can be shown.
// Nothing is ever retried automatically out of UNKNOWN.
enum DeliveryOutcome {
  DELIVERY_OUTCOME_UNSPECIFIED = 0;
  DELIVERY_OUTCOME_SUBMITTED = 1;
  DELIVERY_OUTCOME_NOT_WRITTEN = 2;
  DELIVERY_OUTCOME_UNKNOWN = 3;
}

// The receipt for one `send` / `reply` / `notify`.
//
// It is a record of an attempt, not a message: the body is not here, only how
// many characters it had. A delivery log that carried bodies would be a second
// copy of every conversation, in the one database meant to hold decisions
// rather than content.
message Delivery {
  string trace_id = 1;
  string workspace_id = 2;
  string source_node_id = 3;
  string target_node_id = 4;
  // The execution host's own receipt string, opaque here.
  string receipt = 10;
  uint32 body_chars = 11;
  DeliveryOutcome outcome = 30;
  string reason_code = 39;
  int64 created_at_unix_ms = 40;
  uint64 revision = 50;
}

// Where a handoff stands.
//
// It is one enum over what used to be two columns — `agent_handoffs.state` and
// `agent_handoff_outbox.state` — because a client asking "did this land?" could
// never answer from either alone. UNKNOWN_OUTCOME is the value the merge exists
// for: the claim was persisted, the write may or may not have reached the
// terminal, and nobody may resend it automatically.
enum HandoffState {
  HANDOFF_STATE_UNSPECIFIED = 0;
  HANDOFF_STATE_PREPARED = 1;
  HANDOFF_STATE_QUEUED = 2;
  HANDOFF_STATE_DISPATCHING = 3;
  HANDOFF_STATE_DELIVERED = 4;
  HANDOFF_STATE_ACKNOWLEDGED = 5;
  HANDOFF_STATE_CANCELLED = 6;
  HANDOFF_STATE_FAILED = 7;
  HANDOFF_STATE_UNKNOWN_OUTCOME = 8;
}

// One node handing its work to another.
//
// The bundle is frozen the moment it is prepared, and it is frozen on both
// sides: the Runtime has a trigger that aborts an update touching it, and the
// Host refuses one. That is not belt and braces — it is the whole meaning of
// the record. A handoff whose bundle could change after it was accepted would
// be a handoff where what the target read is not what the source sent.
message Handoff {
  string handoff_id = 1;
  string workspace_id = 2;
  string source_node_id = 3;
  string target_node_id = 4;
  // Which session each side was on when the handoff was prepared. A target
  // whose session has been replaced since is a target the bundle was not aimed
  // at, and that is decidable only because both are recorded.
  SessionAddress source = 5;
  SessionAddress target = 6;
  bytes bundle = 10;
  bytes bundle_sha256 = 11;
  // The mailbox message that carries the bundle to the target, once one
  // exists, and the delivery whose receipt says what happened to it.
  string mailbox_id = 12;
  string trace_id = 13;
  // How many times dispatch has been attempted. It is evidence for a person,
  // never a trigger: nothing here retries on its own.
  uint32 attempts = 14;
  HandoffState state = 30;
  string error_code = 39;
  int64 created_at_unix_ms = 40;
  int64 accepted_at_unix_ms = 41;
  int64 updated_at_unix_ms = 42;
  uint64 revision = 50;
}

// One edge, seen from a node.
enum ContextLinkDirection {
  CONTEXT_LINK_DIRECTION_UNSPECIFIED = 0;
  // This node is the edge's source: it reads the other one.
  CONTEXT_LINK_DIRECTION_OUTGOING = 1;
  // This node is the edge's target: the other one reads it.
  CONTEXT_LINK_DIRECTION_INCOMING = 2;
}

message ContextLink {
  string target_node_id = 1;
  ContextLinkDirection direction = 30;
  // What the other end is — `agent`, `terminal`, `sticky`, … The Host copies
  // the canvas node's own kind rather than deciding one.
  string kind = 10;
  // What the other end is called. It travels because a link is a statement
  // about something a person named: an agent reading its neighbours needs to
  // say which one it read, and a projection that dropped the title would hand
  // a rollback back a document with an identifier where a name used to be.
  string title = 11;
}

// The links one node has, derived from the canvas' edges.
//
// This is a *projection* and never a client write. The edges are the canvas
// domain's records; a client that could write context links directly would be
// able to make a node read a transcript it is not connected to, which is the
// one thing the whole "context follows the connection" rule exists to prevent.
message ContextLinks {
  string node_id = 1;
  string workspace_id = 2;
  repeated ContextLink links = 10;
  int64 updated_at_unix_ms = 41;
  uint64 revision = 50;
}

/* ------------------------------------------------------------- HTTPS surface */

// armadra.v1.AgentService/ListStatus — the board's own read.
message ListAgentStatusRequest {
  CommandMeta meta = 1;
  string after_node_id = 10;
  uint32 limit = 11;
}
message ListAgentStatusResponse {
  repeated AgentStatus statuses = 10;
  string next_node_id = 11;
  bool has_more = 12;
}

// armadra.v1.AgentService/MarkRead — the unread badge, cleared.
//
// It is a write with a CAS revision like any other, because two clients
// clearing the same badge are two decisions about one record and the second has
// to learn it lost.
message MarkAgentReadRequest {
  CommandMeta meta = 1;
  string operation_id = 2;
  uint64 expected_revision = 3;
  string node_id = 10;
}
message MarkAgentReadResponse {
  AgentStatus status = 1;
  CanvasOperationReceipt receipt = 2;
}

message ListApprovalsRequest {
  CommandMeta meta = 1;
  string node_id = 10;
  // Answered approvals are history; the default is the questions still open.
  bool include_answered = 11;
  uint32 limit = 12;
}
message ListApprovalsResponse { repeated Approval approvals = 10; }

// armadra.v1.AgentService/AnswerApproval — recorded, then delivered.
//
// The order is the point, and it is the opposite of the session domain's. A
// session records after the Worker acts, because the Worker's answer is the
// fact. An approval records *first*, under CAS, because the record is what
// stops a second device answering the same question — and only then is the
// answer written into the file the CLI is blocked on.
message AnswerApprovalRequest {
  CommandMeta meta = 1;
  string operation_id = 2;
  uint64 expected_revision = 3;
  string approval_id = 10;
  // The CLI's own word. Passed through unchanged.
  string decision = 11;
}
message AnswerApprovalResponse {
  Approval approval = 1;
  CanvasOperationReceipt receipt = 2;
}

message ListDeliveriesRequest {
  CommandMeta meta = 1;
  string node_id = 10;
  uint32 limit = 11;
}
message ListDeliveriesResponse { repeated Delivery deliveries = 10; }

// armadra.v1.AgentService/ListMailbox — one node's inbox, oldest first.
message ListMailboxRequest {
  CommandMeta meta = 1;
  string target_node_id = 10;
  bool include_acknowledged = 11;
  uint32 limit = 12;
}
message ListMailboxResponse { repeated MailboxMessage messages = 10; }

// armadra.v1.AgentService/PrepareHandoff — freeze the bundle, send nothing.
//
// Preparing records what would be sent, with the digest that makes it
// unchangeable, so accepting later accepts a thing that has been reviewed
// rather than whatever the source happens to look like by then.
message PrepareHandoffRequest {
  CommandMeta meta = 1;
  string operation_id = 2;
  uint64 expected_revision = 3;
  string handoff_id = 10;
  string source_node_id = 11;
  string target_node_id = 12;
  SessionAddress source = 13;
  SessionAddress target = 14;
  bytes bundle = 15;
}
message PrepareHandoffResponse {
  Handoff handoff = 1;
  CanvasOperationReceipt receipt = 2;
}

// armadra.v1.AgentService/AcceptHandoff — queue it, then deliver it once.
message AcceptHandoffRequest {
  CommandMeta meta = 1;
  string operation_id = 2;
  uint64 expected_revision = 3;
  string handoff_id = 10;
}
message AcceptHandoffResponse {
  Handoff handoff = 1;
  CanvasOperationReceipt receipt = 2;
}

message CancelHandoffRequest {
  CommandMeta meta = 1;
  string operation_id = 2;
  uint64 expected_revision = 3;
  string handoff_id = 10;
  string reason_code = 11;
}
message CancelHandoffResponse {
  Handoff handoff = 1;
  CanvasOperationReceipt receipt = 2;
}

message ListHandoffsRequest {
  CommandMeta meta = 1;
  string node_id = 10;
  uint32 limit = 11;
}
message ListHandoffsResponse { repeated Handoff handoffs = 10; }

message GetHandoffRequest {
  CommandMeta meta = 1;
  string handoff_id = 10;
}
message GetHandoffResponse { Handoff handoff = 1; }

// armadra.v1.AgentService/ListContextLinks — the projection, read only.
message ListContextLinksRequest {
  CommandMeta meta = 1;
  string node_id = 10;
}
message ListContextLinksResponse { repeated ContextLinks links = 10; }

// armadra.v1.AgentService/InstallHooks and /UninstallHooks — execution.
//
// Installing a Hook edits a CLI's own configuration file on the execution host.
// It is forwarded, never performed here: the file is that machine's and the
// CLI's version is that machine's, and a Host that wrote it would be writing
// into a configuration it cannot read back.
message InstallHooksRequest {
  CommandMeta meta = 1;
  string operation_id = 2;
  string agent_id = 10;
}
message HookInstallState {
  string agent_id = 1;
  bool installed = 10;
  uint32 client_revision = 11;
  // The configuration file the Worker actually touched, for a person to check.
  string config_path = 12;
  string reason_code = 39;
  int64 installed_at_unix_ms = 40;
}
message InstallHooksResponse { HookInstallState state = 1; }
message UninstallHooksRequest {
  CommandMeta meta = 1;
  string operation_id = 2;
  string agent_id = 10;
}
message UninstallHooksResponse { HookInstallState state = 1; }

/* ------------------------------------------------- Host -> Worker (action 28) */

// Read this Worker's own agent rows, for verifying a switch and a handback.
//
// It is the agent domain's equivalent of `ListWorkerSessionsRequest` and exists
// for the same reason: a report assembled from the request would say what the
// Worker was asked to store, and only a reading of the rows says what it holds.
message ListWorkerAgentsRequest {}

// What the Worker knows about one agent node right now. No revisions anywhere:
// the Worker stores no CAS token for a domain it does not own.
message WorkerAgentState {
  string node_id = 1;
  string workspace_id = 2;
  string session_id = 3;
  uint64 generation = 4;
  string agent_id = 5;
  uint32 unread = 10;
  bool verified = 11;
  bool restored = 12;
  optional bool errored = 13;
  optional bool interrupted = 14;
  bytes transcript_ref = 15;
  AgentState state = 30;
  string session_phase = 31;
  int64 last_event_at_unix_ms = 40;
  int64 updated_at_unix_ms = 41;
}

message WorkerAgentStates {
  string worker_instance_id = 1;
  repeated WorkerAgentState agents = 10;
  // The approvals the execution host is currently blocked on. They travel with
  // the states because they are read from one machine at one moment, and a Host
  // that asked twice could see a question appear between the two answers.
  repeated Approval approvals = 11;
}

// Drain what has happened on the execution host since `after_sequence`.
//
// This is a *pull*, and that is a deliberate departure from §2.7's push. The
// resident Runtime — the process a Hook actually reaches — binds no upward
// channel of its own; only a Host-spawned Worker does. So the Host asks, over
// the same short-lived Worker door every other execution-shaped request uses,
// rather than waiting for a report that has no way to arrive. The cursor makes
// that as safe as a push would be: a drain the Host did not record is one it
// asks for again, and the same `event_id` recorded twice is one row.
message DrainAgentEventsRequest {
  uint64 after_sequence = 1;
  uint32 limit = 10;
}
message DrainedAgentEvents {
  // The cursor to pass next time. It only moves forward.
  uint64 next_sequence = 1;
  bool has_more = 2;
  repeated HookEvent events = 10;
  repeated Approval approvals = 11;
  repeated Delivery deliveries = 12;
}

// Write an answer into the file the CLI is blocked on.
//
// The Host has already recorded the decision, under CAS, before this is sent.
// If this fails the record still says the question was answered, which is
// correct: somebody did answer it, and the failure is that the machine did not
// hear — a state a person can act on, unlike a record that quietly forgot.
message DeliverApprovalAnswerRequest {
  string approval_id = 1;
  string node_id = 2;
  string session_id = 3;
  uint64 generation = 4;
  string decision = 10;
  string answered_by = 11;
}

// Put a prepared bundle in front of the target agent.
message DeliverHandoffRequest {
  string handoff_id = 1;
  string workspace_id = 2;
  string source_node_id = 3;
  string target_node_id = 4;
  SessionAddress target = 5;
  bytes bundle = 10;
  bytes bundle_sha256 = 11;
}

// Put one message in front of an agent (`send` / `reply` / `notify`).
message DeliverMessageRequest {
  string trace_id = 1;
  string workspace_id = 2;
  string source_node_id = 3;
  string target_node_id = 4;
  string body = 10;
  // `send`, `reply` or `notify`. The execution host's own vocabulary, passed
  // through rather than mapped.
  string mode = 11;
}

// The Worker's answer to either delivery: what it can prove happened.
message AgentDeliveryReceipt {
  string trace_id = 1;
  string receipt = 10;
  uint32 body_chars = 11;
  DeliveryOutcome outcome = 30;
  string reason_code = 39;
  int64 observed_at_unix_ms = 40;
}

// Read a node's transcript, or a screenful of its pane.
message ReadTranscriptRequest {
  string node_id = 1;
  string session_id = 2;
  bytes transcript_ref = 10;
  uint32 max_bytes = 11;
}
message TranscriptExcerpt {
  string node_id = 1;
  bytes content = 10;
  bytes content_sha256 = 11;
  bool truncated = 12;
  int64 observed_at_unix_ms = 40;
}
message CaptureAgentScreenRequest {
  string node_id = 1;
  string session_id = 2;
  uint32 lines = 10;
}
message CapturedAgentScreen {
  string node_id = 1;
  string data = 10;
}

message AgentWorkerRequest {
  oneof action {
    ListWorkerAgentsRequest list_agents = 100;
    DrainAgentEventsRequest drain_events = 101;
    DeliverApprovalAnswerRequest deliver_approval = 102;
    DeliverHandoffRequest deliver_handoff = 103;
    DeliverMessageRequest deliver_message = 104;
    ReadTranscriptRequest read_transcript = 105;
    CaptureAgentScreenRequest capture_screen = 106;
    InstallHooksRequest install_hooks = 107;
    UninstallHooksRequest uninstall_hooks = 108;
  }
}

message AgentWorkerResponse {
  oneof result {
    WorkerAgentStates agents = 100;
    DrainedAgentEvents events = 101;
    AgentDeliveryReceipt delivery = 102;
    TranscriptExcerpt transcript = 105;
    CapturedAgentScreen screen = 106;
    HookInstallState hooks = 107;
  }
}
