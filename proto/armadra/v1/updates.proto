syntax = "proto3";
package armadra.v1;
option go_package = "armadra.local/host/gen/armadra/v1";

import "armadra/v1/common.proto";

// Application update contract (platform design §3 S03).
//
// The contract is deliberately larger than what is implemented: a Host that
// cannot check answers UNSUPPORTED, and a shell with no configured signing key
// reports "not configured" rather than an update nobody could verify. Nothing
// here installs anything; applying an update is the shell's own, explicit act.

enum ReleaseChannel {
  RELEASE_CHANNEL_UNSPECIFIED = 0;
  RELEASE_CHANNEL_STABLE = 1;
  RELEASE_CHANNEL_BETA = 2;
  // Locally built or side-loaded. A build on this channel never auto-updates.
  RELEASE_CHANNEL_DEVELOPMENT = 3;
}

enum UpdateCheckState {
  UPDATE_CHECK_STATE_UNSPECIFIED = 0;
  // This build can check and is already on the newest release it accepts.
  UPDATE_CHECK_STATE_UP_TO_DATE = 1;
  // A newer release exists and passes the compatibility range below.
  UPDATE_CHECK_STATE_AVAILABLE = 2;
  // No release source is configured, or this Host does not implement checking.
  // Never reported as "up to date": not looking is not the same as looking.
  UPDATE_CHECK_STATE_UNSUPPORTED = 3;
  // The source was configured but could not be read or parsed. The reason code
  // says which; it is never turned into an offer to update.
  UPDATE_CHECK_STATE_UNAVAILABLE = 4;
}

enum UpdateSignatureState {
  UPDATE_SIGNATURE_STATE_UNSPECIFIED = 0;
  // A signature is present and the caller holds a public key to check it with.
  // The Host does not verify payloads; the installer does, before applying.
  UPDATE_SIGNATURE_STATE_PRESENT = 1;
  // The release carries no signature for this artifact.
  UPDATE_SIGNATURE_STATE_ABSENT = 2;
  // No public key is configured on this device, so nothing could be verified.
  UPDATE_SIGNATURE_STATE_UNCONFIGURED = 3;
}

// Dotted release identity. Kept structured so a comparison never depends on
// string ordering, and so a pre-release suffix cannot be mistaken for a patch.
message SemanticVersion {
  uint32 major = 1;
  uint32 minor = 2;
  uint32 patch = 3;
  // "beta.1"; empty for a final release. A build with a pre-release suffix is
  // never offered to a caller asking for the stable channel.
  string prerelease = 4;
}

// The range of installed versions a release accepts. A release outside it is
// reported but never offered: an upgrade that a build cannot migrate to is a
// data hazard, not a convenience.
message UpdateCompatibility {
  SemanticVersion minimum_installed = 1;
  // Present when a release refuses versions above a ceiling.
  SemanticVersion maximum_installed = 2;
  // Protocol major this release speaks. A mismatch is refused, not negotiated.
  uint32 protocol_major = 3;
  // The lowest protocol minor a peer must speak to stay usable afterwards.
  uint32 minimum_protocol_minor = 4;
}

message UpdateSignature {
  UpdateSignatureState state = 1;
  // Opaque detached signature as published. Never a private key, never a token.
  string value = 2;
  // Short identifier of the key that produced it, for operator diagnostics.
  string key_id = 3;
}

message UpdateArtifact {
  // "darwin-aarch64", "linux-x86_64", "windows-x86_64". Empty for an artifact
  // that is the same on every platform, such as the updater manifest.
  string target = 1;
  string url = 2;
  uint64 size_bytes = 3;
  bytes sha256 = 4;
  UpdateSignature signature = 5;
  // Which program this artifact carries: "desktop", "host", "worker", "hook",
  // "session-host", "web" or "manifest". One release publishes several
  // programs for the same target, so a target alone does not name a download.
  // Empty means the publisher did not say, and such an artifact is never
  // matched by a caller that asked for a component.
  string component = 6;
}

message ReleaseInfo {
  SemanticVersion version = 1;
  ReleaseChannel channel = 2;
  int64 published_at_unix_ms = 3;
  // Release notes URL, never inlined markup.
  string notes_url = 4;
  UpdateCompatibility compatibility = 5;
  repeated UpdateArtifact artifacts = 6;
}

message CheckForUpdateRequest {
  CommandMeta meta = 1;
  ReleaseChannel channel = 2;
  SemanticVersion installed_version = 3;
  // The caller's own build target, so the Host answers about one artifact.
  string target = 4;
  // Which program the caller is asking about. Empty means "desktop": the
  // shell was the only caller before this field existed, and an old client
  // must keep receiving the answer it already understood.
  string component = 5;
}

message CheckForUpdateResponse {
  UpdateCheckState state = 1;
  // The channel actually consulted, which may differ from the requested one
  // when the operator pinned this Host to a channel.
  ReleaseChannel channel = 2;
  SemanticVersion installed_version = 3;
  // Present only for AVAILABLE. An incompatible or unsigned release is
  // reported through the fields below instead of being offered here.
  ReleaseInfo release = 4;
  // Stable machine token, e.g. "UPDATES_NOT_CONFIGURED", "SOURCE_UNREACHABLE",
  // "COMPATIBILITY_REFUSED", "NO_ARTIFACT_FOR_TARGET". Never a URL or a body.
  string reason_code = 5;
  int64 checked_at_unix_ms = 6;
  // Cache hint. Zero means the caller decides its own cadence.
  int64 retry_after_ms = 7;
}

// Downloading and applying are declared so the states they can report exist in
// the contract. Neither is implemented; both answer UNSUPPORTED today.
message DownloadUpdateRequest {
  CommandMeta meta = 1;
  SemanticVersion version = 2;
  string target = 3;
}
enum UpdateTransferState {
  UPDATE_TRANSFER_STATE_UNSPECIFIED = 0;
  UPDATE_TRANSFER_STATE_UNSUPPORTED = 1;
  UPDATE_TRANSFER_STATE_IN_PROGRESS = 2;
  UPDATE_TRANSFER_STATE_VERIFIED = 3;
  // Downloaded but the digest or the signature did not match. The bytes are
  // discarded; a failed verification is never retried into an install.
  UPDATE_TRANSFER_STATE_REJECTED = 4;
}
message DownloadUpdateResponse {
  UpdateTransferState state = 1;
  uint64 received_bytes = 2;
  uint64 total_bytes = 3;
  string reason_code = 4;
}
message ApplyUpdateRequest {
  CommandMeta meta = 1;
  SemanticVersion version = 2;
  // Must equal the digest a verified download reported. An apply request that
  // names a digest nothing verified is refused.
  bytes expected_sha256 = 3;
}
enum UpdateApplyState {
  UPDATE_APPLY_STATE_UNSPECIFIED = 0;
  UPDATE_APPLY_STATE_UNSUPPORTED = 1;
  // Staged on disk and verified; the operator still has to restart.
  UPDATE_APPLY_STATE_STAGED = 2;
  UPDATE_APPLY_STATE_REFUSED = 3;
}
message ApplyUpdateResponse {
  UpdateApplyState state = 1;
  string reason_code = 2;
}
