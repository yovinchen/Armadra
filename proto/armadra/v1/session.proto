syntax = "proto3";

package armadra.v1;

option go_package = "armadra.local/host/gen/armadra/v1";

import "armadra/v1/agent.proto";
import "armadra/v1/canvas.proto";
import "armadra/v1/common.proto";

// The session domain: what a session *is*, not what it runs
// (Go Host 业务所有权迁移 §2.6).
//
// A terminal session has two halves that have always been tangled together in
// one `terminal_sessions` row: the intent — this node wants a shell in this
// directory running this agent — and the execution — a PTY, a tmux pane, a
// generation counter, a write gate. Only the first half moves to the Host.
//
// The split is not a matter of taste. A process cannot be held across a process
// boundary: the file descriptor, the child, the tmux server handle and the
// replay log all live where the program runs, and a Host that claimed to own
// them would be claiming to own something it would lose on every restart. What
// a Host *can* own is the decision — whether a session should exist at all,
// which node it belongs to, what it was frozen to launch, and what the last
// thing anybody observed about it was.
//
// That is why `generation` is a Worker value the Host records rather than one
// it allocates. The generation is what distinguishes "the pane you are typing
// into" from "the pane that was replaced while you were away", and only the
// side that actually created the new pane knows when it changed. A Host that
// handed out generations would be handing out claims about processes it has
// never seen.

// What kind of session this is. COMMAND is the automation command session that
// `command_sessions` records today; it is projected into this table when the
// domain switches so there is one answer to "which sessions exist" rather than
// two tables that have to be joined by whoever asks.
enum SessionKind {
  SESSION_KIND_UNSPECIFIED = 0;
  SESSION_KIND_TERMINAL = 1;
  SESSION_KIND_AGENT = 2;
  SESSION_KIND_COMMAND = 3;
}

// The lifecycle as the Host records it.
//
// LOST is the value this enum exists for. A Worker that stopped answering has
// not told anyone that its sessions ended — the tmux server may well still be
// running with every pane intact — so recording those sessions as EXITED would
// state a fact nobody observed, and a client would offer to start a second one
// on top of the first. LOST says "nobody can currently see this", which is the
// only thing that is actually known, and it is what `ReclaimRuns` resolves.
enum SessionStatus {
  SESSION_STATUS_UNSPECIFIED = 0;
  // The intent exists and no run has been asked for. Mounting a node reaches
  // this state and no further: creating a session is not starting one.
  SESSION_STATUS_PENDING = 1;
  // A run was requested and the Worker has not yet reported a generation.
  SESSION_STATUS_STARTING = 2;
  SESSION_STATUS_RUNNING = 3;
  SESSION_STATUS_EXITED = 4;
  // The Worker that held this run is unreachable. Never shown as EXITED.
  SESSION_STATUS_LOST = 5;
  // A reclaim is in flight: the Worker is being asked what it actually holds.
  SESSION_STATUS_RECLAIMING = 6;
}

// Whether anybody is looking at the session right now. It is a count reduced to
// a state, reported by the Worker that owns the attachments.
enum SessionAttachState {
  SESSION_ATTACH_STATE_UNSPECIFIED = 0;
  SESSION_ATTACH_STATE_DETACHED = 1;
  SESSION_ATTACH_STATE_ATTACHED = 2;
  SESSION_ATTACH_STATE_EXITED = 3;
}

// Why the session was ended, when it was ended on purpose.
//
// The Runtime spells its own intent in four words (`none`, `process`,
// `session`, `recycle`) that do not map one-to-one onto these four values, so
// `Session.reason_code` carries the Runtime's exact word alongside. That is
// what makes a rollback lossless: the enum is what a client renders, the reason
// code is what goes back into the row.
enum TerminationIntent {
  TERMINATION_INTENT_UNSPECIFIED = 0;
  // Nothing ended it; it is running, or it exited on its own.
  TERMINATION_INTENT_NONE = 1;
  // Somebody asked for it: an interrupt, a kill, a closed node.
  TERMINATION_INTENT_USER = 2;
  // Ended so the same logical session could start again at a new generation.
  TERMINATION_INTENT_RECYCLE = 3;
  // The Host is going away and said so, rather than simply stopping.
  TERMINATION_INTENT_HOST_SHUTDOWN = 4;
}

// What this session was frozen to launch.
//
// It is frozen for the same reason an automation plan's argv is frozen: the
// command that runs must be the command that was decided, not one re-derived
// from settings that have changed since. `env_refs` carries only the *names* of
// the environment entries the launch depends on — the values are resolved on
// the execution host, and a credential that travelled through the Host's
// database would be a credential the Host now has to protect.
message SessionLaunch {
  string shell = 10;
  string command = 11;
  repeated string args = 12;
  // Present only for an agent session. Its `working_directory` is the agent's;
  // `working_directory` below is the session's, and for an agent session the
  // two are the same value stored once on each side of the frozen definition.
  AgentLaunchSpec agent = 13;
  // Names only. A launch that needed `GITHUB_TOKEN` says so; the token itself
  // never leaves the machine that has it.
  repeated string env_refs = 14;
  // A `settings.ssh.hosts[].id`. The argv is built from the stored host on the
  // execution side, never from anything a client sent.
  string ssh_target_id = 15;
  // Digest of the canonical launch definition (§3.3 `session.launch_sha256`).
  // It is what a switch compares, so it covers the directory, the shell, the
  // command, the argv and the agent identity, and nothing that moves on its
  // own — no timestamps, no generation, no revision.
  bytes launch_sha256 = 16;
  // Absolute directory on the execution host. It is part of the frozen
  // definition rather than a mutable field: a session whose working directory
  // changed is a different session, because every relative path anybody typed
  // into it meant something else.
  string working_directory = 17;
}

// One session's intent and last observed state.
message Session {
  string session_id = 1;
  string workspace_id = 2;
  // Empty means this machine; anything else is a `settings.ssh.hosts[].id`.
  string execution_host_id = 3;
  // The stable logical key across recycles: the owning node id, or the session
  // id when there is no node. `ReclaimRuns` reconciles on it, because it is the
  // one identifier that survives a generation change.
  string session_key = 4;
  string owner_node_id = 5;
  SessionLaunch launch = 10;
  // `direct`, `tmux`, or whatever the execution host actually used. It is
  // reported, not chosen here: which backend is available is a fact about the
  // machine.
  string backend_kind = 11;
  optional int32 exit_code = 12;
  // The Worker's value. The Host records it and never allocates one.
  uint64 generation = 13;
  SessionKind kind = 30;
  SessionStatus status = 31;
  SessionAttachState attach_state = 32;
  TerminationIntent termination_intent = 33;
  // A stable key, not prose. For a terminated session it carries the Runtime's
  // own termination word, which is what makes a rollback lossless.
  string reason_code = 39;
  int64 created_at_unix_ms = 40;
  int64 updated_at_unix_ms = 41;
  int64 ended_at_unix_ms = 42;
  int64 last_output_at_unix_ms = 43;
  uint64 revision = 50;
  // A closed session keeps a revisioned tombstone, so re-creating one under
  // the same key has to name it rather than start from zero.
  bool deleted = 51;
}

// One generation of one session: the run that a Worker actually started.
//
// A session row says what should exist; a run row says what did. They are
// separate because a session outlives its runs — recycling a node produces a
// second run of the same session — and because the run is the only place a
// `backend_ref` belongs. That reference is a handle on another process's
// object; it is carried opaquely and never parsed here.
message SessionRun {
  string session_id = 1;
  uint64 generation = 2;
  // Which Worker process reported this run. A new instance id is why a
  // reclaim cannot assume a run it remembers is still the same run.
  string worker_instance_id = 3;
  // Opaque to the Host: a tmux pane name, a PTY handle key, whatever the
  // execution host uses. Parsing it here would make the Host depend on a
  // backend it does not run.
  string backend_ref = 10;
  optional int32 exit_code = 11;
  string reason_code = 39;
  int64 started_at_unix_ms = 40;
  int64 ended_at_unix_ms = 41;
  uint64 revision = 50;
}

/* ------------------------------------------------------------- HTTPS surface */

// armadra.v1.SessionService/Create — record the intent, start nothing.
//
// This is the method that takes the "should a process exist?" decision away
// from the browser. Mounting a terminal node used to create a session as a side
// effect of rendering, which meant a page that rendered twice could start two
// programs. Here creation is a request with an operation id and a CAS revision,
// and starting is a second, separate decision.
message CreateSessionRequest {
  CommandMeta meta = 1;
  string operation_id = 2;
  // The revision the caller read for this session key. 0 means "no session has
  // ever been created for it".
  uint64 expected_revision = 3;
  Session session = 10;
}
message CreateSessionResponse {
  Session session = 1;
  CanvasOperationReceipt receipt = 2;
}

// armadra.v1.SessionService/Start — ask the Worker for a run.
//
// The launch is not in this request. It was frozen at creation, and a start
// that could restate it would be a second place the command line is decided.
message StartSessionRequest {
  CommandMeta meta = 1;
  string operation_id = 2;
  uint64 expected_revision = 3;
  string session_id = 10;
}
message StartSessionResponse {
  Session session = 1;
  SessionRun run = 2;
  CanvasOperationReceipt receipt = 3;
}

message GetSessionRequest {
  CommandMeta meta = 1;
  string session_id = 10;
  // Alternative lookup: the logical key, which survives recycles. Exactly one
  // of the two is given; naming both is refused rather than resolved by
  // precedence, because the two could name different sessions.
  string session_key = 11;
}
message GetSessionResponse {
  Session session = 1;
  // The current generation's run, absent while the session is PENDING.
  SessionRun run = 2;
}

message ListSessionsRequest {
  CommandMeta meta = 1;
  string after_session_id = 10;
  uint32 limit = 11;
  // Empty means every kind.
  repeated SessionKind kinds = 12;
}
message ListSessionsResponse {
  repeated Session sessions = 10;
  string next_session_id = 11;
  bool has_more = 12;
}

// armadra.v1.SessionService/Terminate — end the run, keep the record.
message TerminateSessionRequest {
  CommandMeta meta = 1;
  string operation_id = 2;
  uint64 expected_revision = 3;
  string session_id = 10;
  TerminationIntent intent = 30;
  // `interrupt` stops the foreground program, `process` ends the process tree,
  // `session` destroys the persistent session too. The three are the execution
  // host's own vocabulary and are passed through rather than mapped, because
  // mapping them would make the Host decide how hard to kill something.
  string mode = 11;
}
message TerminateSessionResponse {
  Session session = 1;
  CanvasOperationReceipt receipt = 2;
}

// armadra.v1.SessionService/Recycle — same logical session, next generation.
message RecycleSessionRequest {
  CommandMeta meta = 1;
  string operation_id = 2;
  uint64 expected_revision = 3;
  string session_id = 10;
}
message RecycleSessionResponse {
  Session session = 1;
  SessionRun run = 2;
  CanvasOperationReceipt receipt = 3;
}

// armadra.v1.SessionService/Close — withdraw the intent.
//
// Closing is not terminating. A closed session should no longer exist at all,
// so the record becomes a tombstone; whether the process is also killed is the
// caller's separate decision, expressed by terminating first.
message CloseSessionRequest {
  CommandMeta meta = 1;
  string operation_id = 2;
  uint64 expected_revision = 3;
  string session_id = 10;
}
message CloseSessionResponse {
  string session_id = 1;
  CanvasOperationReceipt receipt = 2;
}

// armadra.v1.SessionService/SuggestTitle — execution, forwarded to the Worker.
//
// The answer comes from the transcript or from the live pane, both of which are
// on the execution host. The Host resolves which node the session belongs to
// and forwards; it does not read transcripts.
message SuggestSessionTitleRequest {
  CommandMeta meta = 1;
  string session_id = 10;
}
message SuggestSessionTitleResponse {
  string title = 1;
  // `transcript`, `terminal` or empty. It is evidence for the client, which
  // shows a suggestion from the live pane differently from one out of a log.
  string source = 2;
}

// armadra.v1.SessionService/GetContextUsage — read the Worker's own cache.
message GetSessionContextUsageRequest {
  CommandMeta meta = 1;
  string session_id = 10;
  // Recompute rather than answer from the cache.
  bool refresh = 11;
}
message GetSessionContextUsageResponse {
  // The Worker's snapshot as it computed it, kept opaque with its own digest
  // and schema version (§2.1 大载荷). The context-usage shape belongs to the
  // agent domain, which has not settled one; expanding it into fields here
  // would freeze it before that batch decides it.
  bytes usage = 10;
  bytes usage_sha256 = 11;
  uint32 schema_version = 12;
  int64 observed_at_unix_ms = 40;
}

/* ------------------------------------------------- Host -> Worker (action 27) */

// Start a run for a session the Host has already recorded.
//
// Everything needed to launch travels here, because the Worker holds no session
// intent of its own once the domain has moved: it is told what to run, it runs
// it, and it reports the generation it allocated.
message StartSessionRunRequest {
  string session_id = 1;
  string workspace_id = 2;
  string session_key = 3;
  string owner_node_id = 4;
  SessionLaunch launch = 10;
  SessionKind kind = 30;
}

// Signal an existing run. `mode` is the execution host's own vocabulary
// (`interrupt` / `process` / `session` / `recycle`), passed through unchanged.
message SignalSessionRunRequest {
  string session_id = 1;
  // The generation the caller decided against. A signal aimed at a generation
  // that has been replaced is refused rather than applied to the new one,
  // which is the whole reason the number exists.
  uint64 generation = 2;
  string mode = 10;
}

// Ask what the execution host actually holds (§5.3, 会话重认领三方).
//
// The reconciliation is deliberately one-directional: the Worker's answer is
// the truth about processes, and the Host's records are a projection of it. A
// session the Worker does not list is not deleted here — it is reported, and
// the Host decides between EXITED and LOST from whether the Worker answered at
// all.
message ReclaimSessionRunsRequest {
  // Empty means every session this Worker knows about.
  repeated string session_ids = 10;
}

// One screenful of a run, for a title suggestion or a status card.
message CaptureSessionRunRequest {
  string session_id = 1;
  uint32 lines = 10;
  // Keep the SGR sequences, for a snapshot rather than for reading.
  bool escapes = 11;
}
message CapturedSessionRun {
  string session_id = 1;
  string data = 10;
}

// What the Worker knows about one session right now. It is an observation, not
// a record: nothing here has a revision, because the Worker stores no CAS token
// for a domain it no longer owns.
message WorkerSessionState {
  string session_id = 1;
  string workspace_id = 2;
  string session_key = 3;
  string owner_node_id = 4;
  string backend_kind = 10;
  string backend_ref = 11;
  uint64 generation = 12;
  optional int32 exit_code = 13;
  string worker_instance_id = 14;
  SessionKind kind = 30;
  SessionStatus status = 31;
  SessionAttachState attach_state = 32;
  TerminationIntent termination_intent = 33;
  SessionLaunch launch = 15;
  string reason_code = 39;
  int64 created_at_unix_ms = 40;
  int64 ended_at_unix_ms = 41;
  int64 last_output_at_unix_ms = 42;
}

message WorkerSessionStates {
  repeated WorkerSessionState sessions = 10;
  // The Worker process that answered. It is half of the run identity, so a
  // reclaim can tell "the same run, still there" from "a new run under the
  // same key".
  string worker_instance_id = 1;
}

// Read this Worker's own session rows, for verifying a switch and a handback.
// It is the session domain's equivalent of `ListWorkerRootsRequest`: the
// comparison is only worth making because the answer comes from the rows rather
// than from the request that stored them.
message ListWorkerSessionsRequest {}

message SessionWorkerRequest {
  oneof action {
    ListWorkerSessionsRequest list_sessions = 100;
    StartSessionRunRequest start_run = 101;
    SignalSessionRunRequest signal_run = 102;
    ReclaimSessionRunsRequest reclaim_runs = 103;
    CaptureSessionRunRequest capture_run = 104;
    SuggestSessionTitleRequest suggest_title = 105;
    GetSessionContextUsageRequest context_usage = 106;
  }
}

message SessionWorkerResponse {
  oneof result {
    WorkerSessionStates sessions = 100;
    WorkerSessionState run = 101;
    CapturedSessionRun capture = 104;
    SuggestSessionTitleResponse title = 105;
    GetSessionContextUsageResponse context_usage = 106;
  }
}

/* ------------------------------------------------- Worker -> Host (upcall 140) */

// What the Worker observed about a run, reported without being asked.
//
// The four kinds are four different statements and are deliberately not one
// "changed" event: a client draws a run that exited differently from one whose
// Worker went silent, and an attach count is not a lifecycle change at all.
enum WorkerSessionUpcallKind {
  WORKER_SESSION_UPCALL_KIND_UNSPECIFIED = 0;
  WORKER_SESSION_UPCALL_KIND_RUN_STARTED = 1;
  WORKER_SESSION_UPCALL_KIND_RUN_EXITED = 2;
  // The run was not found where it was expected. It is not an exit: nobody
  // saw it end, and a client must not be told that it did.
  WORKER_SESSION_UPCALL_KIND_RUN_LOST = 3;
  WORKER_SESSION_UPCALL_KIND_ATTACH_COUNT_CHANGED = 4;
}

message WorkerSessionUpcall {
  string session_id = 1;
  string workspace_id = 2;
  string session_key = 3;
  uint64 generation = 4;
  string worker_instance_id = 5;
  string backend_ref = 10;
  optional int32 exit_code = 11;
  uint32 attach_count = 12;
  SessionAttachState attach_state = 32;
  WorkerSessionUpcallKind kind = 30;
  string reason_code = 39;
  int64 observed_at_unix_ms = 40;
}
