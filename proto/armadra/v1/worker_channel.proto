syntax = "proto3";
package armadra.v1;
option go_package = "armadra.local/host/gen/armadra/v1";
import "armadra/v1/git.proto";

import "armadra/v1/session.proto";

// The Worker's upward half of the resident bidirectional channel (Go Host
// business migration §2.9, §2.10). The first phase spoke only when spoken to:
// the Host wrote a WorkerRequest and read exactly one WorkerResponse back. The
// business domains need the other direction — a Hook turn, an approval that
// appeared, a session that exited — so the same connection now also carries
// Worker→Host frames that no request asked for.
//
// Both directions share one four-byte prefix. The high byte is the frame kind
// and the low three bytes are the length, so every frame this file describes is
// distinguishable from a WorkerRequest/WorkerResponse before it is decoded: a
// receiver never has to guess which message a byte string was meant to be. The
// one-MiB ceiling fits in the remaining 24 bits, so first-phase frames keep
// their exact bytes and a peer that predates this file refuses an upcall frame
// as an oversized length instead of misreading it.
//
// Reliability is the Worker's problem, not the transport's. Every upcall is
// written to the Worker's durable outbox before it is sent and removed only
// when a WorkerUpcallReply acknowledges it, so a killed Worker replays from the
// lowest unacknowledged sequence on the next connection. The Host deduplicates
// by (worker_instance_id, sequence); a new instance id resets the window
// because sequences are only meaningful within one Worker process.

// What a Worker reports about its own upcall channel during the handshake,
// carried in WorkerHelloResponse.channel. Absent means this Worker has no
// durable outbox and will never send an upcall, which is a different statement
// from "has nothing to send right now".
message WorkerChannelCapability {
  // Stable for the life of this Worker process and identical to
  // WorkerHelloResponse.instance_id. It is repeated here because it is half of
  // the deduplication key, and a Host that reads only the channel record must
  // not have to reach for a field that means something else elsewhere.
  string worker_instance_id = 1;
  // Absolute path of the Worker's private socket bearer, empty when none was
  // bound. Reachable only by this user; it is an alternative to stdio for the
  // same frames, never a second, differently authorized surface.
  string socket = 2;
  // Windows named pipe form of the same bearer, `\\.\pipe\NAME`.
  string pipe = 3;
  // The highest sequence this Worker has durably queued. Zero means nothing
  // has ever been queued by this instance.
  uint64 highest_sequence = 10;
  // How many of those are still unacknowledged, i.e. how many frames the Host
  // should expect to be replayed at the start of this connection.
  uint32 unacknowledged = 11;
  // The Worker stops accepting new upcalls once this many are unacknowledged,
  // rather than growing the outbox without bound behind a deaf Host.
  uint32 max_unacknowledged = 12;
  WorkerChannelState state = 30;
  string reason_code = 39;
}

enum WorkerChannelState {
  WORKER_CHANNEL_STATE_UNSPECIFIED = 0;
  // The Worker was started without a durable outbox; it answers requests only.
  WORKER_CHANNEL_STATE_DISABLED = 1;
  WORKER_CHANNEL_STATE_READY = 2;
  // Unacknowledged frames from an earlier connection are being replayed first.
  WORKER_CHANNEL_STATE_REPLAYING = 3;
}

// One Worker→Host frame. `request_id` starts with `w-` and a Host→Worker
// request id starts with `h-`, so the two pending tables on one connection can
// never collide and neither direction blocks the other.
message WorkerUpcall {
  string request_id = 1;
  string worker_instance_id = 2;
  // Monotonic and gapless within one worker_instance_id, starting at 1. The
  // Host acknowledges the highest contiguous sequence it has accepted.
  uint64 sequence = 3;
  // 1 on the first send, higher on a replay after a reconnect. It is evidence
  // for an operator, never a reason for the Host to treat the frame
  // differently: deduplication is by (worker_instance_id, sequence) alone.
  uint32 attempt = 4;
  int64 emitted_at_unix_ms = 40;
  // One member per business domain, twenty numbers apart as §2.1 requires:
  // 100 settings, 120 filesystem, 140 session, 160 agent, 180 git. The number
  // is the domain's slot, not the order the batches landed: continuing from
  // the highest member in use would have put the session domain past the agent
  // one and made the scheme mean nothing.
  oneof event {
    WorkerSessionUpcall session = 140;
    WorkerAgentUpcall agent = 160;
    WorkerGitUpcall git = 180;
  }
}

// An agent-domain report from the execution host: something the Worker
// observed, not something it decided. The body stays an opaque payload with its
// own digest and schema version (§2.1 大载荷), because the Host of this batch
// only records it — expanding it into typed fields would freeze a shape before
// the agent domain (B4) has one.
message WorkerAgentUpcall {
  string workspace_id = 1;
  string node_id = 2;
  string session_id = 3;
  // The generation the observation was made against, so a report about a pane
  // that has since been replaced is visible as one rather than applied to the
  // pane that replaced it (agent domain, §2.7).
  uint64 generation = 4;
  // The identifier of whatever the report is about — an approval id, a trace
  // id, a hook event id. It is what makes a replayed frame the same record
  // rather than a second one; `(worker_instance_id, sequence)` deduplicates a
  // frame, and this deduplicates the *thing* across Worker restarts, where the
  // sequence window has been reset.
  string entity_id = 5;
  bytes payload = 10;
  // SHA-256 of `payload`, so a truncated or rewritten body is refused rather
  // than stored as a shorter event.
  bytes payload_sha256 = 11;
  uint32 schema_version = 12;
  WorkerAgentUpcallKind kind = 30;
  string reason_code = 39;
  int64 observed_at_unix_ms = 40;
}

enum WorkerAgentUpcallKind {
  WORKER_AGENT_UPCALL_KIND_UNSPECIFIED = 0;
  // A CLI hook reported the end of a turn.
  WORKER_AGENT_UPCALL_KIND_HOOK_TURN = 1;
  // A CLI is blocked waiting for a permission answer.
  WORKER_AGENT_UPCALL_KIND_APPROVAL_REQUESTED = 2;
  // What became of one attempt to put something in front of an agent. It is a
  // receipt, not a decision: whether SUBMITTED or UNKNOWN is the right reading
  // is a fact about the execution host's input gate, which is why the outcome
  // travels rather than being inferred here from the absence of an error.
  WORKER_AGENT_UPCALL_KIND_DELIVERY_RECEIPT = 3;
  // A node left a message for another node through the Hook's own verbs.
  WORKER_AGENT_UPCALL_KIND_MAILBOX_POST = 4;
  // A node acknowledged one it had been left.
  WORKER_AGENT_UPCALL_KIND_MAILBOX_ACK = 5;
}

// The Host's receipt. `ack_sequence` is the highest *contiguous* sequence the
// Host has accepted from this instance, so one reply can retire a whole replay
// burst and a lost reply costs a repeat, never a loss.
message WorkerUpcallReply {
  string request_id = 1;
  string host_id = 2;
  string worker_instance_id = 3;
  uint64 ack_sequence = 10;
  WorkerUpcallDisposition disposition = 30;
  string reason_code = 39;
  int64 received_at_unix_ms = 40;
}

enum WorkerUpcallDisposition {
  WORKER_UPCALL_DISPOSITION_UNSPECIFIED = 0;
  WORKER_UPCALL_DISPOSITION_ACCEPTED = 1;
  // Already recorded under this (worker_instance_id, sequence). The Worker
  // drops it from the outbox exactly as it would an acceptance.
  WORKER_UPCALL_DISPOSITION_DUPLICATE = 2;
  // Malformed or out of window. The frame is dropped rather than replayed
  // forever; `reason_code` says which, and the Worker keeps its channel.
  WORKER_UPCALL_DISPOSITION_REJECTED = 3;
}

// A git-domain report from the execution host (business migration §2.8,
// Git 设计 §10): progress on a running operation, the outcome of one that
// finished, a repository that changed under an external `git`, a conflict that
// stopped an integration, or a worktree that appeared or vanished.
//
// It is a report, not a decision. The Worker says what it observed; whether a
// finished push counts as SUCCEEDED or UNKNOWN_OUTCOME is a reading of the
// execution host's own state, which is why the state travels here rather than
// being inferred by the Host from the absence of an error.
message WorkerGitUpcall {
  string workspace_id = 1;
  // Empty for a repository or worktree change: those are observations about a
  // checkout, not about anything the Host queued.
  string operation_id = 2;
  string repository_path = 3;
  uint32 progress = 10;
  repeated string affected = 11;
  // Present on REPOSITORY_CHANGED, so the Host's cache is refreshed by the
  // same frame that announced the change rather than by a follow-up read that
  // could observe a third state.
  RepositoryState repository = 12;
  GitOperationState state = 30;
  WorkerGitUpcallKind kind = 31;
  string reason_code = 39;
  int64 observed_at_unix_ms = 40;
}

enum WorkerGitUpcallKind {
  WORKER_GIT_UPCALL_KIND_UNSPECIFIED = 0;
  WORKER_GIT_UPCALL_KIND_OPERATION_PROGRESS = 1;
  WORKER_GIT_UPCALL_KIND_OPERATION_FINISHED = 2;
  WORKER_GIT_UPCALL_KIND_REPOSITORY_CHANGED = 3;
  WORKER_GIT_UPCALL_KIND_CONFLICT_DETECTED = 4;
  WORKER_GIT_UPCALL_KIND_WORKTREE_CHANGED = 5;
}
