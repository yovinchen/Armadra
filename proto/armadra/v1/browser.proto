syntax = "proto3";

package armadra.v1;

option go_package = "armadra.local/host/gen/armadra/v1";

import "armadra/v1/common.proto";

// Controlled embedded browser — B01, docs/design/editor-browser-design.md §5-§9.
//
// The Rust Runtime speaks JSON on loopback today; these messages are the
// cross-device and remote-Worker contract for the same surface, so every field
// name here is the snake_case of the JSON key the Runtime already uses. There
// is deliberately no generic `eval` and no raw CDP method: an action a caller
// can name is an action this file defines (§7).

enum BrowserSessionState {
  BROWSER_SESSION_STATE_UNSPECIFIED = 0;
  // The profile is being launched and CDP has not answered yet.
  BROWSER_SESSION_STATE_STARTING = 1;
  BROWSER_SESSION_STATE_READY = 2;
  // The browser process went away while the session is still supposed to
  // exist. The row and the profile survive so the URL can be restored.
  BROWSER_SESSION_STATE_DISCONNECTED = 3;
  // Ended on purpose. Never reached by closing a node (§9).
  BROWSER_SESSION_STATE_TERMINATED = 4;
  // No usable browser on this execution host. Carries a reason code and never
  // a fake button (§5: "缺少浏览器时提供安装/选择流程及明确不可用状态").
  BROWSER_SESSION_STATE_UNSUPPORTED = 5;
}

// CSS pixels, never canvas pixels: the client scales the frame inside its
// browser node rather than writing the zoom into the page viewport (§8).
message BrowserViewport {
  uint32 width = 1;
  uint32 height = 2;
  double device_scale_factor = 3;
}

message BrowserSession {
  string session_id = 1;
  // Bumped every time the underlying browser process is (re)launched for this
  // session, so a client can tell a restored session from the one it saw.
  uint64 generation = 2;
  string workspace_id = 3;
  string node_id = 4;
  string url = 5;
  string title = 6;
  BrowserViewport viewport = 7;
  BrowserSessionState state = 8;
  // Stable machine code (`chrome_not_found`, `launch_failed`, `cdp_closed`,
  // …). Never raw browser stderr.
  string reason_code = 9;
  // Incremented by every committed navigation. Element references and queued
  // input carry it; a stale one is refused rather than replayed (§7/§8).
  uint64 navigation_epoch = 10;
  bool headful = 11;
  // Closing the node only stops the picture; ending the session is explicit.
  bool keep_alive = 12;
  int64 created_at_unix_ms = 13;
  int64 updated_at_unix_ms = 14;
  // The tab screencast, input and viewport apply to. One session is one
  // browser process and one profile; tabs live inside it (§2.2).
  string active_tab_id = 15;
  uint32 tab_count = 16;
  BrowserLease lease = 17;
  // Set while a tab is blocked on a JS dialog. Input aimed at that tab is
  // refused with DIALOG_PENDING rather than silently swallowed (§2.4).
  BrowserDialog pending_dialog = 18;
  BrowserFileChooser pending_file_chooser = 19;
  // Survives a Runtime restart so an old client's generation cannot come back
  // to life; the in-memory lease itself starts out free (§2.6).
  uint64 lease_generation = 20;
}

message BrowserAvailability {
  bool available = 1;
  // Absolute path of the executable that would be launched.
  string executable = 2;
  // "settings" | "environment" | "detected"
  string source = 3;
  string reason_code = 4;
  // Every candidate that was looked for, so the UI can say what it tried.
  repeated string searched = 5;
  // The build-pinned Chrome for Testing install, which is preferred over a
  // detected system browser because its CDP surface is the tested one (§2.1).
  BrowserManagedState managed = 6;
}

// One screencast image. The payload is an encoded image rather than a video
// frame in this round; a later video channel replaces `data` and keeps the
// session and input contracts (§8).
message BrowserFrame {
  string session_id = 1;
  uint64 generation = 2;
  uint64 frame_seq = 3;
  uint64 navigation_epoch = 4;
  uint32 viewport_width = 5;
  uint32 viewport_height = 6;
  double device_scale_factor = 7;
  // "jpeg" | "webp" — negotiated per session (§2.9). The workspace event
  // channel only ever carries JPEG: it exists for clients that predate the
  // dedicated stream, and those cannot say what they can decode.
  string encoding = 8;
  bytes data = 9;
  int64 captured_at_unix_ms = 10;
  string tab_id = 11;
}

/* -------------------------------- navigation ------------------------------ */

enum BrowserNavigationAction {
  BROWSER_NAVIGATION_ACTION_UNSPECIFIED = 0;
  BROWSER_NAVIGATION_ACTION_GOTO = 1;
  BROWSER_NAVIGATION_ACTION_BACK = 2;
  BROWSER_NAVIGATION_ACTION_FORWARD = 3;
  BROWSER_NAVIGATION_ACTION_RELOAD = 4;
  BROWSER_NAVIGATION_ACTION_STOP = 5;
}

message BrowserNavigateRequest {
  CommandMeta meta = 1;
  string session_id = 2;
  BrowserNavigationAction action = 3;
  // http/https only, or a loopback address the project declared (§6).
  string url = 4;
  // Absent means the active tab's main frame, so existing callers are
  // unchanged by the introduction of tabs (§2.2).
  BrowserTarget target = 5;
}

/* ---------------------------------- input --------------------------------- */

enum BrowserInputKind {
  BROWSER_INPUT_KIND_UNSPECIFIED = 0;
  BROWSER_INPUT_KIND_MOUSE_MOVED = 1;
  BROWSER_INPUT_KIND_MOUSE_PRESSED = 2;
  BROWSER_INPUT_KIND_MOUSE_RELEASED = 3;
  BROWSER_INPUT_KIND_WHEEL = 4;
  BROWSER_INPUT_KIND_KEY_DOWN = 5;
  BROWSER_INPUT_KIND_KEY_UP = 6;
  // Committed composition text. IME goes through this and is never split into
  // synthetic key events (§8).
  BROWSER_INPUT_KIND_TEXT = 7;
  BROWSER_INPUT_KIND_TOUCH_START = 8;
  BROWSER_INPUT_KIND_TOUCH_MOVE = 9;
  BROWSER_INPUT_KIND_TOUCH_END = 10;
}

message BrowserInputEvent {
  BrowserInputKind kind = 1;
  // CSS pixels inside the page viewport, already mapped back from the shape.
  double x = 2;
  double y = 3;
  double delta_x = 4;
  double delta_y = 5;
  // "left" | "middle" | "right" | "none"
  string button = 6;
  uint32 click_count = 7;
  // CDP modifier bitmask: 1 alt, 2 ctrl, 4 meta, 8 shift.
  uint32 modifiers = 8;
  string key = 9;
  string code = 10;
  string text = 11;
}

message BrowserInputRequest {
  CommandMeta meta = 1;
  string session_id = 2;
  // Refused when it no longer matches the session: input aimed at a page that
  // has already navigated is never replayed against the new one.
  uint64 navigation_epoch = 3;
  uint64 frame_seq = 4;
  repeated BrowserInputEvent events = 5;
  BrowserTarget target = 6;
  // Refused when the lease changed hands since the caller last looked, so a
  // revoked agent cannot land one more click (§2.6).
  uint64 lease_generation = 7;
  // The viewer this input came from: that end's own opaque id, used only to
  // tell viewers apart and never to grant anything.
  string device_id = 8;
}

/* ---------------------------------- reads --------------------------------- */

enum BrowserReadMode {
  BROWSER_READ_MODE_UNSPECIFIED = 0;
  BROWSER_READ_MODE_TEXT = 1;
  BROWSER_READ_MODE_ELEMENTS = 2;
  BROWSER_READ_MODE_LINKS = 3;
  BROWSER_READ_MODE_TITLE = 4;
  BROWSER_READ_MODE_CONSOLE = 5;
  BROWSER_READ_MODE_NETWORK = 6;
}

// A reference bound to session/epoch. After a navigation the same string is
// refused with STALE_TARGET rather than resolved against the new document.
message BrowserElement {
  string element_ref = 1;
  string role = 2;
  string name = 3;
  string value = 4;
  string selector = 5;
  bool visible = 6;
  double x = 7;
  double y = 8;
  double width = 9;
  double height = 10;
  // Empty for the active tab's main frame, which is what `e<epoch>-<idx>`
  // alone addresses; a reference inside an iframe carries both (§2.2).
  string tab_id = 11;
  string frame_id = 12;
}

message BrowserConsoleEntry {
  int64 at_unix_ms = 1;
  // "error" | "warning" | "info" | "log" | "debug" | "pageerror"
  string level = 2;
  string text = 3;
  string url = 4;
  uint32 line = 5;
}

// Summary only. Request and response bodies are never carried, and the header
// set is deliberately absent rather than redacted (§6).
message BrowserNetworkEntry {
  int64 at_unix_ms = 1;
  string method = 2;
  string url = 3;
  uint32 status = 4;
  string mime_type = 5;
  uint64 encoded_bytes = 6;
  string failure_code = 7;
  bool from_cache = 8;
}

message BrowserReadRequest {
  CommandMeta meta = 1;
  string session_id = 2;
  BrowserReadMode mode = 3;
  uint32 limit = 4;
  uint32 max_bytes = 5;
  BrowserTarget target = 6;
}

message BrowserReadResponse {
  string session_id = 1;
  uint64 navigation_epoch = 2;
  string url = 3;
  string title = 4;
  string text = 5;
  repeated BrowserElement elements = 6;
  repeated BrowserConsoleEntry console = 7;
  repeated BrowserNetworkEntry network = 8;
  // Set when a bound cut the answer; a silently halved page is worse than a
  // short one that says so.
  bool truncated = 9;
}

/* --------------------------------- actions -------------------------------- */

message BrowserClickRequest {
  CommandMeta meta = 1;
  string session_id = 2;
  uint64 navigation_epoch = 3;
  // Exactly one of a CSS selector, an element reference from a read, or a
  // viewport coordinate pair.
  string selector = 4;
  string element_ref = 5;
  double x = 6;
  double y = 7;
  uint32 modifiers = 8;
  uint32 click_count = 9;
  BrowserTarget target = 10;
}

message BrowserTypeRequest {
  CommandMeta meta = 1;
  string session_id = 2;
  uint64 navigation_epoch = 3;
  string selector = 4;
  string element_ref = 5;
  string text = 6;
  // Clear the field before inserting instead of appending.
  bool replace = 7;
  // Press Enter afterwards. Never inferred from the text.
  bool submit = 8;
  BrowserTarget target = 9;
}

message BrowserWaitRequest {
  CommandMeta meta = 1;
  string session_id = 2;
  // At most one condition; "network idle" is not offered because it cannot be
  // bounded honestly (§7).
  string selector = 3;
  string url_contains = 4;
  string title_contains = 5;
  uint32 timeout_ms = 6;
  BrowserTarget target = 7;
}

message BrowserWaitResponse {
  bool matched = 1;
  string reason_code = 2;
  uint64 navigation_epoch = 3;
  uint32 waited_ms = 4;
}

message BrowserCaptureRequest {
  CommandMeta meta = 1;
  string session_id = 2;
  bool full_page = 3;
  // "png" | "jpeg"
  string format = 4;
  BrowserTarget target = 5;
}

message BrowserCaptureResponse {
  // Workspace-relative path under `.armadra/`, never an absolute host path.
  string path = 1;
  uint32 width = 2;
  uint32 height = 3;
  bytes sha256 = 4;
  uint64 bytes = 5;
  uint64 navigation_epoch = 6;
}

/* -------------------------------- downloads ------------------------------- */

enum BrowserDownloadState {
  BROWSER_DOWNLOAD_STATE_UNSPECIFIED = 0;
  // Held: nothing is written until a human accepts it (§6).
  BROWSER_DOWNLOAD_STATE_PENDING = 1;
  BROWSER_DOWNLOAD_STATE_IN_PROGRESS = 2;
  BROWSER_DOWNLOAD_STATE_COMPLETED = 3;
  BROWSER_DOWNLOAD_STATE_CANCELLED = 4;
  BROWSER_DOWNLOAD_STATE_FAILED = 5;
}

message BrowserDownload {
  string download_id = 1;
  string session_id = 2;
  string url = 3;
  string suggested_filename = 4;
  BrowserDownloadState state = 5;
  // Workspace-relative, inside the project's download directory.
  string path = 6;
  uint64 total_bytes = 7;
  uint64 received_bytes = 8;
  int64 created_at_unix_ms = 9;
  string reason_code = 10;
  string tab_id = 11;
  // Computed once the bytes are complete, so an accepted download can be
  // named by content rather than only by the page's suggested filename.
  bytes sha256 = 12;
}

message BrowserDownloadDecisionRequest {
  CommandMeta meta = 1;
  string session_id = 2;
  string download_id = 3;
  bool accept = 4;
}

/* --------------------------------- envelope ------------------------------- */

message CreateBrowserSessionRequest {
  CommandMeta meta = 1;
  string workspace_id = 2;
  string node_id = 3;
  string url = 4;
  BrowserViewport viewport = 5;
  bool headful = 6;
}

message CloseBrowserSessionRequest {
  CommandMeta meta = 1;
  string session_id = 2;
  // False detaches the picture and leaves the page running (§9).
  bool terminate = 3;
}

message ListBrowserSessionsRequest {
  CommandMeta meta = 1;
  string workspace_id = 2;
}

message ListBrowserSessionsResponse {
  repeated BrowserSession sessions = 1;
  BrowserAvailability availability = 2;
}

// The whole controlled-browser action surface, as one closed oneof. A caller
// can only ask for what is named here.
message BrowserAction {
  // 9 was `subscribe`: the frame stream retired with the screencast
  // (electron-migration §4.1). The number is never reused.
  reserved 9;
  oneof action {
    CreateBrowserSessionRequest create = 1;
    BrowserNavigateRequest navigate = 2;
    BrowserInputRequest input = 3;
    BrowserReadRequest read = 4;
    BrowserClickRequest click = 5;
    BrowserTypeRequest type = 6;
    BrowserWaitRequest wait = 7;
    BrowserCaptureRequest capture = 8;
    BrowserDownloadDecisionRequest download_decision = 10;
    CloseBrowserSessionRequest close = 11;
    ListBrowserSessionsRequest list = 12;
    BrowserSelectRequest select = 13;
    BrowserPressRequest press = 14;
    BrowserScrollRequest scroll = 15;
    BrowserUploadRequest upload = 16;
    BrowserDialogRequest dialog = 17;
    BrowserTabRequest tabs = 18;
    BrowserLeaseRequest lease = 19;
    BrowserCloseTabRequest close_tab = 20;
    BrowserManagedInstallRequest managed_install = 21;
  }
}

message BrowserActionResult {
  // 14 was `subscription`, the receipt that stream answered with.
  reserved 14;
  string request_id = 1;
  oneof result {
    BrowserSession session = 10;
    BrowserReadResponse read = 11;
    BrowserWaitResponse wait = 12;
    BrowserCaptureResponse capture = 13;
    BrowserDownload download = 15;
    ListBrowserSessionsResponse sessions = 16;
    ErrorResponse error = 17;
    BrowserTabList tabs = 18;
    BrowserLease lease = 19;
    BrowserDialog dialog = 20;
    BrowserManagedState managed = 21;
    BrowserUploadResponse upload = 22;
  }
}

/* ------------------------------ managed binary ---------------------------- */

// A build-pinned Chrome for Testing install under
// `<data_dir>/browser-managed/`. Nothing is ever downloaded on its own: the
// user asks once, and the manifest that says what to fetch and what its
// sha256 must be ships inside the build (§2.1).
enum BrowserManagedInstallState {
  BROWSER_MANAGED_INSTALL_STATE_UNSPECIFIED = 0;
  BROWSER_MANAGED_INSTALL_STATE_ABSENT = 1;
  BROWSER_MANAGED_INSTALL_STATE_DOWNLOADING = 2;
  BROWSER_MANAGED_INSTALL_STATE_VERIFYING = 3;
  BROWSER_MANAGED_INSTALL_STATE_INSTALLED = 4;
  BROWSER_MANAGED_INSTALL_STATE_FAILED = 5;
}

message BrowserManagedState {
  BrowserManagedInstallState state = 1;
  string version = 2;
  uint64 received_bytes = 3;
  uint64 total_bytes = 4;
  // `manifest_missing_target`, `sha256_mismatch`, `signature_invalid`,
  // `network`, `download_disabled`. Never a raw transport error.
  string reason_code = 5;
  // Absolute path of the installed executable; empty until installed.
  string executable = 6;
  // False when the build's manifest has no entry for this OS and
  // architecture, so the panel says so instead of offering a dead button.
  bool supported = 7;
}

message BrowserManagedInstallRequest {
  CommandMeta meta = 1;
  // False removes an installed managed browser instead of installing one.
  bool install = 2;
}

/* --------------------------- tabs, frames, targets ------------------------ */

// Where an action lands. Both halves absent means the active tab's main
// frame, which is what every pre-tab caller meant (§2.2).
message BrowserTarget {
  // Runtime's own stable ordinal (`t1`, `t2`, …).
  string tab_id = 1;
  string frame_id = 2;
}

// One CDP page target, named by Runtime. The CDP `targetId` is deliberately
// absent: a client that could name it could address targets this file does
// not define.
message BrowserTab {
  string tab_id = 1;
  string url = 2;
  string title = 3;
  bool active = 4;
  // Set when the page opened this tab itself, so a popup can be shown as one.
  string opener_tab_id = 5;
  uint64 navigation_epoch = 6;
  bool loading = 7;
  BrowserDialog pending_dialog = 8;
  // The tab's icon as a `data:` URL, resolved inside the controlled browser
  // and capped at a few kilobytes. A URL would make every client that draws a
  // tab strip fetch the site's icon from its own browser, with its own
  // cookies — the controlled session is the one that is visiting the site, so
  // it is the one that fetches. Empty when the page has none or it is too
  // large (§2.8).
  string favicon = 9;
}

message BrowserTabList {
  repeated BrowserTab tabs = 1;
  string active_tab_id = 2;
  // Per-session ceiling; a page that opens more gets `tab_limit` (§2.2).
  uint32 limit = 3;
}

/* ---------------------------------- lease --------------------------------- */

enum BrowserLeaseState {
  BROWSER_LEASE_STATE_UNSPECIFIED = 0;
  BROWSER_LEASE_STATE_FREE = 1;
  BROWSER_LEASE_STATE_HUMAN = 2;
  // A human pressed "take over": the agent's lease is revoked rather than
  // queued behind, and it is told so (§2.6).
  BROWSER_LEASE_STATE_HUMAN_TAKEOVER = 3;
  BROWSER_LEASE_STATE_AGENT = 4;
}

message BrowserLeaseHuman {
  string device_id = 1;
  string display_name = 2;
}

message BrowserLeaseAgent {
  string node_id = 1;
  string session_id = 2;
  string display_name = 3;
}

// One session, one holder. Reads never need it; input-shaped actions do.
message BrowserLease {
  BrowserLeaseState state = 1;
  // Bumped on every change of holder, so a request minted under the previous
  // holder is refused rather than applied.
  uint64 generation = 2;
  int64 expires_at_unix_ms = 3;
  oneof holder {
    BrowserLeaseHuman human = 4;
    BrowserLeaseAgent agent = 5;
  }
}

enum BrowserLeaseAction {
  BROWSER_LEASE_ACTION_UNSPECIFIED = 0;
  BROWSER_LEASE_ACTION_STATUS = 1;
  BROWSER_LEASE_ACTION_TAKEOVER = 2;
  BROWSER_LEASE_ACTION_RELEASE = 3;
}

message BrowserLeaseRequest {
  CommandMeta meta = 1;
  string session_id = 2;
  BrowserLeaseAction action = 3;
  uint64 lease_generation = 4;
  // Which viewer is taking over or handing back: that end's own opaque id,
  // used only to tell viewers apart and never to grant anything.
  string device_id = 5;
  // Shown next to the badge on the other clients. Free text from the viewer,
  // truncated, and never used for a decision.
  string display_name = 6;
}

/* --------------------------- dialogs and choosers ------------------------- */

enum BrowserDialogKind {
  BROWSER_DIALOG_KIND_UNSPECIFIED = 0;
  BROWSER_DIALOG_KIND_ALERT = 1;
  BROWSER_DIALOG_KIND_CONFIRM = 2;
  BROWSER_DIALOG_KIND_PROMPT = 3;
  // Never auto-accepted: whether leaving a page loses a form is a decision
  // for a person (§2.4).
  BROWSER_DIALOG_KIND_BEFORE_UNLOAD = 4;
}

message BrowserDialog {
  string dialog_id = 1;
  string tab_id = 2;
  BrowserDialogKind kind = 3;
  string message = 4;
  string default_prompt = 5;
  string url = 6;
  int64 opened_at_unix_ms = 7;
}

message BrowserDialogRequest {
  CommandMeta meta = 1;
  string session_id = 2;
  string tab_id = 3;
  string dialog_id = 4;
  bool accept = 5;
  string prompt_text = 6;
  uint64 lease_generation = 7;
}

message BrowserFileChooser {
  string chooser_id = 1;
  string tab_id = 2;
  string frame_id = 3;
  bool multiple = 4;
  // The page's `accept` attribute, shown to the person picking. It is a hint
  // for the picker, never a filter this side enforces.
  string accept = 5;
  int64 opened_at_unix_ms = 6;
}

/* ------------------------------- new actions ------------------------------ */

message BrowserSelectRequest {
  CommandMeta meta = 1;
  string session_id = 2;
  uint64 navigation_epoch = 3;
  string selector = 4;
  string element_ref = 5;
  // Repeated selects a multiple-choice list; a non-`<select>` target is
  // refused with NOT_SELECTABLE rather than clicked at.
  repeated string values = 6;
  repeated string labels = 7;
  BrowserTarget target = 8;
  uint64 lease_generation = 9;
}

message BrowserPressRequest {
  CommandMeta meta = 1;
  string session_id = 2;
  uint64 navigation_epoch = 3;
  // From a fixed whitelist; a chord is dispatched as one keyDown/keyUp pair
  // and text is never split into synthetic keys.
  string key = 4;
  uint32 modifiers = 5;
  uint32 repeat = 6;
  BrowserTarget target = 7;
  uint64 lease_generation = 8;
}

message BrowserScrollRequest {
  CommandMeta meta = 1;
  string session_id = 2;
  uint64 navigation_epoch = 3;
  // "up" | "down" | "left" | "right", with `amount` in CSS pixels; or an
  // element reference to bring into view.
  string direction = 4;
  double amount = 5;
  string element_ref = 6;
  BrowserTarget target = 7;
  uint64 lease_generation = 8;
}

message BrowserUploadRequest {
  CommandMeta meta = 1;
  string session_id = 2;
  // Answers a chooser the page opened, or fills an `input[type=file]`
  // directly when there is none.
  string chooser_id = 3;
  string selector = 4;
  string element_ref = 5;
  // Workspace-relative paths, resolved on the execution host. An absolute
  // path or one that escapes the root is refused (§2.3).
  repeated string paths = 6;
  BrowserTarget target = 7;
  uint64 lease_generation = 8;
}

// What `POST …/upload` answers. The paths come back exactly as they were
// asked for — workspace-relative — so a client never learns an execution-host
// absolute path from this route.
message BrowserUploadResponse {
  repeated string paths = 1;
  string tab_id = 2;
  // True when this answered a chooser the page had opened, rather than
  // filling an `input[type=file]` directly (§2.3).
  bool answered_chooser = 3;
}

enum BrowserTabAction {
  BROWSER_TAB_ACTION_UNSPECIFIED = 0;
  BROWSER_TAB_ACTION_LIST = 1;
  BROWSER_TAB_ACTION_SWITCH = 2;
  BROWSER_TAB_ACTION_NEW = 3;
}

message BrowserTabRequest {
  CommandMeta meta = 1;
  string session_id = 2;
  BrowserTabAction action = 3;
  string tab_id = 4;
  string url = 5;
  uint64 lease_generation = 6;
}

// Closes one tab. The last tab is refused with LAST_TAB: ending a session is
// `CloseBrowserSessionRequest.terminate`, and nothing else (§2.2).
message BrowserCloseTabRequest {
  CommandMeta meta = 1;
  string session_id = 2;
  string tab_id = 3;
  uint64 lease_generation = 4;
}

/* --------------------------------- activity ------------------------------- */

// One line for the node header: who did what, and how it ended. Only the
// last few are kept in memory; the durable record is the board log (§2.8).
message BrowserActivity {
  string session_id = 1;
  // "human" | "agent"
  string actor = 2;
  // Device id or agent node id, so a badge can name the other side.
  string actor_id = 3;
  string verb = 4;
  string target = 5;
  // "ok" | "refused" | "unknown". An action dispatched but never answered
  // because a lease was revoked is `unknown` and is not retried (§2.6).
  string outcome = 6;
  string reason_code = 7;
  int64 at_unix_ms = 8;
}
