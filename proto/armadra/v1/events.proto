syntax = "proto3";

package armadra.v1;

option go_package = "armadra.local/host/gen/armadra/v1";

import "armadra/v1/canvas.proto";
import "armadra/v1/common.proto";
import "armadra/v1/settings.proto";
import "armadra/v1/filesystem.proto";
import "armadra/v1/git.proto";

// The Host -> client business event stream (host business migration §2.3).
//
// One Host publishes one durable sequence. Every business domain the Host owns
// numbers its changes from it, in the same transaction that stored them, so a
// client resumes with the sequence it last applied and receives exactly what it
// missed — across domains, in the order the Host committed them.
//
// Three rules make that resumable rather than merely ordered:
//
//  1. **The cursor only moves forward.** A subscription states the last
//     sequence it applied; the Host answers with what follows it. Rewinding is
//     never implied by an empty page.
//  2. **A cursor that cannot be served is named, not approximated.**
//     SNAPSHOT_REQUIRED means the cursor is below the retained floor and the
//     client has to re-seed; CURSOR_AHEAD means the client holds sequences this
//     Host never issued (a restored database, or a different Host), and being
//     silently rewound to the watermark would discard applied work.
//  3. **A transaction arrives whole.** Events carry `transaction_id` with a
//     zero-based `transaction_index` out of `transaction_size`, so a consumer
//     recognises the group one operation produced and applies it together.
//
// Terminal bytes are not business events and never travel here: they keep their
// own per-session stream, ordered by session generation.
enum EventDomain {
  EVENT_DOMAIN_UNSPECIFIED = 0;
  EVENT_DOMAIN_CANVAS = 1;
  EVENT_DOMAIN_SETTINGS = 2;
  EVENT_DOMAIN_FILESYSTEM = 3;
  EVENT_DOMAIN_SESSION = 4;
  EVENT_DOMAIN_AGENT = 5;
  EVENT_DOMAIN_GIT = 6;
}

// Delivery priority within one connection. An approval request or a control
// confirmation is a question a human is waiting on: it must not sit behind a
// backlog of canvas moves that a slow client has not drained yet, so the Host
// keeps a separate queue for it. Priority never changes ordering *within* a
// queue, and never lets an event skip its own transaction group.
enum EventPriority {
  EVENT_PRIORITY_UNSPECIFIED = 0;
  EVENT_PRIORITY_NORMAL = 1;
  EVENT_PRIORITY_HIGH = 2;
}

enum EventCursorStatus {
  EVENT_CURSOR_STATUS_UNSPECIFIED = 0;
  EVENT_CURSOR_STATUS_OK = 1;
  // The cursor is older than the retained floor. Apply a snapshot first, then
  // resume from the sequence the snapshot reports.
  EVENT_CURSOR_STATUS_SNAPSHOT_REQUIRED = 2;
  // The cursor is beyond this Host's high watermark. The client must not
  // silently rewind: that would drop changes it has already applied.
  EVENT_CURSOR_STATUS_CURSOR_AHEAD = 3;
}

// One business change. `kind` is the domain's own entity name as a string so a
// new entity does not need a wire-format change to be carried; a client that
// does not know a kind ignores that envelope instead of guessing.
//
// The `entity` oneof reserves twenty numbers per domain, assigned in the switch
// order of §1.2: canvas 100-119, settings 120-139, filesystem 140-159,
// session 160-179, agent 180-219, git 220-239. A domain still owned by the
// Worker publishes nothing here.
//
// The settings domain is host-wide, so its envelopes carry an empty
// `workspace_id`. A subscription admits them on the domain grant alone: the
// document belongs to every workspace the session follows, and attributing it
// to one of them would hide the change from the others.
message EventEnvelope {
  uint64 sequence = 1;
  uint64 transaction_id = 2;
  string operation_id = 3;
  // Zero-based position and total size of the transaction this event belongs
  // to, so a consumer applies one operation's events as a group.
  uint32 transaction_index = 4;
  uint32 transaction_size = 5;
  string workspace_id = 6;
  EventDomain domain = 7;
  string kind = 8;
  string entity_id = 9;
  EventPriority priority = 10;
  uint64 revision = 50;
  // A deletion carries no entity: the tombstone's id and revision are the whole
  // statement, and an empty decoded object would read like a cleared entity.
  bool deleted = 51;
  oneof entity {
    CanvasWorkspace canvas_workspace = 100;
    Canvas canvas = 101;
    CanvasNode canvas_node = 102;
    CanvasEdge canvas_edge = 103;
    CanvasAnnotation canvas_annotation = 104;
    SettingsDocument settings_document = 120;
    ExecutionHost settings_execution_host = 121;
    WorkspaceRoot filesystem_root = 140;
    // The git domain (§2.8). An operation is the entry a client follows
    // from queued to finished; the repository state is the cache it renders
    // between observations; a clone job is neither, because it exists before
    // the repository it will produce.
    GitOperation git_operation = 220;
    RepositoryState git_repository_state = 221;
    GitCloneJob git_clone_job = 222;
  }
}

// One connection carries one subscription. Re-subscribing on the same
// connection is refused rather than silently replacing the cursor.
message SubscribeEventsRequest {
  // Exclusive: the last sequence the client has already applied.
  uint64 after_sequence = 1;
  // Empty is not "all workspaces": the Host narrows to the session's own
  // grants, and a workspace the session was not granted closes the stream with
  // PERMISSION_DENIED rather than being dropped from the list.
  repeated string workspace_ids = 10;
  // Empty means every domain this Host publishes.
  repeated EventDomain domains = 11;
  // Soft ceiling for one page. The Host clamps it to its own frame budget.
  uint32 page_bytes = 12;
  // Deliver only events at or above this priority. UNSPECIFIED means all.
  EventPriority min_priority = 13;
}

message EventPage {
  repeated EventEnvelope events = 10;
  uint64 next_cursor = 11;
  // Oldest sequence still retained. A cursor below it needs a snapshot.
  uint64 min_cursor = 12;
  uint64 high_watermark = 13;
  // More history is already available. While it is set the client is still
  // catching up and the Host has not started pushing to it.
  bool has_more = 14;
  EventCursorStatus status = 30;
}

// Sent while the stream is idle so a client can tell "nothing changed" from
// "the connection died". `high_watermark` lets a client notice it is behind
// even when its domain filter matched nothing.
message EventHeartbeat {
  uint64 high_watermark = 10;
  int64 sent_at_unix_ms = 40;
}

message EventStreamFrame {
  oneof payload {
    SubscribeEventsRequest subscribe = 100;
    EventPage page = 101;
    EventHeartbeat heartbeat = 102;
    // The client's own flow control: the sequence it has applied through. The
    // Host releases that much of the connection's queue budget.
    StreamAck ack = 103;
    ErrorResponse error = 104;
  }
}
