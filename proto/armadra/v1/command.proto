syntax = "proto3";
package armadra.v1;
option go_package = "armadra.local/host/gen/armadra/v1";

// This executor creates NEW non-interactive processes. It has no operation
// that writes into an existing PTY, TUI, agent conversation or shell session.
enum CommandSessionKind {
  COMMAND_SESSION_KIND_UNSPECIFIED = 0;
  COMMAND_SESSION_KIND_NON_INTERACTIVE_COMMAND = 1;
}
enum CommandPhase {
  COMMAND_PHASE_UNSPECIFIED = 0;
  COMMAND_PHASE_PREPARED = 1;
  COMMAND_PHASE_STARTING = 2;
  COMMAND_PHASE_RUNNING = 3;
  COMMAND_PHASE_SUCCEEDED = 4;
  COMMAND_PHASE_FAILED = 5;
  COMMAND_PHASE_CANCEL_REQUESTED = 6;
  COMMAND_PHASE_CANCELLED = 7;
  COMMAND_PHASE_UNKNOWN = 8;
  // A terminal, affirmative proof of no user-program execution. PREPARED,
  // missing records or lost journals must not be interpreted as this phase.
  COMMAND_PHASE_NOT_DISPATCHED = 9;
}
message CommandCapabilities {
  string containment = 1;
  uint32 max_stdin_bytes = 2;
  uint32 max_output_bytes_per_stream = 3;
  uint32 max_parallel_operations = 4;
  uint64 max_timeout_ms = 5;
}
message BindCommandRootRequest {
  string root_id = 1;
  string workspace_id = 2;
  string path = 3;
}
message CommandRoot {
  string root_id = 1;
  string workspace_id = 2;
  string canonical_path = 3;
}
message CommandLaunchSpec {
  // Resolved to a canonical executable path before the session is saved.
  string executable = 1;
  repeated string args = 2;
  // Root-relative, resolved and frozen before launch. No implicit shell.
  string working_directory = 3;
  // Only "default" is supported. Other accounts explicitly fail UNSUPPORTED.
  string account_id = 4;
  uint64 timeout_ms = 5;
}
message CreateCommandSessionRequest {
  string session_id = 1;
  string root_id = 2;
  string workspace_id = 3;
  CommandSessionKind kind = 4;
  CommandLaunchSpec launch = 5;
}
message GetCommandSessionRequest { string session_id = 1; }
message CommandSession {
  string session_id = 1;
  uint64 generation = 2;
  string root_id = 3;
  string workspace_id = 4;
  string canonical_root = 5;
  string canonical_working_directory = 6;
  CommandSessionKind kind = 7;
  CommandLaunchSpec frozen_launch = 8;
  bytes launch_sha256 = 9;
  int64 created_at_unix_ms = 10;
  string active_operation_id = 11;
}
message RunCommandRequest {
  string operation_id = 1;
  // Caller correlation digest (for example the Automation frozen-run digest).
  // The Worker separately hashes the actual session/spec/stdin request.
  bytes request_sha256 = 2;
  string session_id = 3;
  uint64 expected_generation = 4;
  bytes stdin = 5;
  // Zero is an idempotent submission/replay. A positive value explicitly
  // retries only a matching terminal NOT_DISPATCHED receipt with this sequence,
  // no effects proven and cleanup confirmed. UNKNOWN is never retryable.
  uint64 expected_not_dispatched_sequence = 6;
}
message LookupCommandRequest { string operation_id = 1; }
message CancelCommandRequest {
  string operation_id = 1;
  string session_id = 2;
  uint64 expected_generation = 3;
}
message CommandReceipt {
  string operation_id = 1;
  bytes request_sha256 = 2;
  bytes execution_sha256 = 3;
  string session_id = 4;
  uint64 generation = 5;
  string workspace_id = 6;
  CommandPhase phase = 7;
  uint64 sequence = 8;
  int64 updated_at_unix_ms = 9;
  optional int32 exit_code = 10;
  optional int32 signal = 11;
  bool cleanup_confirmed = 12;
  bool no_effect_proven = 13;
  string reason_code = 14;
  bytes stdout = 15;
  bytes stderr = 16;
  uint64 stdout_total_bytes = 17;
  uint64 stderr_total_bytes = 18;
  bool stdout_truncated = 19;
  bool stderr_truncated = 20;
}
message ShutdownCommandsRequest {}
message ShutdownCommandsResponse {
  bool cleanup_confirmed = 1;
  uint32 unresolved_operations = 2;
}
message CommandRequest {
  oneof action {
    BindCommandRootRequest bind_root = 10;
    CreateCommandSessionRequest create_session = 11;
    GetCommandSessionRequest get_session = 12;
    RunCommandRequest run = 13;
    LookupCommandRequest lookup = 14;
    CancelCommandRequest cancel = 15;
    ShutdownCommandsRequest shutdown = 16;
  }
}
message CommandResponse {
  oneof result {
    CommandRoot root = 10;
    CommandSession session = 11;
    CommandReceipt receipt = 12;
    ShutdownCommandsResponse shutdown = 13;
  }
}
