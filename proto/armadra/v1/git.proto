syntax = "proto3";

package armadra.v1;

option go_package = "armadra.local/host/gen/armadra/v1";

import "armadra/v1/canvas.proto";
import "armadra/v1/common.proto";

// The git domain (Go Host 业务所有权迁移 §2.8, Git 设计 §2, §10).
//
// What moves to the Host here is narrower than any other domain, and the
// narrowness is the design: **Git itself never moves.** Every command still
// runs on the execution host, holding that host's repository locks, reading
// that host's credentials, writing that host's working tree. A Host that
// "owned Git" in the sense of running it would be a second checkout, and two
// processes running `git commit` against one index is the one outcome no
// amount of protocol can make safe.
//
// So the Host owns four things and no others:
//
//  1. **Operation identity.** An `operation_id` exists before anything runs,
//     survives a Host restart, and is what a `push` that was interrupted is
//     reconciled against. The Runtime's queue was in memory: a restart lost
//     the record that a push had been attempted at all, which is exactly the
//     case where "did it reach the remote?" has to be answerable.
//  2. **Ordering.** One worktree's writes are serialized, different worktrees
//     run in parallel, and everything that touches refs or the worktree list
//     of one common git dir is taken in a fixed lock order so two repositories
//     that share a common dir cannot deadlock.
//  3. **Preconditions.** A write states the HEAD, index or ref it was decided
//     against; the Worker re-reads them immediately before running. An
//     external `git commit` between the decision and the execution is a
//     CONFLICT, never an overwrite.
//  4. **A cache of what the repository looked like.** `RepositoryState` is a
//     snapshot with an `observed_at`, never a source of truth. Git is the
//     truth; this is what the UI renders between observations.
//
// Reads are not owned at all. `Read` forwards to the Worker and nothing but
// `RepositoryState` is stored, because a commit graph the Host cached would be
// a second, staler answer to a question the repository can always answer.

// Which checkout an operation is about (Git 设计 §2).
//
// `repository_path` is the identity that matters. `repository_id` is derived
// from the canonical common git dir, so a linked worktree and its main
// checkout share one id — they are one repository — and only the path says
// which working tree is being written.
message RepositoryScope {
  // Empty means this machine; anything else is a `settings.ssh.hosts[].id`.
  string execution_host_id = 1;
  string workspace_id = 2;
  // SHA-256 of the canonical common git dir. Shared by every worktree of one
  // repository, which is why it can never stand in for the path.
  string repository_id = 3;
  // The checkout being written, absolute on the execution host.
  string repository_path = 4;
  // The linked worktree, when the caller is addressing one by name rather
  // than by path. Empty means the main checkout.
  string worktree_id = 5;
}

// The lifecycle of one queued operation. It is one-to-one with the Runtime's
// own `OperationState` so a switch does not renumber anything a client already
// renders.
//
// `UNKNOWN_OUTCOME` is the state this whole domain exists for: the process was
// interrupted after the mutation started, so whether the remote accepted the
// push is not something either side may guess. It is never retried
// automatically and never collapses into FAILED.
enum GitOperationState {
  GIT_OPERATION_STATE_UNSPECIFIED = 0;
  GIT_OPERATION_STATE_QUEUED = 1;
  GIT_OPERATION_STATE_RUNNING = 2;
  GIT_OPERATION_STATE_SUCCEEDED = 3;
  GIT_OPERATION_STATE_FAILED = 4;
  GIT_OPERATION_STATE_CANCELLED = 5;
  GIT_OPERATION_STATE_UNKNOWN_OUTCOME = 6;
  // A merge, rebase, cherry-pick or revert stopped on a conflict and is
  // waiting for a person. It is not a failure and must not be shown as one.
  GIT_OPERATION_STATE_AWAITING_RESOLUTION = 7;
}

// Every write this domain accepts. The list is closed: a value this build does
// not know is `UNSUPPORTED`, never a passthrough, because the Host decides
// serialization and lock order from the kind and cannot order an action it
// cannot classify.
//
// The parameters do not travel as fields. They travel as `GitOperation.action`
// — the Runtime's own camelCase JSON with a digest — under the same rule
// `WorkerServiceRequest` already states: both ends are one Armadra build,
// asserted by `runtime_version`, so the bytes are a version lock rather than a
// cross-version contract. Freezing thirty typed request messages before the
// panel's own vocabulary has settled would buy compatibility nobody can use
// and pay for it in a shape that cannot change.
enum GitActionKind {
  GIT_ACTION_KIND_UNSPECIFIED = 0;
  // A kind this build does not recognise. It is refused, never queued.
  GIT_ACTION_KIND_UNSUPPORTED = 1;

  // Index and worktree writes. These are the per-path routes the panel used
  // to call directly; the gateway now assembles them into one Enqueue.
  GIT_ACTION_KIND_STAGE = 10;
  GIT_ACTION_KIND_UNSTAGE = 11;
  GIT_ACTION_KIND_RESTORE = 12;
  GIT_ACTION_KIND_MARK_RESOLVED = 13;
  GIT_ACTION_KIND_APPLY_HUNK = 14;
  GIT_ACTION_KIND_COMMIT = 15;
  GIT_ACTION_KIND_INIT = 16;

  // History rewrites and integrations.
  GIT_ACTION_KIND_START_CHERRY_PICK = 20;
  GIT_ACTION_KIND_REVERT = 21;
  GIT_ACTION_KIND_CHECKOUT_COMMIT = 22;
  GIT_ACTION_KIND_RESET = 23;
  GIT_ACTION_KIND_START_MERGE = 24;
  GIT_ACTION_KIND_START_REBASE = 25;
  GIT_ACTION_KIND_START_INTERACTIVE_REBASE = 26;
  GIT_ACTION_KIND_CONTINUE_INTEGRATION = 27;
  GIT_ACTION_KIND_ABORT_INTEGRATION = 28;
  GIT_ACTION_KIND_SKIP_INTEGRATION = 29;

  // Stash.
  GIT_ACTION_KIND_CREATE_STASH = 30;
  GIT_ACTION_KIND_APPLY_STASH = 31;
  GIT_ACTION_KIND_POP_STASH = 32;
  GIT_ACTION_KIND_DROP_STASH = 33;

  // Refs. Everything here takes the common git dir's ref lock.
  GIT_ACTION_KIND_CREATE_BRANCH = 40;
  GIT_ACTION_KIND_SWITCH_BRANCH = 41;
  GIT_ACTION_KIND_DELETE_BRANCH = 42;
  GIT_ACTION_KIND_CREATE_TAG = 43;
  GIT_ACTION_KIND_DELETE_TAG = 44;
  // Renaming a branch. The number sits after the tags rather than beside the
  // other branch kinds because the branch block was already full and numbers
  // never move: an operation an SSH host already answers must keep its value.
  GIT_ACTION_KIND_RENAME_BRANCH = 45;

  // Network. Also ref work, and also the only kinds whose outcome can be
  // unknown in a way no local reading resolves.
  GIT_ACTION_KIND_FETCH = 50;
  GIT_ACTION_KIND_PULL = 51;
  GIT_ACTION_KIND_PUSH = 52;
  GIT_ACTION_KIND_SYNC = 53;
  GIT_ACTION_KIND_PUSH_TAG = 54;

  // Remotes.
  GIT_ACTION_KIND_ADD_REMOTE = 60;
  GIT_ACTION_KIND_RENAME_REMOTE = 61;
  GIT_ACTION_KIND_SET_REMOTE_URL = 62;
  GIT_ACTION_KIND_REMOVE_REMOTE = 63;

  // Worktree management: the common git dir's worktree list, not one
  // checkout's files.
  GIT_ACTION_KIND_CREATE_WORKTREE = 70;
  GIT_ACTION_KIND_REMOVE_WORKTREE = 71;
}

// What the caller read before it decided. The Worker re-reads each present
// field immediately before running and refuses on a difference.
//
// An absent field is "I did not look at this", not "any value will do for the
// ones I did look at": every field the caller *did* supply still has to hold.
message GitExpectation {
  string head_oid = 10;
  bytes index_fingerprint = 11;
  string ref_name = 12;
  string ref_oid = 13;
}

// One entry in the Host's queue.
message GitOperation {
  string operation_id = 1;
  RepositoryScope scope = 2;
  // The Runtime's own camelCase JSON for this kind, version-locked.
  bytes action = 10;
  // SHA-256 of `action`. A body that was truncated or rewritten in transit is
  // refused rather than run as a shorter command.
  bytes action_sha256 = 11;
  GitExpectation expected = 12;
  // Paths, refs or remotes this operation touched, as the Worker reported
  // them. Empty while queued.
  repeated string affected = 13;
  // 0-100. It is a display value the Worker pushes upward; it never advances
  // on its own and a stalled operation keeps its last number.
  uint32 progress = 14;
  GitActionKind kind = 30;
  GitOperationState state = 31;
  // A stable, localizable key. Git's own message is not carried: it is
  // untrusted output that would end up rendered as UI text.
  string message_code = 39;
  int64 created_at_unix_ms = 40;
  int64 started_at_unix_ms = 41;
  int64 finished_at_unix_ms = 42;
  uint64 revision = 50;
}

// The Host's cached reading of one checkout (Git 设计 §2).
//
// It is a snapshot with a timestamp, never an authority. `observed_at` comes
// from the Worker that read the repository, so a client can tell "this is what
// it looked like a second ago" from "this is what it is", which is the only
// honest thing to say about a directory an external `git` can change at any
// moment.
message RepositoryState {
  RepositoryScope scope = 1;
  string head_oid = 10;
  // Empty when `detached` is set. The two are reported together because a
  // detached HEAD is a state a person has to see, not an absent branch name.
  string branch = 11;
  bool detached = 12;
  bytes index_fingerprint = 13;
  bytes worktree_fingerprint = 14;
  string upstream = 15;
  uint32 ahead = 16;
  uint32 behind = 17;
  // The state of the operation this checkout is in the middle of, if any:
  // AWAITING_RESOLUTION is a repository in conflict, waiting for a person.
  GitOperationState operation_state = 30;
  int64 observed_at_unix_ms = 40;
  uint64 revision = 50;
}

enum GitCloneState {
  GIT_CLONE_STATE_UNSPECIFIED = 0;
  GIT_CLONE_STATE_RUNNING = 1;
  GIT_CLONE_STATE_SUCCEEDED = 2;
  GIT_CLONE_STATE_FAILED = 3;
  GIT_CLONE_STATE_CANCELLED = 4;
}

// One clone. The URL is not stored: a clone URL can carry a credential, and a
// row that kept one would turn a database read into a credential leak. What is
// stored is the digest — enough to recognise the same clone twice — and a
// redacted form for display, produced by the Worker that has the original.
message GitCloneJob {
  string job_id = 1;
  string workspace_id = 2;
  bytes url_sha256 = 10;
  // Credentials already removed, by the side that held them.
  string display_url = 11;
  string target_path = 12;
  uint32 progress = 13;
  GitCloneState state = 30;
  string message_code = 39;
  int64 created_at_unix_ms = 40;
  int64 updated_at_unix_ms = 41;
  uint64 revision = 50;
}

// armadra.v1.GitService/Enqueue — the only write entry.
//
// There is deliberately one. Thirty per-action routes each with their own
// preconditions is thirty places to forget the queue, and the queue is the
// part that cannot be forgotten: it is what makes two writes to one worktree
// sequential rather than simultaneous.
message EnqueueGitOperationRequest {
  CommandMeta meta = 1;
  string operation_id = 2;
  RepositoryScope scope = 10;
  bytes action = 11;
  bytes action_sha256 = 12;
  GitExpectation expected = 13;
  GitActionKind kind = 30;
}
message EnqueueGitOperationResponse {
  GitOperation operation = 1;
  CanvasOperationReceipt receipt = 2;
}

// armadra.v1.GitService/GetOperation
message GetGitOperationRequest {
  CommandMeta meta = 1;
  string operation_id = 10;
}
message GetGitOperationResponse { GitOperation operation = 1; }

// armadra.v1.GitService/ListOperations — one repository's queue, newest first.
message ListGitOperationsRequest {
  CommandMeta meta = 1;
  RepositoryScope scope = 10;
  string after_operation_id = 11;
  uint32 limit = 12;
  // Only QUEUED and RUNNING. It is what the queue depth check asks for, and
  // what a switch reads to prove there is nothing in flight.
  bool active_only = 13;
}
message ListGitOperationsResponse {
  repeated GitOperation operations = 10;
  string next_operation_id = 11;
  bool has_more = 12;
}

// armadra.v1.GitService/CancelOperation — ask the Worker to stop.
//
// Cancelling is a request, not a result. A cancelled push may still have
// reached the remote, which is why cancelling an operation whose mutation had
// already begun leaves it `UNKNOWN_OUTCOME` rather than `CANCELLED`.
message CancelGitOperationRequest {
  CommandMeta meta = 1;
  string operation_id = 2;
  uint64 expected_revision = 3;
  string target_operation_id = 10;
}
message CancelGitOperationResponse {
  GitOperation operation = 1;
  CanvasOperationReceipt receipt = 2;
}

// armadra.v1.GitService/RepositoryState — the cached snapshot, optionally
// re-observed first. `refresh` is what a panel asks for when a person pressed
// reload; without it the Host answers from cache and says when it was taken.
message GetRepositoryStateRequest {
  CommandMeta meta = 1;
  RepositoryScope scope = 10;
  bool refresh = 11;
}
message GetRepositoryStateResponse { RepositoryState state = 1; }

// armadra.v1.GitService/Clone
message StartGitCloneRequest {
  CommandMeta meta = 1;
  string operation_id = 2;
  // The full URL, which the Host forwards and never stores.
  string url = 10;
  string target_path = 11;
}
message StartGitCloneResponse {
  GitCloneJob job = 1;
  CanvasOperationReceipt receipt = 2;
}

// armadra.v1.GitService/GetClone
message GetGitCloneRequest {
  CommandMeta meta = 1;
  string job_id = 10;
}
message GetGitCloneResponse { GitCloneJob job = 1; }

// armadra.v1.GitService/CancelClone
message CancelGitCloneRequest {
  CommandMeta meta = 1;
  string operation_id = 2;
  uint64 expected_revision = 3;
  string job_id = 10;
}
message CancelGitCloneResponse {
  GitCloneJob job = 1;
  CanvasOperationReceipt receipt = 2;
}

// Every read this domain forwards. Closed, like the action kinds, and for the
// same reason: a method the Host cannot name is one it cannot authorize.
enum GitReadMethod {
  GIT_READ_METHOD_UNSPECIFIED = 0;
  GIT_READ_METHOD_REPOSITORIES = 1;
  GIT_READ_METHOD_STATUS = 2;
  GIT_READ_METHOD_DIFF = 3;
  GIT_READ_METHOD_HUNKS = 4;
  GIT_READ_METHOD_HEAD_COMMIT = 5;
  GIT_READ_METHOD_BRANCHES = 6;
  GIT_READ_METHOD_TAGS = 7;
  GIT_READ_METHOD_REMOTES = 8;
  GIT_READ_METHOD_STASHES = 9;
  GIT_READ_METHOD_STASH_DETAIL = 10;
  GIT_READ_METHOD_HISTORY = 11;
  GIT_READ_METHOD_COMMIT_DETAIL = 12;
  GIT_READ_METHOD_COMMIT_FILE = 13;
  GIT_READ_METHOD_WORKTREES = 14;
  GIT_READ_METHOD_REBASE_TODO = 15;
  GIT_READ_METHOD_CHERRY_PICK_PREVIEW = 16;
  GIT_READ_METHOD_INTEGRATION = 17;
  GIT_READ_METHOD_MESSAGE_PROVIDERS = 18;
  GIT_READ_METHOD_MESSAGE_SOURCE = 19;
  GIT_READ_METHOD_OPERATIONS = 20;
  // Drafting a commit message. It travels on the read channel although it
  // starts a CLI, because it stages nothing, commits nothing and takes no
  // repository lock: putting a suggestion in the write queue would make it
  // wait behind a push. It still needs the execute grant, which the Host
  // checks before forwarding.
  GIT_READ_METHOD_MESSAGE_GENERATE = 21;
  // Clones. They are on this channel and not in the queue because a clone has
  // no repository yet: nothing to lock, no worktree to serialize with and no
  // precondition to state. The Host still records the job, because the
  // execution host forgets a clone when its process ends and the Host does
  // not — which is the whole reason `GitCloneJob` is stored at all.
  GIT_READ_METHOD_CLONE_START = 22;
  GIT_READ_METHOD_CLONE_STATUS = 23;
  GIT_READ_METHOD_CLONE_CANCEL = 24;
  // The reference log of one ref (Git 设计 §3 "Reflog"). It is paged like the
  // history because a reflog on a busy checkout is thousands of entries and a
  // panel renders a screen of them.
  GIT_READ_METHOD_REFLOG = 25;
  // Several checkouts' status in one answer. A workspace with a dozen
  // repositories used to cost a dozen round trips to draw one aggregated
  // Changes list, and each of those was a separate `git status` whose answers
  // were then read as if they had been taken at one moment. One request makes
  // that one observation, and each repository's answer carries its own failure
  // rather than losing the whole batch to one broken checkout.
  GIT_READ_METHOD_STATUS_BATCH = 26;
  // Whether a Frame's worktree binding still names a checkout this workspace
  // may address: inside the registered root, and genuinely a worktree of the
  // repository the binding claims. The answer is a verdict with a reason code,
  // never a boolean — "the path left the root" and "the checkout was removed"
  // are different things for a person to fix, and a binding that is merely
  // stale must not be reported as one that was never allowed.
  GIT_READ_METHOD_WORKTREE_BINDING = 27;
  // The workspace's whole commit log, and its whole branch tree — both
  // workspace-level rather than checkout-level (Git 工具窗口设计 §3.1).
  //
  // They name no repository, which is why they are exempt from the scope check
  // the other reads pass: the Git window draws one graph across every
  // discovered checkout and one tree grouped by them, so "which repository is
  // this about" is part of the answer rather than of the question. The
  // workspace root still comes from the filesystem domain's registration and
  // never from the request.
  GIT_READ_METHOD_LOG = 28;
  GIT_READ_METHOD_REFS = 29;
  // Who a commit from this checkout would be attributed to: `user.name` and
  // `user.email` as Git itself resolves them. The window's "mine" filter used
  // to infer it from the most recent reflog entry, which is the last person who
  // wrote *here* rather than the person sitting here — and on a fresh clone
  // there is no entry at all. Unset is null, never a failure.
  GIT_READ_METHOD_IDENTITY = 30;
}

// One forwarded read. The body is the same version-locked JSON the action
// carries, and the answer keeps the status the Runtime's own route would have
// returned so a not-found stays a not-found instead of becoming a 500.
message GitRead {
  RepositoryScope scope = 1;
  bytes request_json = 10;
  // Where the workspace's files are, resolved by the Host from the filesystem
  // domain's registration. The Worker re-checks that the repository is inside
  // it: a root that arrived in a request would be the caller choosing which
  // directory it is allowed to read.
  string workspace_root = 11;
  GitReadMethod method = 30;
}
message GitReadResult {
  uint32 http_status = 1;
  bytes response_json = 2;
}

// armadra.v1.GitService/Read
message ReadGitRequest {
  CommandMeta meta = 1;
  GitRead read = 10;
}
message ReadGitResponse { GitReadResult result = 1; }

// armadra.v1.GitService/GenerateMessage — the AI commit-message draft
// (Git 设计 §6). It runs on the execution host, reading that host's own CLI
// login, and it never stages or commits anything: the draft comes back and a
// person decides.
message GenerateGitMessageRequest {
  CommandMeta meta = 1;
  RepositoryScope scope = 10;
  bytes request_json = 11;
}
message GenerateGitMessageResponse { GitReadResult result = 1; }

// ---------------------------------------------------------------------------
// The Host -> Worker half (`WorkerRequest.action` 29).
// ---------------------------------------------------------------------------

// Run one queued operation. The Host has already decided the order; the Worker
// decides nothing about scheduling and everything about execution.
message RunGitOperationRequest {
  GitOperation operation = 1;
  string workspace_root = 10;
}

// The Worker's own reading of what happened. It is a reading, not an echo: the
// state, the affected paths and the message code come from the process that
// ran, so a Host comparing them against what it asked for is comparing two
// different sources.
message GitOperationOutcome { GitOperation operation = 1; }

message CancelGitOperationWorkerRequest {
  string operation_id = 1;
  string workspace_root = 10;
  string repository_path = 11;
}

// Read one checkout's current state. This is the only read whose answer the
// Host stores.
message ObserveRepositoryRequest {
  RepositoryScope scope = 1;
  string workspace_root = 10;
}

// What the Worker still holds for this domain. A switch reads it to prove the
// Runtime's in-memory queue is empty before the Host starts owning one: a
// domain moved while a push was running would leave the only record of that
// push in a process that is about to stop being the writer.
message GitDomainSnapshotRequest {}
message GitDomainSnapshot {
  uint32 queued = 10;
  uint32 running = 11;
  uint32 clone_jobs = 12;
  // Bounded list of the ones still in flight, so an operator sees which.
  repeated string active_operation_ids = 13;
}

message GitWorkerRequest {
  oneof action {
    RunGitOperationRequest run = 100;
    CancelGitOperationWorkerRequest cancel = 101;
    ObserveRepositoryRequest observe = 102;
    GitRead read = 103;
    GitDomainSnapshotRequest snapshot = 104;
  }
}

message GitWorkerResponse {
  oneof result {
    GitOperationOutcome operation = 100;
    RepositoryState repository = 101;
    GitReadResult read = 102;
    GitDomainSnapshot snapshot = 103;
  }
}
