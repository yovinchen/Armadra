syntax = "proto3";

package armadra.v1;

option go_package = "armadra.local/host/gen/armadra/v1";

import "armadra/v1/common.proto";

// Workspace and canvas business contract (H01 / C02, host protocol design §3.2
// and §4). Three invariants this file exists to preserve:
//
//  1. **One writer.** `CanvasOwnership` names which process may write the
//     canvas domain and under which epoch. There is no dual-write mode: a
//     Runtime that has handed ownership over refuses canvas writes with the
//     stable code `ownership_moved`, and keeps answering reads.
//  2. **Revision CAS, not last-write-wins.** Every stored object carries a
//     revision; a save states the revision it read. Expected revision 0 means
//     "never created". A deletion leaves a revisioned tombstone, so a resurrect
//     has to name the tombstone's revision.
//  3. **Ordered, resumable events.** Business changes are published from the
//     same transaction that stored them, numbered by one durable per-Host
//     sequence. A cursor below the retained floor is answered with
//     SNAPSHOT_REQUIRED, never with a silently shortened history.
//
// Free-form whiteboard drawing is not expanded into fields: it travels as a
// versioned, digested opaque snapshot. Assets are references with content
// digests; their bytes travel over the separate chunked asset transfer.

enum CanvasEntityKind {
  CANVAS_ENTITY_KIND_UNSPECIFIED = 0;
  CANVAS_ENTITY_KIND_WORKSPACE = 1;
  CANVAS_ENTITY_KIND_CANVAS = 2;
  CANVAS_ENTITY_KIND_NODE = 3;
  CANVAS_ENTITY_KIND_EDGE = 4;
  CANVAS_ENTITY_KIND_ANNOTATION = 5;
}

// Only context links are persisted. Rope and subagent edges are derived by the
// client per frame and never stored, so they have no wire value here.
enum CanvasEdgeKind {
  CANVAS_EDGE_KIND_UNSPECIFIED = 0;
  CANVAS_EDGE_KIND_LINK = 1;
}

enum CanvasCursorStatus {
  CANVAS_CURSOR_STATUS_UNSPECIFIED = 0;
  CANVAS_CURSOR_STATUS_OK = 1;
  // The cursor is older than the retained floor. Apply a snapshot first.
  CANVAS_CURSOR_STATUS_SNAPSHOT_REQUIRED = 2;
  // The cursor is beyond the high watermark: a different Host or a restored
  // database. The client must not silently rewind to the watermark.
  CANVAS_CURSOR_STATUS_CURSOR_AHEAD = 3;
}

message CanvasWorkspacePermissions {
  bool read = 1;
  bool write = 2;
  bool execute = 3;
}

message CanvasWorkspace {
  string workspace_id = 1;
  string name = 2;
  string root_path = 3;
  string color = 4;
  CanvasWorkspacePermissions permissions = 5;
  int64 created_at_unix_ms = 6;
  int64 updated_at_unix_ms = 7;
  int64 last_opened_at_unix_ms = 8;
  // Revision of the stored object; 0 in a request means "never created".
  uint64 revision = 9;
}

message CanvasViewport {
  double x = 1;
  double y = 2;
  double zoom = 3;
}

// The tldraw snapshot is opaque: schema version, engine version, bytes and a
// digest. Nothing in the Host decodes it, and no field of it is projected.
message CanvasWhiteboard {
  uint32 schema_version = 1;
  string engine_version = 2;
  bytes snapshot = 3;
  bytes sha256 = 4;
  uint64 bytes = 5;
}

message Canvas {
  string canvas_id = 1;
  string workspace_id = 2;
  string name = 3;
  int64 sort_order = 4;
  CanvasViewport viewport = 5;
  CanvasWhiteboard whiteboard = 6;
  int64 created_at_unix_ms = 7;
  int64 updated_at_unix_ms = 8;
  uint64 revision = 9;
}

message CanvasPoint {
  double x = 1;
  double y = 2;
}

message CanvasSize {
  double width = 1;
  double height = 2;
}

// A managed asset the canvas refers to. Bytes never travel in this message;
// the digest is what a migration compares, so a reference with no digest is a
// broken reference rather than an empty one.
message CanvasAssetRef {
  string asset_id = 1;
  string workspace_id = 2;
  string relative_path = 3;
  bytes sha256 = 4;
  uint64 bytes = 5;
  string mime_type = 6;
}

message CanvasNode {
  string node_id = 1;
  string canvas_id = 2;
  // Node type identifier, e.g. terminal / sticky / group / editor / files.
  string type = 3;
  string title = 4;
  string color = 5;
  CanvasPoint position = 6;
  // Absent size means the client's default for that node type, which is not
  // the same statement as a zero-sized node.
  optional CanvasSize size = 7;
  optional bool collapsed = 8;
  optional double expanded_height = 9;
  // Frame nesting. Empty means the node sits directly on the canvas.
  string parent_id = 10;
  // Opaque per-type payload, exactly the bytes the client stored.
  bytes data_json = 11;
  repeated CanvasAssetRef assets = 12;
  int64 created_at_unix_ms = 13;
  int64 updated_at_unix_ms = 14;
  uint64 revision = 15;
}

message CanvasEdge {
  string edge_id = 1;
  string canvas_id = 2;
  string source_node_id = 3;
  string target_node_id = 4;
  CanvasEdgeKind kind = 5;
  int64 created_at_unix_ms = 6;
  int64 updated_at_unix_ms = 7;
  uint64 revision = 8;
}

// Node notes and labels kept as their own object so a note survives a node
// type change and can be migrated and compared independently.
message CanvasAnnotation {
  string annotation_id = 1;
  string canvas_id = 2;
  string node_id = 3;
  repeated string labels = 4;
  string note = 5;
  int64 created_at_unix_ms = 6;
  int64 updated_at_unix_ms = 7;
  uint64 revision = 8;
}

message CanvasRevision {
  CanvasEntityKind kind = 1;
  string entity_id = 2;
  uint64 revision = 3;
  bool deleted = 4;
}

// An idempotency receipt. Replaying the same operation id with the same request
// returns the original sequences and revisions with `replayed` set; replaying
// it with a different request is a CONFLICT, never a second write.
message CanvasOperationReceipt {
  string operation_id = 1;
  uint64 transaction_id = 2;
  uint64 first_sequence = 3;
  uint64 last_sequence = 4;
  bool replayed = 5;
  repeated CanvasRevision revisions = 6;
}

message CanvasDocument {
  Canvas canvas = 1;
  repeated CanvasNode nodes = 2;
  repeated CanvasEdge edges = 3;
  repeated CanvasAnnotation annotations = 4;
  // The sequence this document was read at, so a subscription can continue
  // from it without re-reading the whole canvas.
  uint64 event_sequence = 5;
}

message ListCanvasWorkspacesRequest {
  CommandMeta meta = 1;
  string after_id = 2;
  uint32 limit = 3;
}
message ListCanvasWorkspacesResponse {
  repeated CanvasWorkspace workspaces = 1;
  string next_id = 2;
  bool has_more = 3;
}
message PutCanvasWorkspaceRequest {
  CommandMeta meta = 1;
  string operation_id = 2;
  CanvasWorkspace workspace = 3;
  uint64 expected_revision = 4;
}
message PutCanvasWorkspaceResponse {
  CanvasWorkspace workspace = 1;
  CanvasOperationReceipt receipt = 2;
}
message DeleteCanvasWorkspaceRequest {
  CommandMeta meta = 1;
  string operation_id = 2;
  string workspace_id = 3;
  uint64 expected_revision = 4;
}
message DeleteCanvasWorkspaceResponse {
  string workspace_id = 1;
  CanvasOperationReceipt receipt = 2;
}

message ListCanvasesRequest {
  CommandMeta meta = 1;
  string after_id = 2;
  uint32 limit = 3;
}
message ListCanvasesResponse {
  repeated Canvas canvases = 1;
  string next_id = 2;
  bool has_more = 3;
}
message GetCanvasDocumentRequest {
  CommandMeta meta = 1;
  string canvas_id = 2;
}
message GetCanvasDocumentResponse { CanvasDocument document = 1; }

// The whole canvas in one transaction: the canvas row, its nodes, edges and
// annotations. Node projections, bindings and the whiteboard blob are stored
// together or not at all, so they can never overwrite one another.
message SaveCanvasDocumentRequest {
  CommandMeta meta = 1;
  string operation_id = 2;
  Canvas canvas = 3;
  uint64 expected_revision = 4;
  repeated CanvasNode nodes = 5;
  repeated CanvasEdge edges = 6;
  repeated CanvasAnnotation annotations = 7;
}
message SaveCanvasDocumentResponse {
  CanvasDocument document = 1;
  CanvasOperationReceipt receipt = 2;
}
message DeleteCanvasRequest {
  CommandMeta meta = 1;
  string operation_id = 2;
  string canvas_id = 3;
  uint64 expected_revision = 4;
}
message DeleteCanvasResponse {
  string canvas_id = 1;
  CanvasOperationReceipt receipt = 2;
}

// One business change, published from the transaction that stored it.
message CanvasEventEnvelope {
  uint64 sequence = 1;
  uint64 transaction_id = 2;
  string operation_id = 3;
  // Zero-based position and total size, so a consumer can recognize the group
  // of events one transaction produced and apply them together.
  uint32 transaction_index = 4;
  uint32 transaction_size = 5;
  string workspace_id = 6;
  CanvasEntityKind kind = 7;
  string entity_id = 8;
  uint64 revision = 9;
  bool deleted = 10;
  oneof entity {
    CanvasWorkspace workspace = 20;
    Canvas canvas = 21;
    CanvasNode node = 22;
    CanvasEdge edge = 23;
    CanvasAnnotation annotation = 24;
  }
}

message SubscribeCanvasEventsRequest {
  CommandMeta meta = 1;
  // Exclusive: the last sequence the client has already applied.
  uint64 after_sequence = 2;
  uint32 limit = 3;
}
message CanvasEventPage {
  CanvasCursorStatus status = 1;
  repeated CanvasEventEnvelope events = 2;
  uint64 next_cursor = 3;
  // Oldest sequence still retained. A cursor below it needs a snapshot.
  uint64 min_cursor = 4;
  uint64 high_watermark = 5;
  bool has_more = 6;
}

message GetCanvasSnapshotRequest {
  CommandMeta meta = 1;
  string after_id = 2;
  uint32 limit = 3;
}
// A paged snapshot plus the sequence it is consistent with; the client resumes
// its subscription from `sequence` once the last page has been applied.
message CanvasSnapshotResponse {
  uint64 sequence = 1;
  repeated CanvasWorkspace workspaces = 2;
  repeated Canvas canvases = 3;
  repeated CanvasNode nodes = 4;
  repeated CanvasEdge edges = 5;
  repeated CanvasAnnotation annotations = 6;
  string next_id = 7;
  bool has_more = 8;
}

// ---------------------------------------------------------------------------
// Write ownership (host protocol design §4, step 5)
// ---------------------------------------------------------------------------

enum CanvasOwnershipOwner {
  CANVAS_OWNERSHIP_OWNER_UNSPECIFIED = 0;
  CANVAS_OWNERSHIP_OWNER_RUNTIME = 1;
  CANVAS_OWNERSHIP_OWNER_HOST = 2;
}

enum CanvasOwnershipPhase {
  CANVAS_OWNERSHIP_PHASE_UNSPECIFIED = 0;
  // The owner below is authoritative and no transition is in flight.
  CANVAS_OWNERSHIP_PHASE_SETTLED = 1;
  // A maintenance window is open. Both sides refuse writes; this state is
  // never left implicitly, and a failed step restores the previous settled
  // record rather than leaving a half switch behind.
  CANVAS_OWNERSHIP_PHASE_SWITCHING = 2;
  CANVAS_OWNERSHIP_PHASE_ROLLING_BACK = 3;
}

message CanvasOwnership {
  // Only "canvas" in this version. Terminals, files, Git and hooks stay with
  // the Runtime and are not addressed by this record.
  string domain = 1;
  CanvasOwnershipOwner owner = 2;
  // Monotonic. A write carrying an older epoch is refused, not reordered.
  uint64 epoch = 3;
  CanvasOwnershipPhase phase = 4;
  // The verified import this ownership rests on; empty while the Runtime owns.
  string import_id = 5;
  // Stable, localizable key, e.g. "ownership.switch.verified". Never a path.
  string reason_code = 6;
  int64 updated_at_unix_ms = 7;
  uint64 revision = 8;
}

// One comparison between what the Runtime exported and what the Host holds.
// A difference is a failure: `matched` false blocks the switch.
message CanvasConsistencyCheck {
  string check = 1;
  uint64 expected_count = 2;
  uint64 actual_count = 3;
  bool matched = 4;
  // Bounded list of differing identifiers; never full payloads.
  repeated string differences = 5;
}

message CanvasConsistencyReport {
  string import_id = 1;
  string export_id = 2;
  bytes manifest_sha256 = 3;
  repeated CanvasConsistencyCheck checks = 4;
  bool matched = 5;
  uint64 entity_count = 6;
  int64 verified_at_unix_ms = 7;
}

message GetCanvasOwnershipRequest { CommandMeta meta = 1; }
message SwitchCanvasOwnershipRequest {
  CommandMeta meta = 1;
  CanvasOwnershipOwner target_owner = 2;
  // The epoch the caller believes is current. A mismatch is a CONFLICT.
  uint64 expected_epoch = 3;
  string import_id = 4;
}
message CanvasOwnershipResponse {
  CanvasOwnership ownership = 1;
  CanvasConsistencyReport report = 2;
}
