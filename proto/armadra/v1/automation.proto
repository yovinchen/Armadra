syntax = "proto3";
package armadra.v1;
option go_package = "armadra.local/host/gen/armadra/v1";

import "armadra/v1/agent.proto";
import "armadra/v1/command.proto";
import "armadra/v1/common.proto";

enum AutomationPlanState {
  AUTOMATION_PLAN_STATE_UNSPECIFIED = 0;
  AUTOMATION_PLAN_STATE_DRAFT = 1;
  AUTOMATION_PLAN_STATE_ACTIVE = 2;
  AUTOMATION_PLAN_STATE_PAUSED = 3;
  AUTOMATION_PLAN_STATE_EXPIRED = 4;
  AUTOMATION_PLAN_STATE_DELETED = 5;
}
enum AutomationMisfirePolicy {
  AUTOMATION_MISFIRE_POLICY_UNSPECIFIED = 0;
  AUTOMATION_MISFIRE_POLICY_SKIP = 1;
  AUTOMATION_MISFIRE_POLICY_COALESCE_ONE = 2;
}
enum AutomationConcurrencyPolicy {
  AUTOMATION_CONCURRENCY_POLICY_UNSPECIFIED = 0;
  AUTOMATION_CONCURRENCY_POLICY_FORBID = 1;
  AUTOMATION_CONCURRENCY_POLICY_QUEUE_ONE = 2;
}
enum AutomationRunState {
  AUTOMATION_RUN_STATE_UNSPECIFIED = 0;
  AUTOMATION_RUN_STATE_DUE = 1;
  AUTOMATION_RUN_STATE_CLAIMED = 2;
  AUTOMATION_RUN_STATE_WAITING_TARGET = 3;
  // Persisted before crossing the external dispatch boundary. Recovery must
  // Lookup the same operation; the absence of a receipt is not proof of safety.
  AUTOMATION_RUN_STATE_DISPATCHING = 4;
  AUTOMATION_RUN_STATE_DELIVERED = 5;
  AUTOMATION_RUN_STATE_RUNNING = 6;
  AUTOMATION_RUN_STATE_SUCCEEDED = 7;
  AUTOMATION_RUN_STATE_FAILED = 8;
  AUTOMATION_RUN_STATE_CANCELLED = 9;
  AUTOMATION_RUN_STATE_SKIPPED = 10;
  AUTOMATION_RUN_STATE_EXPIRED = 11;
  AUTOMATION_RUN_STATE_UNKNOWN = 12;
}
enum AutomationOutcome {
  AUTOMATION_OUTCOME_UNSPECIFIED = 0;
  AUTOMATION_OUTCOME_UNKNOWN = 1;
  // Authoritative executor proof that the operation produced no side effects.
  // A transport error / missing journal / generic NOT_FOUND is never this value.
  AUTOMATION_OUTCOME_NOT_DISPATCHED = 2;
  AUTOMATION_OUTCOME_DELIVERED = 3;
  AUTOMATION_OUTCOME_RUNNING = 4;
  AUTOMATION_OUTCOME_SUCCEEDED = 5;
  AUTOMATION_OUTCOME_FAILED = 6;
  AUTOMATION_OUTCOME_CANCELLED = 7;
}
message AutomationOnce { int64 at_unix_ms = 1; }
message AutomationInterval { int64 anchor_unix_ms = 1; int64 interval_ms = 2; }
message AutomationCron { string expression = 1; string timezone = 2; }
message AutomationLoopAfterCompletion { int64 delay_ms = 1; }
message AutomationSchedule {
  oneof kind {
    AutomationOnce once = 1;
    AutomationInterval interval = 2;
    AutomationCron cron = 3;
    AutomationLoopAfterCompletion loop_after_completion = 4;
  }
}
// What a plan writes to. The two kinds are deliberately separate executors:
// a command target creates a NEW non-interactive process, an agent target
// writes one framed prompt into a PTY that already exists.
enum AutomationTargetKind {
  // Read as NON_INTERACTIVE_COMMAND, so plans stored before this field exists
  // keep their meaning instead of becoming a different kind of target.
  AUTOMATION_TARGET_KIND_UNSPECIFIED = 0;
  AUTOMATION_TARGET_KIND_NON_INTERACTIVE_COMMAND = 1;
  AUTOMATION_TARGET_KIND_AGENT_SESSION_PROMPT = 2;
}
// What to do when an agent target has no live session at dispatch time.
enum AutomationColdStartPolicy {
  // Read as SKIP. A plan never launches a process it was not told to launch.
  AUTOMATION_COLD_START_POLICY_UNSPECIFIED = 0;
  AUTOMATION_COLD_START_POLICY_SKIP = 1;
  // Start the frozen definition below and record the run as a cold start.
  AUTOMATION_COLD_START_POLICY_LAUNCH_FROZEN = 2;
}
message AutomationTarget {
  string execution_host_id = 1;
  string session_id = 2;
  // For a command target this is the exact generation a dispatch requires.
  // For an agent target it is the generation observed when the plan was
  // frozen: the session is owned by the Runtime and legitimately changes when
  // a person restarts the Agent or a cold start runs, so identity is the node
  // plus the frozen agent definition and the receipt records what was really
  // written to. It is never treated as permission to write to an older run.
  uint64 generation = 3;
  AutomationTargetKind kind = 4;
  // Required for AGENT_SESSION_PROMPT; empty for a command target.
  string node_id = 5;
  AutomationColdStartPolicy cold_start_policy = 6;
  // The frozen Agent definition: the identity an existing session must still
  // match, and the definition a cold start launches. No credentials.
  AgentLaunchSpec agent_launch = 7;
}
message AutomationPlanConfig {
  string workspace_id = 1;
  string title = 2;
  AutomationSchedule schedule = 3;
  AutomationTarget target = 4;
  // Frozen payload reference/hash, never an access token or plaintext key.
  string payload_ref = 5;
  bytes payload_sha256 = 6;
  AutomationMisfirePolicy misfire_policy = 7;
  AutomationConcurrencyPolicy concurrency_policy = 8;
  int64 misfire_grace_ms = 9;
  int64 busy_ttl_ms = 10;
  uint64 max_runs = 11;
  int64 expires_at_unix_ms = 12;
  // Zero disables retries. Retries require NOT_DISPATCHED proof and reuse the
  // same operation ID; UNKNOWN is never automatically resent.
  uint32 safe_retry_limit = 13;
  int64 retry_backoff_ms = 14;
}
message AutomationActivation {
  string plan_id = 1;
  uint64 config_version = 2;
  bytes config_sha256 = 3;
  bytes activation_sha256 = 4;
  string host_id = 5;
  string principal_id = 6;
  string authorization_id = 7;
  int64 authorized_at_unix_ms = 8;
  bool enabled = 9;
}
message AutomationPlan {
  string id = 1;
  uint64 config_version = 2;
  AutomationPlanConfig config = 3;
  AutomationPlanState state = 4;
  bytes activation_sha256 = 5;
  int64 next_due_unix_ms = 6;
  // This durable high-water mark never moves backwards with the wall clock.
  int64 observed_through_unix_ms = 7;
  uint64 run_count = 8;
  string active_run_id = 9;
  string pending_run_id = 10;
  int64 created_at_unix_ms = 11;
  int64 updated_at_unix_ms = 12;
  // Set once the target has refused consecutively for a reason a retry cannot
  // fix (an unrebuildable command session / TARGET_UNSUPPORTED). The plan is
  // still reported with its real state; this never silently pauses or edits it,
  // and a single transient refusal never raises it.
  bool needs_attention = 13;
  // Stable machine code for the condition above, never raw executor output.
  string attention_reason_code = 14;
  // Consecutive unrepairable refusals observed. Reset by any other outcome and
  // by editing the plan, so an old streak cannot flag a repaired plan.
  uint32 attention_streak = 15;
}
message AutomationPlanRef { string plan_id = 1; string workspace_id = 2; }
message AutomationRunRef { string run_id = 1; string plan_id = 2; string workspace_id = 3; }
// The serialized delivery door for one target. Two plans aimed at the same
// terminal share it, so their input can never interleave.
message AutomationTargetGate {
  string execution_host_id = 1;
  // The command session this gate belongs to; empty for an agent target.
  string session_id = 2;
  AutomationRunRef active = 3;
  // The canvas node an agent target belongs to; empty for a command target.
  // An agent gate is keyed by node rather than session because a restart or an
  // authorized cold start legitimately replaces the session underneath it, and
  // a gate that moved with the session would stop serializing anything.
  string node_id = 4;
}
message AutomationRun {
  string id = 1;
  string plan_id = 2;
  string workspace_id = 3;
  uint64 config_version = 4;
  string scheduled_slot = 5;
  int64 scheduled_at_unix_ms = 6;
  bool misfire = 7;
  uint64 missed_slots = 8;
  bool missed_slots_truncated = 9;
  AutomationPlanConfig frozen_config = 10;
  AutomationActivation activation = 11;
  string operation_id = 12;
  bytes request_sha256 = 13;
  AutomationRunState state = 14;
  string claim_owner = 15;
  int64 lease_until_unix_ms = 16;
  uint32 dispatch_attempts = 17;
  int64 next_attempt_unix_ms = 18;
  int64 waiting_expires_at_unix_ms = 19;
  uint64 receipt_sequence = 20;
  bytes receipt_sha256 = 21;
  int64 created_at_unix_ms = 22;
  int64 updated_at_unix_ms = 23;
  int64 completed_at_unix_ms = 24;
  string reason_code = 25;
  // Monotonic proof: a later UNKNOWN outcome cannot erase confirmed delivery
  // or make a contradictory NOT_DISPATCHED receipt eligible for a retry.
  bool delivery_observed = 26;
}
message AutomationReceipt {
  string operation_id = 1;
  bytes request_sha256 = 2;
  AutomationOutcome outcome = 3;
  uint64 sequence = 4;
  int64 observed_at_unix_ms = 5;
  string reason_code = 6;
}

// A Host-owned frozen command session definition. The Host rebuilds it on the
// Worker after a restart and records the generation the Worker reported.
enum AutomationCommandSessionState {
  AUTOMATION_COMMAND_SESSION_STATE_UNSPECIFIED = 0;
  AUTOMATION_COMMAND_SESSION_STATE_READY = 1;
  // The stored definition could not be rebuilt or kept its recorded generation.
  // Plans targeting it are refused; they are never silently left waiting.
  AUTOMATION_COMMAND_SESSION_STATE_UNREBUILDABLE = 2;
}
message AutomationCommandSession {
  string session_id = 1;
  string workspace_id = 2;
  string execution_host_id = 3;
  string root_path = 4;
  CommandLaunchSpec launch = 5;
  uint64 generation = 6;
  bytes launch_sha256 = 7;
  AutomationCommandSessionState state = 8;
  string reason_code = 9;
  uint64 revision = 10;
  int64 created_at_unix_ms = 11;
  int64 updated_at_unix_ms = 12;
}

// Transport shapes for the authenticated Host surface. The verified session
// supplies principal, device and grants; client fields never carry identity.
// Every request scope is checked against automation:read / automation:manage
// narrowed to its workspace and execution host.
message DefineCommandSessionRequest {
  CommandMeta meta = 1;
  string session_id = 2;
  // Absolute directory on the execution host; the Worker canonicalizes it.
  string root_path = 3;
  CommandLaunchSpec launch = 4;
}
message ListCommandSessionsRequest {
  CommandMeta meta = 1;
  string after_id = 2;
  uint32 limit = 3;
}
message ListCommandSessionsResponse {
  repeated AutomationCommandSession sessions = 1;
  string next_id = 2;
  bool has_more = 3;
}
message DefineAutomationRequest {
  CommandMeta meta = 1;
  string plan_id = 2;
  AutomationPlanConfig config = 3;
  // Immutable command stdin stored privately by the Host. The Host derives
  // payload_ref/payload_sha256; values sent inside config are replaced.
  bytes payload = 4;
  // Zero creates; any other value must equal the current plan revision.
  uint64 expected_revision = 5;
}
message ActivateAutomationRequest {
  CommandMeta meta = 1;
  string plan_id = 2;
  uint64 config_version = 3;
  bytes config_sha256 = 4;
  uint64 expected_revision = 5;
}
message PauseAutomationRequest {
  CommandMeta meta = 1;
  string plan_id = 2;
  uint64 expected_revision = 3;
}
// RunNow materializes one extra manual slot. It never edits the schedule and
// never bypasses the target gate, activation check or concurrency policy.
message RunAutomationNowRequest {
  CommandMeta meta = 1;
  string plan_id = 2;
  uint64 expected_revision = 3;
}
message ListAutomationPlansRequest {
  CommandMeta meta = 1;
  string after_id = 2;
  uint32 limit = 3;
}
message ListAutomationPlansResponse {
  repeated AutomationPlanSnapshot plans = 1;
  string next_id = 2;
  bool has_more = 3;
}
message ListAutomationRunsRequest {
  CommandMeta meta = 1;
  string plan_id = 2;
  string after_id = 3;
  uint32 limit = 4;
}
message ListAutomationRunsResponse {
  repeated AutomationRunSnapshot runs = 1;
  string next_id = 2;
  bool has_more = 3;
}
message AutomationPlanSnapshot {
  AutomationPlan plan = 1;
  uint64 revision = 2;
  // Digest of the normalized stored configuration, required to activate it.
  bytes config_sha256 = 3;
}
message AutomationRunSnapshot { AutomationRun run = 1; uint64 revision = 2; }
