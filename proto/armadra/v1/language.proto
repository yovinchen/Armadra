syntax = "proto3";

package armadra.v1;

option go_package = "armadra.local/host/gen/armadra/v1";

// Editor language services — LSP on the execution host
// ([language service design](../../../docs/design/language-service.md) §2.8).
//
// Three invariants this schema exists to keep:
//
//  1. **"We could not find out" is its own answer.** A server that is missing,
//     that failed its `--version` probe, or that the workspace has no execute
//     grant for is UNSUPPORTED with a stable `reason` key — never AVAILABLE,
//     and never a silent absence the editor could read as "still loading".
//  2. **The control machine never sees an absolute path.** `payload_json`
//     carries a complete JSON-RPC message whose uris were already rewritten
//     for the direction it travels: `armadra:///<rel>` towards the browser,
//     `file://<root>/<rel>` towards the server.
//  3. **A pid alone does not identify a process.** Like `resources.proto`, a
//     descriptor carries `start_time_unix_ms` beside its pid, and both are
//     `optional` because a server that is not running has neither.
//
// Nothing here carries a credential. The execution host strips `ARMADRA_*`
// from the server's environment before it starts, so a language server can
// never be handed the Runtime's hook token.

// Where one server on one execution host is in its life (design §1.3).
enum LanguageServerState {
  LANGUAGE_SERVER_STATE_UNSPECIFIED = 0;
  // Probed successfully, not started. Discovery never starts anything.
  LANGUAGE_SERVER_STATE_AVAILABLE = 1;
  // `reason` says what is missing; the editor offers no completion source.
  LANGUAGE_SERVER_STATE_UNSUPPORTED = 2;
  LANGUAGE_SERVER_STATE_STARTING = 3;
  LANGUAGE_SERVER_STATE_RUNNING = 4;
  // Stopped after `idleStopSeconds` with no open document. Sessions survive;
  // the next didOpen restarts the process and replays the shadow documents.
  LANGUAGE_SERVER_STATE_IDLE_STOPPED = 5;
  LANGUAGE_SERVER_STATE_CRASHED = 6;
  // A person stopped it, or a resource ceiling did. Never auto-restarted.
  LANGUAGE_SERVER_STATE_STOPPED = 7;
  // The remote language link went away; the numbers and diagnostics this
  // runtime holds are stale, so it reports neither.
  LANGUAGE_SERVER_STATE_DISCONNECTED = 8;
}

// What a running server actually answers, taken from its own
// `InitializeResult.capabilities`. A feature that is absent is absent: the
// editor registers no affordance for it rather than showing an empty one.
enum LanguageFeature {
  LANGUAGE_FEATURE_UNSPECIFIED = 0;
  LANGUAGE_FEATURE_COMPLETION = 1;
  LANGUAGE_FEATURE_DIAGNOSTICS = 2;
  LANGUAGE_FEATURE_HOVER = 3;
  LANGUAGE_FEATURE_DEFINITION = 4;
  LANGUAGE_FEATURE_REFERENCES = 5;
  LANGUAGE_FEATURE_RENAME = 6;
  LANGUAGE_FEATURE_FORMATTING = 7;
  LANGUAGE_FEATURE_DOCUMENT_SYMBOL = 8;
  LANGUAGE_FEATURE_WORKSPACE_SYMBOL = 9;
  LANGUAGE_FEATURE_CODE_ACTION = 10;
  LANGUAGE_FEATURE_SIGNATURE_HELP = 11;
}

// Which of the three JSON-RPC shapes `payload_json` holds. Routing and logging
// read this and `method`; neither ever parses the payload.
enum LanguageMessageKind {
  LANGUAGE_MESSAGE_KIND_UNSPECIFIED = 0;
  LANGUAGE_MESSAGE_KIND_REQUEST = 1;
  LANGUAGE_MESSAGE_KIND_RESPONSE = 2;
  LANGUAGE_MESSAGE_KIND_NOTIFICATION = 3;
}

// Capability discovery, over the serial connection.
message LanguageCapabilitiesRequest {
  string root_id = 1;
  // Ignore the 24 h probe cache and run `--version` again.
  bool refresh = 2;
}

// One candidate server for one language on one execution host.
message LanguageServerDescriptor {
  string server_id = 1;
  string language_id = 2;
  repeated string file_extensions = 3;
  // The absolute path the probe resolved and froze. Empty when nothing was
  // found — the launcher never re-resolves a bare name against a child's PATH.
  string executable = 4;
  string version = 5;
  LanguageServerState state = 6;
  // A stable key the interface localises: `server_not_found`,
  // `server_probe_failed`, `execution_not_granted`, `disabled`,
  // `language_unknown`, `too_many_servers`, `containment_unavailable`,
  // `resource_exhausted`.
  string reason = 7;
  repeated LanguageFeature features = 8;
  uint32 restart_count = 9;
  // Absent unless the process is running: pid + start time is the identity,
  // and a stopped server has neither rather than a zero.
  optional int64 pid = 10;
  optional int64 start_time_unix_ms = 11;
  uint32 open_documents = 12;
  int64 probed_at_unix_ms = 13;
}

message LanguageCapabilities {
  string execution_host_id = 1;
  repeated LanguageServerDescriptor servers = 2;
  // Ceilings the client must respect before it opens anything: 1 MiB per
  // document, 32 sessions per execution host, 960 KiB per message.
  uint32 max_document_bytes = 3;
  uint32 max_sessions = 4;
  uint32 max_message_bytes = 5;
}

// Opening one browser connection's view of a server, over the serial
// connection. The controller resolves the grants; the execution host re-checks
// them, so a missing grant fails where the process would have started.
message OpenLanguageSessionRequest {
  string root_id = 1;
  string workspace_id = 2;
  string session_id = 3;
  string language_id = 4;
  string client_id = 5;
  bool allow_write = 6;
  bool allow_execute = 7;
  // The client's own `ClientCapabilities`, intersected with the server's
  // before the execution host answers `initialize` on its behalf.
  bytes client_capabilities_json = 8;
}

message LanguageSession {
  string session_id = 1;
  string server_id = 2;
  // Bumped on every server (re)start. A frame from an older generation is
  // dropped rather than delivered to a session that has since been replayed.
  uint64 generation = 3;
  LanguageServerState state = 4;
  string reason = 5;
  bytes server_capabilities_json = 6;
}

message CloseLanguageSessionRequest {
  string session_id = 1;
  string reason = 2;
}

// One JSON-RPC message travelling over the language link. `payload_json` is
// the complete message; nothing in the transport parses it, and no layer ever
// logs it — it holds file text, completion bodies and paths.
message LanguageMessage {
  string session_id = 1;
  // Monotonic per direction, for the ack window.
  uint64 sequence = 2;
  LanguageMessageKind kind = 3;
  // A response repeats the originating request's method, so routing and logs
  // never have to look inside the payload.
  string method = 4;
  // The JSON-RPC id in string form; empty for a notification.
  string request_id = 5;
  bytes payload_json = 6;
}

message LanguageSessionStatus {
  string session_id = 1;
  uint64 generation = 2;
  LanguageServerState state = 3;
  string reason = 4;
  uint32 restart_count = 5;
  // `$/progress` turned into something the status line can show. Absent means
  // no progress is running, which is not the same as 0 %.
  optional uint32 progress_percent = 6;
  string progress_title = 7;
}

message LanguageAck {
  string session_id = 1;
  uint64 received_through = 2;
  uint32 available_credit_bytes = 3;
}

// The full-duplex envelope. In-process for a local workspace, and the second
// ssh connection's payload for a remote one.
message LanguageFrame {
  // Minted when the link is established; frames stamped with an older epoch
  // belong to a connection that has already gone away and are discarded.
  string link_epoch = 1;
  oneof payload {
    LanguageMessage message = 10;
    LanguageSessionStatus status = 11;
    LanguageAck ack = 12;
  }
}

// What a person pressed in the settings page or the resource panel. Stopping
// and restarting are separate actions rather than one boolean because they end
// differently: a stopped server stays stopped until somebody restarts it,
// while a restart clears the crash budget and hands back a running process.
enum LanguageControlAction {
  LANGUAGE_CONTROL_ACTION_UNSPECIFIED = 0;
  LANGUAGE_CONTROL_ACTION_RESTART = 1;
  LANGUAGE_CONTROL_ACTION_STOP = 2;
}

// Restarting or stopping one server on the execution host that runs it.
//
// It travels on the language link and not the serial connection for the same
// reason session opening does: the servers live in the process that holds the
// link, and the serial connection could only stop ones it started itself.
message LanguageControlRequest {
  string root_id = 1;
  string workspace_id = 2;
  string server_id = 3;
  LanguageControlAction action = 4;
  // Re-checked on the execution host: restarting a server starts a process,
  // and the machine that would start it is the machine that must refuse.
  bool allow_execute = 5;
}

// The server as it is *after* the action, so the settings page shows the
// outcome rather than re-asking for it.
message LanguageControlResult {
  LanguageServerDescriptor server = 1;
}

// Applying a `WorkspaceEdit`, over the serial connection. Every file carries
// the version the caller believes is on disk, so a rename can never overwrite
// an edit that landed while the preview was open.
message LanguageApplyEditRequest {
  string root_id = 1;
  string session_id = 2;
  // The edit as the browser previewed it, with `armadra:///<rel>` uris.
  bytes workspace_edit_json = 3;
  // Relative path → the SHA-256 the caller read. A path that is absent from
  // this map must not already exist.
  map<string, string> expected_sha256 = 4;
  bool allow_write = 5;
}

message LanguageAppliedFile {
  string path = 1;
  string sha256 = 2;
  uint64 size = 3;
}

message LanguageFailedFile {
  string path = 1;
  string code = 2;
  string message = 3;
}

// Partial application is a real outcome and is reported as one: writing stops
// at the first failure, and both lists come back so the client can say which
// files changed.
message LanguageApplyEditResult {
  repeated LanguageAppliedFile applied = 1;
  repeated LanguageFailedFile failed = 2;
}
