syntax = "proto3";
package armadra.v1;
option go_package = "armadra.local/host/gen/armadra/v1";

message AuthorizationGrant {
  string permission = 1;
  // Empty scope IDs explicitly grant the corresponding Host-wide permission.
  string workspace_id = 2;
  string execution_host_id = 3;
}

// Issued exclusively over the same-user OS control channel. A CORS origin or
// an advertised host ID alone never authorizes bootstrap.
message BootstrapTicketRequest {
  string expected_host_id = 1;
  string expected_instance_id = 2;
  string origin = 3;
  string device_name = 4;
  repeated AuthorizationGrant scopes = 5;
}
message BootstrapTicketResponse {
  string host_id = 1;
  string host_instance_id = 2;
  string ticket = 3;
  string origin = 4;
  int64 expires_at_unix_ms = 5;
}
// Issued exclusively over the same-user OS control channel, exactly like a
// bootstrap ticket and for the same reason: opening a maintenance window is an
// action taken at the machine, never one a remote device may request. One
// token covers one domain, is single use, and expires two minutes after it was
// issued.
message MaintenanceTicketRequest {
  string expected_host_id = 1;
  string expected_instance_id = 2;
  // Lowercase domain name ("canvas", "settings", ...). The enumeration lives
  // in ownership.proto; this file stays free of that dependency so the control
  // channel keeps its own, smaller contract.
  string domain = 3;
}
message MaintenanceTicketResponse {
  string host_id = 1;
  string host_instance_id = 2;
  string token = 3;
  string domain = 4;
  int64 expires_at_unix_ms = 5;
}
message DeviceIdentity {
  string device_id = 1;
  string principal_id = 2;
  string display_name = 3;
  // owner is the only issued role initially; operator/viewer are reserved.
  string role = 4;
  reserved 5;
  int64 created_at_unix_ms = 6;
  int64 revoked_at_unix_ms = 7;
  uint64 revision = 8;
}
message PairDeviceRequest {
  string expected_host_id = 1;
  string expected_instance_id = 2;
  string ticket = 3;
}
// Access/refresh secrets travel only in protected HttpOnly cookies on the
// browser transport, never in this response or a URL. CSRF is session-bound.
message AuthenticatedSession {
  string host_id = 1;
  DeviceIdentity device = 2;
  string csrf_token = 3;
  int64 expires_at_unix_ms = 4;
  repeated AuthorizationGrant scopes = 5;
}
message CurrentSessionRequest {}
message RefreshSessionRequest {}
message RenewCsrfRequest {}
message RenewCsrfResponse { string csrf_token = 1; }
message LogoutSessionRequest {}
message SessionClosedResponse { bool closed = 1; }
message ListDevicesRequest { string after_id = 1; uint32 limit = 2; }
message ListDevicesResponse { repeated DeviceIdentity devices = 1; string next_id = 2; bool has_more = 3; }
message RevokeDeviceRequest {
  string device_id = 1;
  uint64 expected_revision = 2;
}
message RevokeDeviceResponse { string device_id = 1; bool revoked = 2; }
