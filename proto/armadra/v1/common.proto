syntax = "proto3";

package armadra.v1;

option go_package = "armadra.local/host/gen/armadra/v1";

import "armadra/v1/identity.proto";

// The Hello endpoint is the only implemented capability in the M0 contract.
message ProtocolVersion {
  uint32 major = 1;
  uint32 minor = 2;
}

message HelloRequest {
  string client_id = 1;
  ProtocolVersion protocol = 2;
}

// A reserved surface the Host names explicitly instead of staying silent.
// `capabilities` lists what works; this lists what a client must not draw.
enum CapabilityState {
  CAPABILITY_STATE_UNSPECIFIED = 0;
  CAPABILITY_STATE_UNSUPPORTED = 1;
}

message CapabilityStatus {
  // Stable identifier, e.g. "presence" or "accountBinding".
  string name = 1;
  CapabilityState state = 2;
  // Stable, localizable reason key. Never a secret or an address.
  string reason = 3;
}

message HelloResponse {
  ProtocolVersion protocol = 1;
  string host_instance_id = 2;
  repeated string capabilities = 3;
  uint32 max_frame_bytes = 4;
  // Stable for the local Host data directory; never an authentication token.
  string host_id = 5;
  // Explicitly unsupported surfaces. An absent entry is not a promise either.
  repeated CapabilityStatus capability_status = 6;
}

message ErrorResponse {
  string code = 1;
  string message = 2;
}

// Reserved execution contracts; their presence does not enable their operations.
message Scope {
  string host_id = 1;
  string workspace_id = 2;
  string execution_host_id = 3;
}

message CommandMeta {
  string request_id = 1;
  Scope scope = 2;
  string idempotency_key = 3;
  optional uint64 expected_revision = 4;
  int64 deadline_unix_ms = 5;
}

message SessionAddress {
  string session_id = 1;
  uint64 generation = 2;
}

message TerminalInput {
  SessionAddress session = 1;
  string input_id = 2;
  bytes data = 3;
  string writer_lease_id = 4;
}

message StreamAck {
  uint64 received_through = 1;
  uint32 available_credit_bytes = 2;
}

message StreamFrame {
  string stream_id = 1;
  uint64 sequence = 2;
  string epoch = 3;
  oneof payload {
    TerminalInput terminal_input = 10;
    bytes terminal_output = 11;
    StreamAck ack = 12;
  }
}

// Local OS-protected control channel only. Never exposed by HTTP/CORS.
message HostStatus {
  string host_id = 1;
  string host_instance_id = 2;
  string http_endpoint = 3;
  int64 started_at_unix_ms = 4;
  // Diagnostic/launch ownership only; never use this value to signal a process.
  uint32 process_id = 5;
}
message HostStatusRequest {}
message HostStopRequest { string expected_instance_id = 1; }
message HostStopResponse { bool accepted = 1; }
message HostControlRequest {
  string request_id = 1;
  oneof action {
    HostStatusRequest status = 10;
    HostStopRequest stop = 11;
    BootstrapTicketRequest bootstrap = 12;
  }
}
message HostControlResponse {
  string request_id = 1;
  oneof result {
    HostStatus status = 10;
    HostStopResponse stopped = 11;
    ErrorResponse error = 12;
    BootstrapTicketResponse bootstrap = 13;
  }
}

// Binary CLI result used by native launchers. Distinct from a stop request ACK:
// stopped means the CLI has observed that ownership/drain has completed.
message HostStoppedState {}
message HostManagementResult {
  oneof state {
    HostStatus running = 1;
    HostStoppedState stopped = 2;
  }
}

// Transitional desktop -> owned Rust Runtime child control. Only accepted on
// explicitly enabled inherited stdin, never HTTP. A 4-byte big-endian length
// prefixes a message (maximum 4096 bytes). EOF alone must not stop the Runtime.
message DesktopShutdownRequest {}
message DesktopRuntimeControl {
  oneof action {
    DesktopShutdownRequest shutdown = 1;
  }
}
