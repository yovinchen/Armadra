syntax = "proto3";
package armadra.v1;
option go_package = "armadra.local/host/gen/armadra/v1";
import "armadra/v1/agent.proto";
import "armadra/v1/common.proto";
import "armadra/v1/command.proto";
import "armadra/v1/canvas.proto";
import "armadra/v1/filesystem.proto";
import "armadra/v1/git.proto";
import "armadra/v1/session.proto";
import "armadra/v1/worker_channel.proto";
import "armadra/v1/language.proto";
import "armadra/v1/migration.proto";
import "armadra/v1/settings.proto";

// The initial Worker transport is a parent-owned anonymous stdin/stdout pipe.
// These messages are never accepted on an unauthenticated HTTP endpoint.
// Frames have a four-byte big-endian length and a one-MiB ceiling.
message WorkerHelloRequest { ProtocolVersion protocol = 1; }
message WorkerHelloResponse {
  ProtocolVersion protocol = 1;
  string host_id = 2;
  string instance_id = 3;
  string platform = 4;
  string architecture = 5;
  repeated string capabilities = 6;
  uint32 max_frame_bytes = 7;
  uint32 max_file_chunk_bytes = 8;
  uint32 max_text_file_bytes = 9;
  // The Worker binary's own release version. Two builds whose
  // `service_contract_version` agree may differ here: the value became a
  // badge on the node rather than a gate (remote completion design §3.5). An
  // empty value means the Worker predates remote execution.
  string runtime_version = 10;
  // The version of the version-locked service payloads below. A controller
  // proxies WorkerServiceRequest only to a Worker that reports the same
  // number, because the bytes are one build's serde derives and nothing
  // negotiates them. Zero means the Worker predates the contract version and
  // is therefore only usable under the older exact-`runtime_version` rule.
  uint32 service_contract_version = 11;
  // Absent in the backward-compatible read-only mode.
  CommandCapabilities commands = 20;
  // The resident bidirectional channel (business migration §2.9). Absent when
  // this Worker has no durable outbox, which is the only honest way to say
  // "I will never report anything upward"; `capabilities` also carries
  // `worker.upcall.v1` so a controller can gate on one list.
  WorkerChannelCapability channel = 21;
}
message RegisterRootRequest { string root_id = 1; string path = 2; }
message RegisteredRoot { string root_id = 1; string canonical_path = 2; }
message WorkerListDirectoryRequest { string root_id = 1; string path = 2; }
message WorkerFileEntry {
  string name = 1;
  string path = 2;
  string kind = 3;
  uint64 size = 4;
  bool readonly = 5;
}
message WorkerDirectory {
  string root_id = 1;
  string path = 2;
  repeated WorkerFileEntry entries = 3;
  bool truncated = 4;
}
message WorkerReadFileRequest {
  string root_id = 1;
  string path = 2;
  uint64 offset = 3;
  uint32 max_bytes = 4;
  // Required after the first chunk to prevent mixing different file versions.
  optional bytes expected_sha256 = 5;
  // Read the bytes as they are instead of as editor text. The default is the
  // text reader, which refuses binary and caps at the preview limit; a
  // download or a whiteboard asset needs neither of those, and inventing a
  // second message for the same chunked read would only duplicate the
  // version-mixing check. Additive: an older Worker ignores it and answers
  // exactly as it did before.
  bool raw = 6;
}
message WorkerFileChunk {
  string root_id = 1;
  string path = 2;
  string mime_type = 3;
  bytes sha256 = 4;
  uint64 total_bytes = 5;
  uint64 offset = 6;
  bytes data = 7;
  bool eof = 8;
}
// Write-ownership handoff (host protocol design §4, step 5). The controlling
// Host tells the Runtime which epoch now owns one business domain; the Runtime
// persists it and refuses that domain's writes from then on. `expected_epoch`
// is the epoch the Host believes is stored, so a repeated request is
// idempotent and a stale one is refused rather than applied out of order.
//
// `domain` stays a string because these field numbers are already released: it
// carries the lowercase name of one `armadra.v1.WriteOwnershipDomain` value.
// A Runtime that does not recognise the name refuses the handoff rather than
// creating a domain it knows nothing about.
message SetWriteOwnershipRequest {
  string domain = 1;
  CanvasOwnershipOwner owner = 2;
  uint64 epoch = 3;
  uint64 expected_epoch = 4;
  string reason_code = 5;
}
message GetWriteOwnershipRequest { string domain = 1; }
message WorkerWriteOwnership {
  string domain = 1;
  CanvasOwnershipOwner owner = 2;
  uint64 epoch = 3;
  int64 updated_at_unix_ms = 4;
  string reason_code = 5;
}

// Editor saves on a remote execution host. The content version is mandatory
// for an overwrite: an absent expected_sha256 means "create only", so a save
// can never silently replace a file the caller has not read.
message WorkerWriteFileRequest {
  string root_id = 1;
  string path = 2;
  string content = 3;
  // Lowercase hexadecimal SHA-256 of the bytes the caller last read. Absent
  // means the file must not already exist.
  optional string expected_sha256 = 4;
  // Re-emit the UTF-8 byte order mark the read stripped.
  bool bom = 5;
}
message WorkerFileWritten {
  string root_id = 1;
  string path = 2;
  // The content version to use for the next save.
  string sha256 = 3;
  uint64 size = 4;
}

// Operations the controller proxies to the execution host unchanged. The list
// is closed: an unrecognized value is UNSUPPORTED, never a passthrough.
enum WorkerServiceOperation {
  WORKER_SERVICE_OPERATION_UNSPECIFIED = 0;
  WORKER_SERVICE_OPERATION_FILE_VERSION = 1;
  WORKER_SERVICE_OPERATION_SEARCH_CONTENT = 2;
  WORKER_SERVICE_OPERATION_SEARCH_INDEX = 3;
  WORKER_SERVICE_OPERATION_WATCH_POLL = 4;
  // The editor's own read: encoding, BOM, line ending and read-only flag as
  // well as the text. WorkerReadFileRequest stays the chunked byte reader.
  WORKER_SERVICE_OPERATION_FILE_READ = 5;
  WORKER_SERVICE_OPERATION_GIT_STATUS = 10;
  WORKER_SERVICE_OPERATION_GIT_HEAD_COMMIT = 11;
  WORKER_SERVICE_OPERATION_GIT_DIFF = 12;
  WORKER_SERVICE_OPERATION_GIT_STAGE = 13;
  WORKER_SERVICE_OPERATION_GIT_UNSTAGE = 14;
  WORKER_SERVICE_OPERATION_GIT_REVERT = 15;
  WORKER_SERVICE_OPERATION_GIT_RESOLVE = 16;
  WORKER_SERVICE_OPERATION_GIT_COMMIT = 17;
  WORKER_SERVICE_OPERATION_GIT_INIT = 18;
  // The repository panel (remote completion design §3.1). The per-worktree
  // mutation queue lives next to the repository it serializes, so it runs on
  // the execution host and the controller only forwards.
  WORKER_SERVICE_OPERATION_GIT_REPOSITORIES = 19;
  WORKER_SERVICE_OPERATION_GIT_BRANCHES = 20;
  WORKER_SERVICE_OPERATION_GIT_HISTORY = 21;
  WORKER_SERVICE_OPERATION_GIT_COMMIT_DETAIL = 22;
  WORKER_SERVICE_OPERATION_GIT_COMMIT_FILE_DIFF = 23;
  WORKER_SERVICE_OPERATION_GIT_WORKTREES = 24;
  WORKER_SERVICE_OPERATION_GIT_REBASE_TODO = 25;
  WORKER_SERVICE_OPERATION_GIT_TAGS = 26;
  WORKER_SERVICE_OPERATION_GIT_REMOTES = 27;
  WORKER_SERVICE_OPERATION_GIT_STASHES = 28;
  WORKER_SERVICE_OPERATION_GIT_STASH_DETAIL = 29;
  WORKER_SERVICE_OPERATION_GIT_INTEGRATION = 30;
  WORKER_SERVICE_OPERATION_GIT_CHERRY_PICK_PREVIEW = 31;
  WORKER_SERVICE_OPERATION_GIT_HUNKS = 32;
  WORKER_SERVICE_OPERATION_GIT_MESSAGE_SOURCE = 33;
  WORKER_SERVICE_OPERATION_GIT_OPERATIONS = 34;
  WORKER_SERVICE_OPERATION_GIT_OPERATION_GET = 35;
  WORKER_SERVICE_OPERATION_GIT_OPERATION_START = 36;
  WORKER_SERVICE_OPERATION_GIT_OPERATION_CANCEL = 37;
  WORKER_SERVICE_OPERATION_GIT_APPLY_HUNK = 38;
  // What is still restorable under the execution host's own
  // `.armadra/trash/`. A read, so it cannot share a number with the restore
  // that follows it: the two have opposite replay rules.
  WORKER_SERVICE_OPERATION_FILE_ENTRY_TRASH_LIST = 39;
  WORKER_SERVICE_OPERATION_FILE_INFO = 40;
  WORKER_SERVICE_OPERATION_FILE_ENTRY_CREATE = 41;
  WORKER_SERVICE_OPERATION_FILE_ENTRY_RENAME = 42;
  WORKER_SERVICE_OPERATION_FILE_ENTRY_MOVE = 43;
  WORKER_SERVICE_OPERATION_FILE_ENTRY_DELETE = 44;
  WORKER_SERVICE_OPERATION_FILE_ENTRY_RESTORE = 45;
  // The source file is already on the execution host; the Worker copies it
  // into that host's own `.armadra/assets/`. Bytes from a browser travel as
  // WorkerUploadRequest instead.
  WORKER_SERVICE_OPERATION_ASSET_IMPORT = 46;
  WORKER_SERVICE_OPERATION_WATCH_SUBSCRIBE = 47;
  WORKER_SERVICE_OPERATION_WATCH_UNSUBSCRIBE = 48;
  reserved 49;
  // The reference log of one ref, and the two reads that were added with it:
  // several checkouts' status in one answer, and whether a Frame's worktree
  // binding still names a checkout of the repository it claims. They are here
  // rather than in the git block above because the numbers only ever grow —
  // renumbering the block would move every operation an SSH host already
  // answers.
  WORKER_SERVICE_OPERATION_GIT_REFLOG = 50;
  WORKER_SERVICE_OPERATION_GIT_STATUS_BATCH = 51;
  WORKER_SERVICE_OPERATION_GIT_WORKTREE_BINDING = 52;
}
// A version-locked payload, not a cross-version wire contract: both ends are
// the same Armadra build, asserted by WorkerHelloResponse.runtime_version, and
// the bytes are the Runtime's own camelCase JSON for that operation. Field
// numbers stay reserved so a future typed replacement is additive.
message WorkerServiceRequest {
  string root_id = 1;
  WorkerServiceOperation operation = 2;
  bytes request_json = 3;
  // Workspace grants resolved by the controller. The Worker re-checks them; a
  // missing grant fails on the execution host, it is not merely not sent.
  bool allow_write = 4;
  bool allow_execute = 5;
}
message WorkerServiceResponse {
  // The status the same operation would have returned over the Runtime's HTTP
  // surface, so a remote failure keeps its own code instead of becoming 500.
  uint32 http_status = 1;
  bytes response_json = 2;
}

// Native filesystem watching on the execution host (design §3.4). The
// operation is one of WATCH_SUBSCRIBE / WATCH_UNSUBSCRIBE; anything else is
// refused rather than treated as a subscribe, so a mistyped request never
// registers a watcher nobody asked for.
message WorkerWatchRequest {
  string root_id = 1;
  WorkerServiceOperation operation = 2;
  repeated string paths = 3;
}
// The receipt for a subscribe or unsubscribe. `sequence` is the number the
// next event on this connection will carry, so a controller that reconnects
// knows where the new stream starts rather than guessing from the old one.
message WorkerWatchSubscription {
  string root_id = 1;
  uint32 watched_paths = 2;
  uint64 sequence = 3;
}
// `kind` is `modified`, `removed` or `replaced`, the same three the local
// watcher publishes. A removal carries no digest, size or mtime.
message WorkerWatchChange {
  string path = 1;
  string kind = 2;
  string sha256 = 3;
  uint64 size = 4;
  string mtime = 5;
}
// An unsolicited frame: `WorkerResponse.request_id` is empty, which is what
// distinguishes it from an answer. `sequence` is monotonic per connection, so
// a gap after a reconnect is visible and reconciled by one poll.
message WorkerWatchEvent {
  string root_id = 1;
  uint64 sequence = 2;
  repeated WorkerWatchChange changes = 3;
}

// Chunked upload to the execution host (design §3.1). The Worker writes a
// temporary file beside the destination and publishes it atomically only once
// the whole stream hashes to `sha256`, so a dropped connection leaves the
// destination untouched rather than half written.
message WorkerUploadBegin {
  string root_id = 1;
  string path = 2;
  uint64 total_bytes = 3;
  // Lowercase hexadecimal SHA-256 of the complete file the caller will send.
  string sha256 = 4;
  // The content version being replaced. Absent means create-only, the same
  // rule WorkerWriteFileRequest follows.
  optional string overwrite_sha256 = 5;
  // The workspace's write grant, resolved by the controller and re-checked
  // here: an upload is a write, and the same rule that governs
  // WorkerServiceRequest governs it. A begin without the grant is refused, so
  // a controller that skipped its own check cannot even occupy the host's
  // temporary space.
  bool allow_write = 6;
}
message WorkerUploadChunk {
  string upload_id = 1;
  uint64 offset = 2;
  bytes data = 3;
}
message WorkerUploadCommit { string upload_id = 1; }
message WorkerUploadAbort { string upload_id = 1; }
message WorkerUploadRequest {
  oneof step {
    WorkerUploadBegin begin = 1;
    WorkerUploadChunk chunk = 2;
    WorkerUploadCommit commit = 3;
    WorkerUploadAbort abort = 4;
  }
}
// Every step answers with the bytes accepted so far. `sha256` and `path` are
// filled in by the commit, and `path` is the workspace-relative destination
// the file actually landed on.
message WorkerUploadResponse {
  string upload_id = 1;
  uint64 received_bytes = 2;
  string sha256 = 3;
  string path = 4;
}

message WorkerRequest {
  string request_id = 1;
  string host_id = 2;
  string expected_instance_id = 3;
  int64 deadline_unix_ms = 4;
  oneof action {
    WorkerHelloRequest hello = 10;
    RegisterRootRequest register_root = 11;
    WorkerListDirectoryRequest list_directory = 12;
    WorkerReadFileRequest read_file = 13;
    WorkerWriteFileRequest write_file = 14;
    WorkerServiceRequest service = 15;
    WorkerWatchRequest watch = 16;
    WorkerUploadRequest upload = 17;
    CommandRequest command = 20;
    // Proxied to the Runtime that owns the PTY. Only present when the Worker
    // was started with a state directory and found a live local Runtime.
    AgentRequest agent = 21;
    SetWriteOwnershipRequest set_write_ownership = 22;
    GetWriteOwnershipRequest get_write_ownership = 23;
    // Editor language services (language service design §2.8). Discovery
    // starts nothing and is answered on either connection. Everything else —
    // session open/close, edit application and `language_frame` — belongs to
    // the separate `worker --stdio --language-link` connection, because the
    // two connections are two processes and only that one holds the servers.
    // That connection abandons one-question-one-answer so a server can push
    // diagnostics; a `language_frame` carries no request id and is answered by
    // nothing.
    LanguageCapabilitiesRequest language_capabilities = 30;
    OpenLanguageSessionRequest open_language_session = 31;
    CloseLanguageSessionRequest close_language_session = 32;
    LanguageFrame language_frame = 33;
    LanguageApplyEditRequest language_apply_edit = 34;
    LanguageControlRequest language_control = 35;
    // The rollback direction of the switch: the Host's reverse export package
    // is applied to the Runtime's own database before the epoch is handed
    // back. Applying it does not move ownership, and refusing it is what stops
    // a rollback that would lose whatever the Host wrote.
    ApplyReverseExportRequest apply_reverse_export = 24;
    // The settings domain's own frame (§2.4). It reads and writes the
    // execution host's settings file and nothing else: it never moves an
    // epoch, so a controller that exported a document still has to complete
    // the switch through the ownership frames above.
    WorkerSettingsRequest settings = 25;
    // The filesystem domain (business migration §2.9). 25 belongs to the
    // settings domain; this one is 26 so the two land independently.
    FilesystemWorkerRequest filesystem = 26;
    // The session domain (§2.6, §2.9). It carries both halves the Host needs
    // from the execution side: the reads a switch and a handback are verified
    // against, and the run commands — start, signal, reclaim, capture — that
    // the Host issues once it owns the intent but never the process.
    SessionWorkerRequest session = 27;
    // The agent domain (§2.7, §2.9). It is named `agent_host` because 21 is
    // already `agent`: that one writes a prompt into a PTY, this one carries
    // the records the Host owns once the domain has switched. Two frames, two
    // meanings, and renaming the released one to make room would break every
    // Worker that already speaks it.
    AgentWorkerRequest agent_host = 28;
    // The git domain (§2.8). 27 and 28 belong to the session and agent
    // domains, whose batches land independently, so this one is 29 rather
    // than the next free number: a frame renumbered at merge time would be a
    // released field number changing meaning.
    GitWorkerRequest git = 29;
  }
}
message WorkerResponse {
  string request_id = 1;
  string host_id = 2;
  string instance_id = 3;
  oneof result {
    WorkerHelloResponse hello = 10;
    RegisteredRoot registered_root = 11;
    WorkerDirectory directory = 12;
    WorkerFileChunk file_chunk = 13;
    ErrorResponse error = 14;
    WorkerFileWritten file_written = 15;
    WorkerServiceResponse service = 16;
    // The only frame a Worker sends without being asked. `request_id` is
    // empty on it and on nothing else.
    WorkerWatchEvent watch_event = 17;
    WorkerWatchSubscription watch = 18;
    WorkerUploadResponse upload = 19;
    CommandResponse command = 20;
    AgentResponse agent = 21;
    WorkerWriteOwnership write_ownership = 22;
    // Closing a session answers `language_session` too, with state STOPPED:
    // the client learns the final state rather than an empty acknowledgement.
    LanguageCapabilities language_capabilities = 30;
    LanguageSession language_session = 31;
    LanguageFrame language_frame = 32;
    LanguageApplyEditResult language_apply_edit = 33;
    LanguageControlResult language_control = 34;
    ReverseImportReport reverse_import = 23;
    WorkerSettingsSnapshot settings = 25;
    FilesystemWorkerResponse filesystem = 26;
    SessionWorkerResponse session = 27;
    AgentWorkerResponse agent_host = 28;
    GitWorkerResponse git = 29;
  }
}
