<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>webview fixture</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #ffffff;
        color: #111111;
        font:
          13px/1.4 -apple-system,
          "Helvetica Neue",
          Arial,
          sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      .hit {
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid #1f6feb;
        background: #dbeafe;
        border-radius: 6px;
        font-weight: 600;
        width: 120px;
        height: 60px;
      }
      #btn-tl {
        left: 8px;
        top: 8px;
      }
      #btn-tr {
        right: 8px;
        top: 8px;
      }
      #btn-bl {
        left: 8px;
        bottom: 8px;
      }
      #btn-br {
        right: 8px;
        bottom: 8px;
      }
      #btn-c {
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 160px;
        background: #fde68a;
        border-color: #b45309;
      }
      #report {
        position: absolute;
        left: 8px;
        top: 148px;
        max-width: 140px;
        overflow: hidden;
        font:
          11px/1.3 ui-monospace,
          Menlo,
          monospace;
        background: #111;
        color: #0f0;
        padding: 2px 4px;
        border-radius: 3px;
        white-space: pre;
      }
      #scroller {
        position: absolute;
        left: 150px;
        top: 76px;
        width: 200px;
        height: 52px;
        overflow: auto;
        border: 1px solid #999;
        background: #fafafa;
        padding: 4px;
        -webkit-user-select: text;
        user-select: text;
      }
      #sel {
        position: absolute;
        left: 150px;
        top: 204px;
        width: 120px;
      }
      #ime {
        position: absolute;
        left: 290px;
        top: 204px;
        width: 150px;
      }
      /* Black-on-white text with no AA-defeating effects: the raster probe crops this. */
      #raster {
        position: absolute;
        left: 140px;
        top: 232px;
        width: 240px;
        height: 28px;
        background: #ffffff;
        color: #000000;
        font:
          16px/28px "Helvetica Neue",
          Helvetica,
          Arial,
          sans-serif;
        letter-spacing: 0.5px;
        white-space: nowrap;
        overflow: hidden;
      }
      #seltext {
        position: absolute;
        left: 140px;
        top: 264px;
        width: 240px;
        -webkit-user-select: text;
        user-select: text;
        font:
          14px/18px ui-monospace,
          Menlo,
          monospace;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="report">boot</div>
    <button class="hit" id="btn-tl">TL</button>
    <button class="hit" id="btn-tr">TR</button>
    <button class="hit" id="btn-bl">BL</button>
    <button class="hit" id="btn-br">BR</button>
    <button class="hit" id="btn-c">CENTER</button>

    <div id="scroller">
      <div id="scroll-inner"></div>
    </div>

    <select id="sel">
      <option value="alpha">alpha</option>
      <option value="beta">beta</option>
      <option value="gamma">gamma</option>
    </select>
    <input id="ime" type="text" placeholder="ime target" />

    <div id="raster">Hamburgefons 0123 IIIll</div>
    <div id="seltext">SELECTABLE-TEXT-MARKER-0123456789</div>

    <script>
      (function () {
        const params = new URLSearchParams(location.search);
        const tag = params.get("tag") || "guest";

        // Load counter: the whole point of acceptance item 6. sessionStorage survives
        // in-place re-layout and dies with the guest process, so a bump == a reload.
        const loadCount =
          Number(sessionStorage.getItem("loadCount") || "0") + 1;
        sessionStorage.setItem("loadCount", String(loadCount));
        // sessionStorage is per-webContents: a *replaced* guest starts over at 1,
        // so it cannot tell "never reloaded" from "reloaded into a new process".
        // localStorage is shared by the partition and gives a cumulative count.
        const persistKey = "loadCountPersistent:" + tag;
        const loadCountPersistent =
          Number(localStorage.getItem(persistKey) || "0") + 1;
        localStorage.setItem(persistKey, String(loadCountPersistent));

        const state = {
          tag,
          loadCount,
          loadCountPersistent,
          clickCount: 0,
          lastClick: null,
          events: {
            contextmenu: 0,
            wheel: 0,
            change: 0,
            compositionstart: 0,
            compositionend: 0,
            keydown: 0,
          },
          lastContextMenu: null,
        };
        window.__probe = state;

        const report = document.getElementById("report");
        function paint() {
          const c = state.lastClick;
          report.textContent =
            tag +
            " load=" +
            state.loadCount +
            "/" +
            state.loadCountPersistent +
            " n=" +
            state.clickCount +
            (c
              ? " hit=" + c.id + " @" + c.clientX + "," + c.clientY
              : " hit=-");
        }
        paint();

        // Long scrollable content.
        const inner = document.getElementById("scroll-inner");
        let lines = "";
        for (let i = 0; i < 120; i += 1) lines += "scroll line " + i + "\n";
        inner.textContent = lines;
        inner.style.whiteSpace = "pre";

        document.addEventListener(
          "click",
          function (event) {
            state.clickCount += 1;
            const top = document.elementFromPoint(event.clientX, event.clientY);
            state.lastClick = {
              n: state.clickCount,
              id: (event.target && event.target.id) || "",
              elementFromPointId: (top && top.id) || "",
              clientX: event.clientX,
              clientY: event.clientY,
              screenX: event.screenX,
              screenY: event.screenY,
              dpr: window.devicePixelRatio,
            };
            paint();
          },
          true,
        );

        document.addEventListener("contextmenu", function (event) {
          state.events.contextmenu += 1;
          state.lastContextMenu = {
            id: (event.target && event.target.id) || "",
            clientX: event.clientX,
            clientY: event.clientY,
          };
          // Do not preventDefault: we want Electron's guest `context-menu` to fire too.
        });
        window.addEventListener(
          "wheel",
          function () {
            state.events.wheel += 1;
          },
          { passive: true, capture: true },
        );
        document.getElementById("sel").addEventListener("change", function () {
          state.events.change += 1;
        });
        const ime = document.getElementById("ime");
        ime.addEventListener("compositionstart", function () {
          state.events.compositionstart += 1;
        });
        ime.addEventListener("compositionend", function () {
          state.events.compositionend += 1;
        });
        document.addEventListener("keydown", function () {
          state.events.keydown += 1;
        });

        // Geometry the host asks for, so the probe aims at measured CSS boxes
        // instead of at numbers copied out of this stylesheet.
        window.__geometry = function () {
          const out = {};
          for (const el of document.querySelectorAll("[id]")) {
            const r = el.getBoundingClientRect();
            out[el.id] = { x: r.x, y: r.y, w: r.width, h: r.height };
          }
          out.__viewport = {
            w: window.innerWidth,
            h: window.innerHeight,
            dpr: window.devicePixelRatio,
          };
          return out;
        };
      })();
    </script>
  </body>
</html>
